<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f0e6"><title>Portekizce Öğreniyorum A1</title><style>
:root{--bg:#f6f0e6;--card:#fffdf8;--green:#718172;--green2:#dfe7de;--line:#e4ddd1;--text:#403a34;--muted:#756d64;--gold:#a88c5d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{text-align:center;padding:30px 16px 16px}h1{font-size:27px;margin:0 0 7px}.sub{color:var(--muted);font-size:14px}
nav{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 16px;position:sticky;top:0;background:rgba(246,240,230,.96);z-index:5}nav button{border:0;background:var(--card);color:var(--text);border-radius:20px;padding:11px 15px;white-space:nowrap;font-size:15px}nav button.active{background:var(--green);color:white}
main{max-width:760px;margin:auto;padding:4px 16px 70px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:15px 0 7px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f0ebe2;border-radius:16px;padding:15px}.stat b{font-size:23px;display:block;margin-bottom:3px}
.progress{height:9px;background:#e5dfd4;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}
.item{padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.pt{font-size:21px;font-weight:650}.tr{color:var(--muted);margin-top:4px}.sentence{margin:8px 0;line-height:1.55}
.btn{display:inline-block;border:0;background:#eee7db;color:var(--text);padding:10px 13px;border-radius:12px;text-decoration:none;margin-top:8px}.btn.green{background:var(--green);color:white}.btn.saved{background:#d5e1d4}
.story p{font-size:17px;line-height:1.8}.tok{border-bottom:1px dotted var(--gold);cursor:pointer}.lookup{display:none;background:#f0ebe2;border-radius:13px;padding:11px;margin:8px 0;font-size:14px}.lookup.show{display:block}
.wordtag{display:inline-block;background:var(--green2);padding:7px 9px;border-radius:11px;margin:4px;font-size:14px}.result{padding:10px;border-radius:12px;background:#f0ebe2;margin:8px 0}
.task{background:#f2eadc;border-left:4px solid var(--gold);padding:12px;border-radius:12px}textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:white}.small{font-size:13px;color:var(--muted)}
</style></head><body>

<script>

 teslim almak"}, {"pt": "mandar", "tr": "göndermek"}, {"pt": "levar", "tr": "götürmek"}, {"pt": "trazer", "tr": "getirmek"}, {"pt": "colocar", "tr": "koymak"}, {"pt": "tirar", "tr": "çıkarmak, almak"}, {"pt": "lavar", "tr": "yıkamak"}, {"pt": "limpar", "tr": "temizlemek"}, {"pt": "cozinhar", "tr": "pişirmek"}, {"pt": "viajar", "tr": "seyahat etmek"}, {"pt": "visitar", "tr": "ziyaret etmek"}, {"pt": "rezar", "tr": "dua etmek, namaz kılmak"}, {"pt": "jejuar", "tr": "oruç tutmak"}, {"pt": "memorizar", "tr": "ezberlemek"}, {"pt": "lembrar", "tr": "hatırlamak"}, {"pt": "esquecer", "tr": "unutmak"}, {"pt": "entender", "tr": "anlamak"}, {"pt": "pensar", "tr": "düşünmek"}, {"pt": "achar", "tr": "düşünmek, bulmak"}, {"pt": "acreditar", "tr": "inanmak"}, {"pt": "continuar", "tr": "devam etmek"}, {"pt": "parar", "tr": "durmak"}, {"pt": "correr", "tr": "koşmak"}, {"pt": "sentar", "tr": "oturmak"}, {"pt": "levantar", "tr": "kalkmak"}, {"pt": "acordar", "tr": "uyanmak"}, {"pt": "descansar", "tr": "dinlenmek"}, {"pt": "assistir", "tr": "izlemek"}, {"pt": "verificar", "tr": "kontrol etmek"}, {"pt": "telefonar", "tr": "telefon etmek"}, {"pt": "ligar", "tr": "aramak, açmak"}, {"pt": "enviar", "tr": "göndermek"}, {"pt": "cooperar", "tr": "iş birliği yapmak"}, {"pt": "compartilhar", "tr": "paylaşmak"}, {"pt": "escolher", "tr": "seçmek"}, {"pt": "preferir", "tr": "tercih etmek"}, {"pt": "poder", "tr": "ebilmek"}, {"pt": "dever", "tr": "gerekmek, -meli"}, {"pt": "deixar", "tr": "bırakmak"}, {"pt": "permitir", "tr": "izin vermek"}, {"pt": "tentar", "tr": "denemek"}, {"pt": "conseguir", "tr": "başarmak"}, {"pt": "nascer", "tr": "doğmak"}, {"pt": "morrer", "tr": "ölmek"}, {"pt": "viver", "tr": "yaşamak"}, {"pt": "crescer", "tr": "büyümek"}, {"pt": "agradecer", "tr": "şükretmek, teşekkür etmek"}, {"pt": "abençoar", "tr": "bereketlendirmek"}, {"pt": "perdoar", "tr": "affetmek"}, {"pt": "respeitar", "tr": "saygı göstermek"}, {"pt": "convidar", "tr": "davet etmek"}, {"pt": "acolher", "tr": "ağırlamak, kabul etmek"}, {"pt": "oferecer", "tr": "sunmak"}, {"pt": "servir", "tr": "ikram etmek"}, {"pt": "guardar", "tr": "saklamak"}, {"pt": "cuidar", "tr": "ilgilenmek"}, {"pt": "praticar", "tr": "uygulamak"}], "stories": [{"title": "Camiye Gitmek", "text": "Hoje é um dia tranquilo. João termina o trabalho e vai à mesquita. Ele encontra seu amigo Ali na entrada. Os dois conversam um pouco e depois fazem a oração. João fica feliz porque gosta de rezar com seus amigos.", "words": [["mesquita", "cami"], ["oração", "namaz, dua"], ["amigo", "arkadaş"], ["trabalho", "iş"], ["rezar", "namaz kılmak"]]}, {"title": "Sabah Namazı", "text": "Maria acorda cedo. Ela lava o rosto e faz a ablução. Depois, prepara um lugar limpo e faz a oração da manhã. Ela lê algumas páginas do Alcorão e agradece a Allah pelo novo dia.", "words": [["acorda", "uyanır"], ["ablução", "abdest"], ["manhã", "sabah"], ["Alcorão", "Kur'an"], ["agradece", "şükreder, teşekkür eder"]]}, {"title": "Ramazan Günü", "text": "Durante o Ramadão, Ahmed acorda antes do amanhecer para o suhur. Ele come uma refeição simples e bebe água. Durante o dia, ele jejua e trabalha normalmente. Ao pôr do sol, ele faz a oração e quebra o jejum com sua família.", "words": [["Ramadão", "Ramazan"], ["suhur", "sahur"], ["amanhecer", "tan vakti"], ["jejuar", "oruç tutmak"], ["jejum", "oruç"], ["família", "aile"]]}, {"title": "Ailem", "text": "Minha família mora perto da mesquita. Meu pai trabalha de manhã e minha mãe prepara o almoço. Depois do trabalho, todos se encontram em casa. Nós conversamos, comemos juntos e agradecemos a Allah.", "words": [["família", "aile"], ["pai", "baba"], ["mãe", "anne"], ["almoço", "öğle yemeği"], ["casa", "ev"], ["juntos", "birlikte"]]}, {"title": "Arkadaşım", "text": "Meu amigo Yusuf estuda português todos os dias. Ele lê um texto curto e escreve algumas frases. Quando não entende uma palavra, ele pergunta e aprende. Depois, ele conversa comigo e pratica as palavras novas.", "words": [["amigo", "arkadaş"], ["estuda", "ders çalışır"], ["texto", "metin"], ["frases", "cümleler"], ["entende", "anlar"], ["palavra", "kelime"]]}, {"title": "Kur'an Okumak", "text": "Depois da oração, Hamza senta em um lugar tranquilo e lê o Alcorão. Ele lê devagar para entender as palavras. Depois, escreve uma frase sobre o que aprendeu. Antes de dormir, ele repete as palavras novas.", "words": [["Alcorão", "Kur'an"], ["devagar", "yavaşça"], ["entender", "anlamak"], ["aprendeu", "öğrendi"], ["dormir", "uyumak"], ["repete", "tekrar eder"]]}, {"title": "Pazara Gitmek", "text": "No sábado, Aisha vai ao mercado com sua mãe. Elas compram frutas, pão e água. Aisha pergunta o preço e paga a compra. Na volta, elas encontram uma vizinha e conversam sobre a mesquita do bairro.", "words": [["sábado", "cumartesi"], ["mercado", "pazar"], ["frutas", "meyveler"], ["pão", "ekmek"], ["preço", "fiyat"], ["bairro", "mahalle"]]}, {"title": "Misafiri Ağırlamak", "text": "Hoje a família recebe um convidado. A mãe prepara comida e o pai limpa a sala. Eles oferecem água e comida ao visitante. Depois, todos conversam com respeito e fazem uma pequena dua.", "words": [["convidado", "misafir"], ["comida", "yemek"], ["visitante", "ziyaretçi"], ["oferecem", "ikram ederler"], ["respeito", "saygı"], ["dua", "dua"]]}, {"title": "Cuma Günü", "text": "Na sexta-feira, Omar acorda cedo e se prepara para a oração de sexta-feira. Ele toma banho, veste uma roupa limpa e vai à mesquita. Depois da oração, encontra alguns amigos. Eles conversam e voltam para casa.", "words": [["sexta-feira", "cuma"], ["banho", "banyo"], ["roupa", "kıyafet"], ["limpa", "temiz"], ["oração", "namaz"], ["voltam", "dönerler"]]}, {"title": "Sadaka Vermek", "text": "Fatima vê uma pessoa que precisa de ajuda. Ela compra comida e oferece uma parte para essa pessoa. Depois, ela volta para casa. Sua mãe explica que a caridade deve ser feita com sinceridade e sem esperar recompensa.", "words": [["pessoa", "kişi"], ["ajuda", "yardım"], ["compra", "satın alır"], ["oferece", "sunar"], ["caridade", "sadaka, yardım"], ["sinceridade", "samimiyet"], ["recompensa", "karşılık, ödül"]]}, {"title": "Güzel Bir Gün", "text": "No fim da semana, Bilal acorda cedo. Ele faz a oração, lê um pouco e ajuda sua família em casa. À tarde, visita a mesquita e encontra seus amigos. À noite, agradece a Allah pelo dia e dorme tranquilo.", "words": [["fim", "son"], ["semana", "hafta"], ["ajuda", "yardım eder"], ["visita", "ziyaret eder"], ["agradece", "şükreder, teşekkür eder"], ["tranquilo", "huzurlu"]]}], "dictionary": {"hoje": "bugün", "dia": "gün", "tranquilo": "sakin, huzurlu", "trabalho": "iş", "vai": "gider", "mesquita": "cami", "encontra": "bulur, karşılaşır", "amigo": "arkadaş", "entrada": "giriş", "dois": "iki", "conversam": "sohbet ederler", "fazem": "yaparlar, kılarlar", "oração": "namaz, dua", "fica": "kalır", "feliz": "mutlu", "gosta": "hoşlanır", "rezar": "namaz kılmak", "cedo": "erken", "acorda": "uyanır", "lava": "yıkar", "rosto": "yüz", "faz": "yapar", "ablução": "abdest", "depois": "sonra", "prepara": "hazırlar", "lugar": "yer", "limpo": "temiz", "manhã": "sabah", "algumas": "bazı, birkaç", "páginas": "sayfalar", "Alcorão": "Kur'an", "agradece": "şükreder, teşekkür eder", "Allah": "Allah", "novo": "yeni", "durante": "sırasında", "Ramadão": "Ramazan", "suhur": "sahur", "amanhecer": "tan vakti", "come": "yer", "refeição": "öğün", "simples": "basit", "bebe": "içer", "água": "su", "jejua": "oruç tutar", "normalmente": "normal olarak", "sol": "güneş", "quebra": "bozar", "jejum": "oruç", "família": "aile", "mora": "yaşar, oturur", "perto": "yakın", "pai": "baba", "mãe": "anne", "almoço": "öğle yemeği", "todos": "herkes, her gün", "casa": "ev", "juntos": "birlikte", "estuda": "ders çalışır", "português": "Portekizce", "texto": "metin", "curto": "kısa", "escreve": "yazar", "frases": "cümleler", "quando": "ne zaman, -dığı zaman", "não": "değil", "entende": "anlar", "palavra": "kelime", "pergunta": "sorar", "aprende": "öğrenir", "comigo": "benimle", "pratica": "pratik yapar", "novas": "yeni", "senta": "oturur", "devagar": "yavaşça", "entender": "anlamak", "aprendeu": "öğrendi", "antes": "önce", "dormir": "uyumak", "repete": "tekrar eder", "sábado": "cumartesi", "mercado": "pazar", "compram": "satın alırlar", "frutas": "meyveler", "pão": "ekmek", "preço": "fiyat", "paga": "öder", "compra": "alışveriş", "bairro": "mahalle", "recebe": "ağırlar, alır", "convidado": "misafir", "comida": "yemek", "limpa": "temizler", "sala": "salon", "oferecem": "sunarlar, ikram ederler", "visitante": "ziyaretçi", "respeito": "saygı", "pequena": "küçük", "sexta-feira": "cuma", "banho": "banyo", "veste": "giyer", "roupa": "kıyafet", "voltam": "dönerler", "pessoa": "kişi", "precisa": "ihtiyacı var", "ajuda": "yardım", "oferece": "sunar", "parte": "kısım", "caridade": "sadaka, yardım", "sinceridade": "samimiyet", "sem": "olmadan", "esperar": "beklemek", "recompensa": "karşılık, ödül", "fim": "son", "semana": "hafta", "visita": "ziyaret eder", "noite": "gece"}};
let saved=JSON.parse(localStorage.getItem("pt_saved")||"[]"), completed=JSON.parse(localStorage.getItem("pt_completed")||"[]"), writings=JSON.parse(localStorage.getItem("pt_writings")||"{}"), page="home";
const navItems=[["home","Ana Sayfa"],["lesson","Dersler"],["stories","11 Hikâye"],["verbs","111 Fiil"],["saved","Kelimelerim"]];
function nav(){document.getElementById("nav").innerHTML=navItems.map(x=>'<button class="'+(page===x[0]?"active":"")+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join("")}
function go(p){page=p;nav();render()}
function saveWord(w){saved.includes(w)?saved=saved.filter(x=>x!==w):saved.push(w);localStorage.setItem("pt_saved",JSON.stringify(saved));render()}
function markStory(i){completed.includes(i)?completed=completed.filter(x=>x!==i):completed.push(i);localStorage.setItem("pt_completed",JSON.stringify(completed));render()}
function tokenize(text){return text.split(/(\s+|[,.!?;:()])/).map(x=>{let clean=x.toLowerCase().replace(/^[^a-zà-ÿ]+|[^a-zà-ÿ]+$/gi,"");let key=Object.keys(DATA.dictionary).find(k=>k.toLowerCase()===clean);return key?'<span class="tok" onclick="lookup(event,\''+key.replace(/'/g,"\\'")+'\')">'+x+'</span>':x}).join("")}
function lookup(e,w){e.stopPropagation();let old=document.querySelector(".lookup");if(old)old.remove();let box=document.createElement("div");box.className="lookup show";box.innerHTML='<b>'+w+'</b><br>'+DATA.dictionary[w]+'<br><button class="btn '+(saved.includes(w)?"saved":"")+'" onclick="saveWord(\''+w.replace(/'/g,"\\'")+'\')">'+(saved.includes(w)?"✓ Kaydedildi":"🔖 Kaydet")+'</button>';e.target.parentElement.after(box)}
function answer(el,ok){let r=document.createElement("div");r.className="result";r.innerText=ok?"✓ Doğru cevap":"✗ Tekrar dene";el.parentElement.appendChild(r)}
function saveWriting(i){writings[i]=document.getElementById("writing").value;localStorage.setItem("pt_writings",JSON.stringify(writings));document.getElementById("savedMsg").innerText="Ödev kaydedildi."}
function render(){
let a=document.getElementById("app");
if(page==="home"){let pct=Math.round(completed.length/11*100);a.innerHTML='<div class="card"><h2>A1 İlerlemen</h2><div class="progress"><span style="width:'+pct+'%"></span></div><p class="small">'+completed.length+' / 11 hikâye tamamlandı · '+saved.length+' kayıtlı kelime</p></div><div class="grid"><div class="stat"><b>111</b>fiil</div><div class="stat"><b>111</b>temel cümle</div><div class="stat"><b>11</b>hikâye</div><div class="stat"><b>A1</b>seviye</div></div><div class="card"><h2>Bugünün Görevi</h2><div class="task">Ders 1’i tamamla. Ardından Hikâye 1’i oku, kelimeleri incele, soruları cevapla ve kendi hikâyeni yaz.</div><button class="btn green" onclick="go(\'lesson\')">Derse başla</button></div>'}
if(page==="lesson"){let ws=[["oração","namaz, dua","Eu faço minha oração todos os dias."],["mesquita","cami","Eu vou à mesquita."],["jejum","oruç","O jejum começa de manhã."],["dua","dua","Eu faço uma dua depois da oração."],["caridade","sadaka, yardım","A caridade é importante."]];a.innerHTML='<div class="card"><h2>A1 · Ders 1</h2><p>İslami kelimeler</p>'+ws.map(w=>'<div class="item"><div class="pt">'+w[0]+'</div><div class="tr">'+w[1]+'</div><p class="sentence">'+w[2]+'</p><button class="btn '+(saved.includes(w[0])?"saved":"")+'" onclick="saveWord(\''+w[0]+'\')">'+(saved.includes(w[0])?"✓ Kaydedildi":"🔖 Kelimeyi kaydet")+'</button></div>').join("")+'</div><div class="card"><h2>Örnek alıştırmalar</h2><p>Eu ___ à mesquita.</p><button class="btn" onclick="answer(this,true)">vou</button><button class="btn" onclick="answer(this,false)">vejo</button><p>Eu ___ minha oração.</p><button class="btn" onclick="answer(this,true)">faço</button><button class="btn" onclick="answer(this,false)">digo</button></div>'}
if(page==="verbs"){a.innerHTML='<div class="card"><h2>A1 · 111 Fiil</h2><p class="small">Fiiller Türkçe anlam ve örnek cümle ile listelenir.</p>'+DATA.verbs.map((v,i)=>'<div class="item"><div class="pt">'+(i+1)+'. '+v.pt+'</div><div class="tr">'+v.tr+'</div><p class="sentence">Eu '+v.pt+'.</p></div>').join("")+'</div>'}
if(page==="stories"){a.innerHTML='<div class="card"><h2>A1 · 11 Hikâye</h2><p class="small">Her hikâyeyi oku, kelimelere dokun, anlamı gör, kelimeyi kaydet ve kendi hikâyeni yaz.</p>'+DATA.stories.map((s,i)=>'<div class="item"><h3>'+(i+1)+'. '+s.title+'</h3><p class="small">'+(completed.includes(i)?"✓ Tamamlandı":"Henüz tamamlanmadı")+'</p><button class="btn green" onclick="openStory('+i+')">Hikâyeyi aç</button></div>').join("")+'</div>'}
if(page==="saved"){a.innerHTML='<div class="card"><h2>Kelimelerim</h2><p class="small">'+saved.length+' kelime kayıtlı.</p>'+(saved.length?saved.map(w=>'<div class="item"><div class="pt">'+w+'</div><div class="tr">'+(DATA.dictionary[w]||"Türkçe anlam")+'</div><button class="btn" onclick="saveWord(\''+w.replace(/'/g,"\\'")+'\')">Kaydı kaldır</button></div>').join(""):"Henüz kelime kaydetmedin.")+'</div>'}
}
