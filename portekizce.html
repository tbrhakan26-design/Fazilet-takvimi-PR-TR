<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f0e6"><title>Portekizce Öğreniyorum A1</title><style>
@import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=El+Messiri:wght@400;700&family=Lateef:wght@400;700&family=Markazi+Text:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Rakkas&family=Reem+Kufi:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap');
:root{--bg:#f6f0e6;--card:#fffdf8;--green:#718172;--green2:#dfe7de;--line:#e4ddd1;--text:#403a34;--muted:#756d64;--gold:#a88c5d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{text-align:center;padding:30px 16px 16px}h1{font-size:27px;margin:0 0 7px}.sub{color:var(--muted);font-size:14px}

main{max-width:760px;margin:auto;padding:4px 16px 70px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:15px 0 7px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f0ebe2;border-radius:16px;padding:15px}.stat b{font-size:23px;display:block;margin-bottom:3px}
.progress{height:9px;background:#e5dfd4;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}
.item{padding:14px 0;border-bottom:1px solid var(--line)}
/* Yeni A1 ders ve fiil görünümü */
.lessonGrid{display:grid;grid-template-columns:1fr;gap:10px}.lessonCard{background:#fffdf8;border:1px solid var(--line);border-radius:16px;padding:15px;cursor:pointer}.lessonCard h3{margin:0 0 5px;color:var(--brown2)}.lessonCard p{margin:0;color:var(--muted);font-size:14px}.lessonDetail .lessonExample{background:#f2eadc;border-left:4px solid var(--green);padding:13px;border-radius:12px;margin-top:12px}.lessonDetail .lessonTr{margin-top:6px;color:var(--muted)}
.verbItem{padding:12px 2px;border-bottom:1px solid var(--line)}.verbHead{display:flex;align-items:center;flex-wrap:wrap;gap:3px 6px;font-size:19px;line-height:1.4;color:var(--brown)}.verbNo{font-weight:800}.verbPt{font-weight:800}.verbTr{font-weight:500}.verbAr{font-family:"Amiri",serif;font-size:25px;direction:rtl;display:inline-block;margin-left:2px;color:var(--brown2)}.verbExample{position:relative;margin-top:7px;background:#f2eadc;border-left:4px solid var(--green);border-radius:11px;padding:9px 12px 10px}.verbExample b{display:block;color:var(--brown2);font-size:15px;margin-bottom:4px}.verbExample .ptEx{font-size:16px;line-height:1.5;padding-right:76px}.verbExample .trEx{margin-top:4px;color:var(--muted);font-size:14px;line-height:1.45;padding-right:76px}.verbExample .btn{position:absolute;top:9px;right:10px;margin:0;padding:7px 9px;border-radius:10px;font-size:13px;line-height:1.1}
.lookupPron{margin-top:8px}.lookupPron button{border:0;background:#dfe7de;color:#18553d;border-radius:10px;padding:8px 11px;font-weight:700}
.item:last-child{border-bottom:0}.pt{font-size:21px;font-weight:650}.tr{color:var(--muted);margin-top:4px}.sentence{margin:8px 0;line-height:1.55}
.btn{display:inline-block;border:0;background:#eee7db;color:var(--text);padding:10px 13px;border-radius:12px;text-decoration:none;margin-top:8px}.btn.green{background:var(--green);color:white}.btn.saved{background:#d5e1d4}
.story p{font-size:17px;line-height:1.8}.tok{border-bottom:1px dotted var(--gold);cursor:pointer}.lookup{display:none;background:#f0ebe2;border-radius:13px;padding:11px;margin:8px 0;font-size:14px}.lookup.show{display:block}
.wordtag{display:inline-block;background:var(--green2);padding:7px 9px;border-radius:11px;margin:4px;font-size:14px}.result{padding:10px;border-radius:12px;background:#f0ebe2;margin:8px 0}
.task{background:#f2eadc;border-left:4px solid var(--gold);padding:12px;border-radius:12px}textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:white}.small{font-size:13px;color:var(--muted)}

.khutbahCard{background:transparent;border:0;border-radius:0;padding:0;margin:0}
.khutbahIntro{background:#f0ebe2;border-left:12px solid #65796b;border-radius:28px;padding:18px 22px;margin-bottom:18px;color:var(--muted);line-height:1.6}
.khutbahTitle{font-size:24px;margin:0 0 6px}.khutbahMeta{color:var(--muted);font-size:14px;margin-bottom:18px}
.khutbahOpening{padding:6px 0 18px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.khutbahAyah{font-family:"Amiri",serif;direction:rtl;text-align:center;color:#a52d25;font-size:27px;font-weight:800;line-height:1.9;margin:8px 0 5px}
.khutbahAyahTr{text-align:center;color:#a52d25;font-size:18px;font-weight:800;line-height:1.6;margin:0 0 15px}
.khutbahHadith{font-family:inherit;text-align:center;color:#285f49;font-size:20px;font-weight:800;line-height:1.65;margin:12px 0 4px}
.khutbahHadithTr{text-align:center;color:#285f49;font-size:17px;font-weight:800;line-height:1.55;margin:0 0 10px}
.khutbahBlock{padding:15px 0;border-bottom:1px solid var(--line)}.khutbahBlock:last-child{border-bottom:0}
.khutbahPt{font-family:inherit;font-size:18px;font-weight:800;line-height:1.82;margin:0 0 10px}
.khutbahTr{font-family:inherit;background:#f2eadc;border-left:3px solid #2f6b55;border-radius:28px;padding:16px 20px;color:#5e564e;line-height:1.65;font-size:16px;box-sizing:border-box}
.khutbahHead{font-size:18px;font-weight:750;margin:0 0 10px}.khTok{border-bottom:0!important;text-decoration:none!important;cursor:pointer;padding:2px 4px;margin:0 1px;border-radius:6px;transition:background .15s,box-shadow .15s}.khTok.active{background:#dfe7de!important;box-shadow:0 0 0 1px rgba(47,107,85,.12)}
.khutbahLookup{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,430px);background:#fffaf0;border:1px solid #dfc9a7;box-shadow:0 14px 38px rgba(64,58,52,.22);border-radius:20px;padding:16px 18px;z-index:50;display:none}
.khutbahLookup.show{display:block}.khutbahLookup .popupLabel{font-size:13px;letter-spacing:.08em;color:#8a8177;text-align:center;text-transform:uppercase;margin-bottom:5px}.khutbahLookup b{display:block;font-size:25px;text-align:center;color:#234f40}.khutbahLookup>span{display:block;margin-top:7px;color:#5e564e;font-size:18px;text-align:center}.khutbahLookup .closeWord{position:absolute;right:12px;top:12px;border:0;background:#eee7db;border-radius:9px;padding:4px 8px}.khutbahLookup .lookupExample{margin-top:12px;background:#f2eadc;border-left:5px solid #2f6b55;border-radius:13px;padding:10px 12px}.khutbahLookup .lookupExample .exPt{font-size:15px;line-height:1.5}.khutbahLookup .lookupExample .exTr{font-size:13px;color:#6b625a;margin-top:4px}.khutbahLookup .khWordActions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.khutbahLookup .khWordActions button{border:1px solid #dfc9a7;background:#fff;color:#5a321f;border-radius:14px;padding:10px 6px;font-weight:800;font-size:14px}.khutbahLookup .khWordActions button.saved{background:#d5e1d4}.khutbahLookup .khWordActions button:first-child{color:#8a4a22}.khutbahLookup .khWordActions button:nth-child(2){color:#205c48}.khutbahLookup .khWordActions button:nth-child(3){color:#765b16}

/* Öğrenme görünümü ve kişiselleştirme */
:root{--learn-size:18px;--tr-learn-size:16px;--learn-font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body.font-sade{--learn-font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body.font-serif{--learn-font:Georgia,"Times New Roman",serif}
body.font-rounded{--learn-font:"Trebuchet MS",Arial,sans-serif}
body.font-elegant{--learn-font:Palatino,"Book Antiqua",serif}
body.font-humanist{--learn-font:Verdana,Arial,sans-serif}
body .pt,.lessonDetail .lessonExample,.story p,.sentence,.khutbahPt,.khutbahTr,.verbHead,.verbExample,.lookup,.tok,.khTok,.lessonCard,.wordtag,.task,textarea{font-family:var(--learn-font)!important}
body .pt{font-size:var(--learn-size)!important;font-weight:600!important}
body .tr{font-size:var(--tr-learn-size)!important}
.verbHead{font-size:calc(var(--learn-size) + 1px)!important}
.verbPt{font-weight:650!important}.verbNo{font-weight:700!important}
.verbExample .ptEx{font-size:calc(var(--learn-size) - 2px)!important}.verbExample .trEx{font-size:calc(var(--tr-learn-size) - 1px)!important}
.khutbahPt{font-size:var(--learn-size)!important;font-weight:450!important;line-height:1.78!important;text-decoration:none!important;border:0!important}
.khutbahTr{font-size:var(--tr-learn-size)!important;text-decoration:none!important;border-left:3px solid #2f6b55!important;border-top:0!important;border-right:0!important;border-bottom:0!important}
.settingsBtn{position:fixed;right:14px;bottom:18px;width:48px;height:48px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:21px;box-shadow:0 8px 24px rgba(64,58,52,.2);z-index:100}
.settingsPanel{position:fixed;right:12px;bottom:76px;width:min(92vw,400px);max-height:78vh;overflow:auto;background:#fffdf8;border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 45px rgba(64,58,52,.22);padding:16px;z-index:99;display:none}
.settingsPanel.show{display:block}.settingsPanel h3{margin:0 0 12px}.settingRow{margin:13px 0}.settingRow label{display:block;font-size:14px;color:var(--muted);margin-bottom:7px}.settingBtns{display:flex;flex-wrap:wrap;gap:7px}.settingBtns button{border:1px solid var(--line);background:#f4eee5;color:var(--text);border-radius:11px;padding:8px 10px;font-size:13px}.settingBtns button.active{background:var(--green);color:#fff;border-color:var(--green)}
.khutbahBlock .khTok.khC1{color:#7b351f;background:#f5dfd6}.khutbahBlock .khTok.khC2{color:#205c48;background:#dfeee6}.khutbahBlock .khTok.khC3{color:#765b16;background:#f4e9c9}.khutbahBlock .khTok.khC4{color:#51466f;background:#e8e2f3}.khutbahBlock .khTok.active{background:#cfe2d5!important;color:#183f31!important}
.khWordActions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.khWordActions button{border:0;background:#eee7db;color:var(--text);border-radius:10px;padding:8px 10px;font-weight:600}.khWordActions button.saved{background:#d5e1d4}

<header><h1>Portekizce Öğreniyorum</h1><div class="sub">A1 · Brezilya Portekizcesi · İslami kelimeler</div></header>
<nav id="nav"></nav><main id="app"></main><button class="settingsBtn" type="button" onclick="toggleSettings()" aria-label="Portekizce ayarları">⚙️</button><div id="ptSettingsPanel" class="settingsPanel"><h3>Portekizce Öğrenme Ayarları</h3><div class="settingRow"><label>Portekizce yazı boyutu</label><div class="settingBtns"><button data-size="15" onclick="setLearnSize(15)">Küçük</button><button data-size="18" onclick="setLearnSize(18)">Normal</button><button data-size="21" onclick="setLearnSize(21)">Büyük</button><button data-size="24" onclick="setLearnSize(24)">Çok büyük</button></div></div><div class="settingRow"><label>Türkçe yazı boyutu</label><div class="settingBtns"><button data-trsize="14" onclick="setTrLearnSize(14)">Küçük</button><button data-trsize="16" onclick="setTrLearnSize(16)">Normal</button><button data-trsize="19" onclick="setTrLearnSize(19)">Büyük</button></div></div><div class="settingRow"><label>Yazı stili</label><div class="settingBtns"><button data-font="sade" onclick="setLearnFont('sade')">Sade</button><button data-font="serif" onclick="setLearnFont('serif')">Serif</button><button data-font="rounded" onclick="setLearnFont('rounded')">Yuvarlak</button><button data-font="elegant" onclick="setLearnFont('elegant')">Zarif</button><button data-font="humanist" onclick="setLearnFont('humanist')">Klasik</button></div></div><div class="settingRow"><label>Arapça yazı stili (10 seçenek)</label><div class="settingBtns"><button data-arabic="amiri" onclick="setArabicFont('amiri')">Amiri</button><button data-arabic="naskh" onclick="setArabicFont('naskh')">Noto Naskh</button><button data-arabic="scheherazade" onclick="setArabicFont('scheherazade')">Scheherazade</button><button data-arabic="lateef" onclick="setArabicFont('lateef')">Lateef</button><button data-arabic="cairo" onclick="setArabicFont('cairo')">Cairo</button><button data-arabic="elmessiri" onclick="setArabicFont('elmessiri')">El Messiri</button><button data-arabic="reem" onclick="setArabicFont('reem')">Reem Kufi</button><button data-arabic="markazi" onclick="setArabicFont('markazi')">Markazi</button><button data-arabic="aref" onclick="setArabicFont('aref')">Aref Ruqaa</button><button data-arabic="rakkas" onclick="setArabicFont('rakkas')">Rakkas</button></div></div></div>
<script>

hayal ederim."},{"pt":"incluir","tr":"dahil etmek","ar":"أَدْخَلَ","example":"Eu incluo novas palavras no meu caderno.","trExample":"Defterime yeni kelimeler eklerim."},{"pt":"indicar","tr":"göstermek, tavsiye etmek","ar":"أَشَارَ","example":"O professor indica um livro simples.","trExample":"Öğretmen basit bir kitap tavsiye eder."},{"pt":"informar","tr":"bilgilendirmek","ar":"أَخْبَرَ","example":"Eu informo minha família sobre a mudança.","trExample":"Ailemi değişiklik hakkında bilgilendiririm."},{"pt":"iniciar","tr":"başlatmak","ar":"بَدَأَ","example":"Eu inicio a aula com uma revisão.","trExample":"Derse bir tekrar ile başlarım."},{"pt":"insistir","tr":"ısrar etmek","ar":"أَصَرَّ","example":"Eu insisto em estudar todos os dias.","trExample":"Her gün çalışmakta ısrar ederim."},{"pt":"inspirar","tr":"ilham vermek","ar":"أَلْهَمَ","example":"Uma boa história inspira os alunos.","trExample":"Güzel bir hikâye öğrencilere ilham verir."},{"pt":"jantar","tr":"akşam yemeği yemek","ar":"تَعَشَّى","example":"Nós jantamos cedo hoje.","trExample":"Bugün erken akşam yemeği yeriz."},{"pt":"julgar","tr":"yargılamak","ar":"حَكَمَ","example":"Eu tento não julgar as pessoas rapidamente.","trExample":"İnsanları hemen yargılamamaya çalışırım."},{"pt":"manter","tr":"sürdürmek, korumak","ar":"حَافَظَ","example":"Eu mantenho uma rotina simples.","trExample":"Basit bir düzeni sürdürürüm."},{"pt":"melhorar","tr":"iyileştirmek","ar":"حَسَّنَ","example":"Eu melhoro meu português com prática.","trExample":"Pratik yaparak Portekizcemi geliştiririm."},{"pt":"mostrar","tr":"göstermek","ar":"أَرَى","example":"Eu mostro o caminho ao visitante.","trExample":"Ziyaretçiye yolu gösteririm."},{"pt":"mudar","tr":"değiştirmek","ar":"غَيَّرَ","example":"Eu mudo meus hábitos aos poucos.","trExample":"Alışkanlıklarımı yavaş yavaş değiştiririm."},{"pt":"necessitar","tr":"ihtiyaç duymak","ar":"احْتَاجَ","example":"Eu necessito de mais tempo para estudar.","trExample":"Ders çalışmak için daha fazla zamana iht ample":"Okul küçük bir dergi yayımlar."},{"pt":"recitar","tr":"tilavet etmek, okumak","ar":"تَلَا","example":"Eu recito alguns versículos depois da oração.","trExample":"Namazdan sonra birkaç ayet okurum."},{"pt":"reconhecer","tr":"tanımak, fark etmek","ar":"اعْتَرَفَ","example":"Eu reconheço meu erro e peço desculpas.","trExample":"Hatamı kabul eder ve özür dilerim."},{"pt":"recordar","tr":"hatırlamak","ar":"تَذَكَّرَ","example":"Eu recordo as palavras da aula.","trExample":"Dersin kelimelerini hatırlarım."},{"pt":"reduzir","tr":"azaltmak","ar":"خَفَّضَ","example":"Eu reduzo o tempo no celular.","trExample":"Telefonda geçirdiğim zamanı azaltırım."},{"pt":"repetir","tr":"tekrarlamak","ar":"كَرَّرَ","example":"Eu repito a frase em voz alta.","trExample":"Cümleyi yüksek sesle tekrarlarım."},{"pt":"reservar","tr":"ayırmak, rezerve etmek","ar":"حَجَزَ","example":"Eu reservo um tempo para a leitura.","trExample":"Okuma için zaman ayırırım."},{"pt":"resolver","tr":"çözmek, halletmek","ar":"حَلَّ","example":"Nós resolvemos o problema juntos.","trExample":"Sorunu birlikte çözeriz."},{"pt":"retirar","tr":"çıkarmak, almak","ar":"أَزَالَ","example":"Eu retiro os livros da mesa.","trExample":"Kitapları masadan kaldırırım."},{"pt":"reunir","tr":"bir araya getirmek","ar":"جَمَعَ","example":"A família se reúne depois da oração.","trExample":"Aile namazdan sonra bir araya gelir."},{"pt":"seguir","tr":"takip etmek, devam etmek","ar":"تَبِعَ","example":"Eu sigo o conselho do professor.","trExample":"Öğretmenin tavsiyesine uyarım."},{"pt":"separar","tr":"ayırmak","ar":"فَصَلَ","example":"Eu separo as palavras novas no caderno.","trExample":"Yeni kelimeleri defterde ayırırım."},{"pt":"simplificar","tr":"basitleştirmek","ar":"بَسَّطَ","example":"Eu simplifico a frase para entendê-la.","trExample":"Cümleyi anlamak için basitleştiririm."},{"pt":"sorrir","tr":"gülümsemek","ar":"ابْتَسَمَ","example":"Eu sorrio quando encontro meus amigos.","trExample":"Arkadaşlarımla karşılaştığımda gülümserim."},{"pt":"sugerir","tr":"önermek","ar":"اقْتَرَحَ","example":"Eu sugiro uma atividade para a turma.","trExample":"Sınıfa bir etkinlik öneririm."},{"pt":"tocar","tr":"dokunmak, çalmak","ar":"لَمَسَ","example":"Eu toco na tela para ouvir a pronúncia.","trExample":"Telaffuzu duymak için ekrana dokunurum."},{"pt":"traduzir","tr":"çevirmek","ar":"تَرْجَمَ","example":"Eu traduzo uma frase para o turco.","trExample":"Bir cümleyi Türkçeye çeviririm."},{"pt":"treinar","tr":"alıştırma yapmak","ar":"تَدَرَّبَ","example":"Eu treino a pronúncia todos os dias.","trExample":"Her gün telaffuz çalışırım."},{"pt":"unir","tr":"birleştirmek","ar":"جَمَعَ","example":"Nós unimos estudo e prática.","trExample":"Çalışma ile pratiği birleştiririz."},{"pt":"utilizar","tr":"kullanmak","ar":"اسْتَخْدَمَ","example":"Eu utilizo um caderno para novas palavras.","trExample":"Yeni kelimeler için bir defter kullanırım."},{"pt":"valorizar","tr":"değer vermek","ar":"قَدَّرَ","example":"Eu valorizo o tempo com minha família.","trExample":"Ailemle geçirdiğim zamana değer veririm."},{"pt":"visar","tr":"hedeflemek, amaçlamak","ar":"هَدَفَ","example":"Eu viso melhorar um pouco todos os dias.","trExample":"Her gün biraz gelişmeyi amaçlarım."},{"pt":"zelar","tr":"özen göstermek, korumak","ar":"اعْتَنَى","example":"Nós zelamos pela limpeza da sala.","trExample":"Salonun temizliğine özen gösteririz."},{"pt":"aconselhar","tr":"tavsiye etmek","ar":"نَصَحَ","example":"Eu aconselho meu amigo a estudar todos os dias.","trExample":"Arkadaşıma her gün çalışmasını tavsiye ederim."},{"pt":"acrescentar","tr":"eklemek, artırmak","ar":"أَضَافَ","example":"Eu acrescento uma palavra nova ao meu caderno.","trExample":"Defterime yeni bir kelime eklerim."},{"pt":"concluir","tr":"sonuçlandırmak, tamamlamak","ar":"أَتَمَّ","example":"Eu concluo a lição antes do jantar.","trExample":"Dersi akşam yemeğinden önce tamamlarım."},{"pt":"consultar","tr":"danışmak, incelemek","ar":"اسْتَشَارَ","example":"Eu consulto o dicionário quando tenho dúvida.","trExample":"Şüphem olduğunda sözlüğe bakarım."},{"pt":"coordenar","tr":"koordine etmek","ar":"نَسَّقَ","example":"Eu coordeno o estudo com o trabalho.","trExample":"Ders çalışmayı işle uyumlu hale getiririm."},{"pt":"cumprimentar","tr":"selamlamak","ar":"سَلَّمَ","example":"Eu cumprimento meus vizinhos pela manhã.","trExample":"Sabahları komşularımı selamlarım."},{"pt":"dedicar","tr":"adamak, ayırmak","ar":"خَصَّصَ","example":"Eu dedico uma hora ao estudo.","trExample":"Ders çalışmaya bir saat ayırırım."},{"pt":"distribuir","tr":"dağıtmak","ar":"وَزَّعَ","example":"Eu distribuo os livros aos alunos.","trExample":"Kitapları öğrencilere dağıtırım."}],"stories":[{"title":"Camiye Gitmek","text":"Hoje é um dia tranquilo. João termina o trabalho e vai à mesquita. Ele encontra seu amigo Ali na entrada. Os dois conversam um pouco e depois fazem a oração. João fica feliz porque gosta de rezar com seus amigos.","words":[["mesquita","cami"],["oração","namaz, dua"],["amigo","arkadaş"],["trabalho","iş"],["rezar","namaz kılmak"]]},{"title":"Sabah Namazı","text":"Maria acorda cedo. Ela lava o rosto e faz a ablução. Depois, prepara um lugar limpo e faz a oração da manhã. Ela lê algumas páginas do Alcorão e agradece a Allah pelo novo dia.","words":[["acorda","uyanır"],["ablução","abdest"],["manhã","sabah"],["Alcorão","Kur'an"],["agradece","şükreder, teşekkür eder"]]},{"title":"Ramazan Günü","text":"Durante o Ramadão, Ahmed acorda antes do amanhecer para o suhur. Ele come uma refeição simples e bebe água. Durante o dia, ele jejua e trabalha normalmente. Ao pôr do sol, ele faz a oração e quebra o jejum com sua família.","words":[["Ramadão","Ramazan"],["suhur","sahur"],["amanhecer","tan vakti"],["jejuar","oruç tutmak"],["jejum","oruç"],["família","aile"]]},{"title":"Ailem","text":"Minha família mora perto da mesquita. Meu pai trabalha de manhã e minha mãe prepara o almoço. Depois do trabalho, todos se encontram em casa. Nós conversamos, comemos juntos e agradecemos a Allah.","words":[["família","aile"],["pai","baba"],["mãe","anne"],["almoço","öğle yemeği"],["casa","ev"],["juntos","birlikte"]]},{"title":"Arkadaşım","text":"Meu amigo Yusuf estuda português todos os dias. Ele lê um texto curto e escreve algumas frases. Quando não entende uma palavra, ele pergunta e aprende. Depois, ele conversa comigo e pratica as palavras novas.","words":[["amigo","arkadaş"],["estuda","ders çalışır"],["texto","metin"],["frases","cümleler"],["entende","anlar"],["palavra","kelime"]]},{"title":"Kur'an Okumak","text":"Depois da oração, Hamza senta em um lugar tranquilo e lê o Alcorão. Ele lê devagar para entender as palavras. Depois, escreve uma frase sobre o que aprendeu. Antes de dormir, ele repete as palavras novas.","words":[["Alcorão","Kur'an"],["devagar","yavaşça"],["entender","anlamak"],["aprendeu","öğrendi"],["dormir","uyumak"],["repete","tekrar eder"]]},{"title":"Pazara Gitmek","text":"No sábado, Aisha vai ao mercado com sua mãe. Elas compram frutas, pão e água. Aisha pergunta o preço e paga a compra. Na volta, elas encontram uma vizinha e conversam sobre a mesquita do bairro.","words":[["sábado","cumartesi"],["mercado","pazar"],["frutas","meyveler"],["pão","ekmek"],["preço","fiyat"],["bairro","mahalle"]]},{"title":"Misafiri Ağırlamak","text":"Hoje a família recebe um convidado. A mãe prepara comida e o pai limpa a sala. Eles oferecem água e comida ao visitante. Depois, todos conversam com respeito e fazem uma pequena dua.","words":[["convidado","misafir"],["comida","yemek"],["visitante","ziyaretçi"],["oferecem","ikram ederler"],["respeito","saygı"],["dua","dua"]]},{"title":"Cuma Günü","text":"Na sexta-feira, Omar acorda cedo e se prepara para a oração de sexta-feira. Ele toma banho, veste uma roupa limpa e vai à mesquita. Depois da oração, encontra alguns amigos. Eles conversam e voltam para casa.","words":[["sexta-feira","cuma"],["banho","banyo"],["roupa","kıyafet"],["limpa","temiz"],["oração","namaz"],["voltam","dönerler"]]},{"title":"Sadaka Vermek","text":"Fatima vê uma pessoa que precisa de ajuda. Ela compra comida e oferece uma parte para essa pessoa. Depois, ela volta para casa. Sua mãe explica que a caridade deve ser feita com sinceridade e sem esperar recompensa.","words":[["pessoa","kişi"],["ajuda","yardım"],["compra","satın alır"],["oferece","sunar"],["caridade","sadaka, yardım"],["sinceridade","samimiyet"],["recompensa","karşılık, ödül"]]},{"title":"Güzel Bir Gün","text":"No fim da semana, Bilal acorda cedo. Ele faz a oração, lê um pouco e ajuda sua família em casa. À tarde, visita a mesquita e encontra seus amigos. À noite, agradece a Allah pelo dia e dorme tranquilo.","words":[["fim","son"],["semana","hafta"],["ajuda","yardım eder"],["visita","ziyaret eder"],["agradece","şükreder, teşekkür eder"],["tranquilo","huzurlu"]]},{"title":"Sabahın Bereketi","text":"Todos os dias, Mehmet acorda cedo antes do nascer do sol. Ele abre a janela, respira o ar fresco e agradece a Allah pela oportunidade de começar um novo dia. Depois, faz a ablução com calma e prepara um pequeno café da manhã. Enquanto come, revisa cinco palavras em português que aprendeu na noite anterior. Mais tarde, vai à mesquita para a oração da manhã. No caminho, encontra um vizinho idoso e o cumprimenta com respeito. Depois da oração, os dois conversam por alguns minutos. Mehmet volta para casa, organiza seus livros e começa a estudar. Ele sabe que pequenos esforços, repetidos todos os dias, podem trazer grandes resultados.","words":[["acorda","uyanır"],["nascer do sol","güneşin doğuşu"],["janela","pencere"],["oportunidade","fırsat"],["ablução","abdest"],["revisa","tekrar eder"],["vizinho","komşu"],["esforços","çabalar"]]},{"title":"Uma Visita à Biblioteca","text":"Depois da oração da manhã, Yusuf decide visitar a biblioteca do bairro. Ele precisa encontrar um livro simples para praticar português. Ao entrar, cumprimenta a funcionária e pergunta onde estão os livros para iniciantes. Ela mostra uma estante perto da janela. Yusuf escolhe um livro curto, senta-se em uma mesa tranquila e começa a ler devagar. Quando encontra uma palavra desconhecida, ele toca no dicionário do celular e anota o significado em seu caderno. Depois de uma hora, percebe que entende muito mais do que antes. Antes de sair, devolve o livro e agradece à funcionária pela ajuda. Em casa, conta à família o que aprendeu e decide voltar à biblioteca no sábado seguinte.","words":[["biblioteca","kütüphane"],["bairro","mahalle"],["funcionária","çalışan kadın"],["estante","kitaplık"],["iniciante","başlangıç seviyesi"],["desconhecida","bilinmeyen"],["significado","anlam"],["devolve","geri verir"]]},{"title":"O Mercado de Sexta-Feira","text":"Na sexta-feira, Aisha acompanha sua mãe ao mercado. Antes de sair, elas fazem uma pequena lista para não esquecer nada. No mercado, compram arroz, frutas, legumes, pão e água. Aisha pergunta o preço de cada produto e aprende novas palavras enquanto conversa com os vendedores. Depois, vê uma senhora carregando muitas sacolas e oferece ajuda. A senhora agradece e sorri. Aisha fica feliz porque sua mãe sempre ensina que ajudar os outros é uma boa atitude. Quando terminam as compras, elas encontram uma vizinha e conversam sobre a oração de sexta-feira. Em casa, Aisha ajuda a guardar os alimentos. À noite, ela escreve algumas frases sobre o dia e percebe que aprendeu português sem sentir que estava estudando.","words":[["lista","liste"],["arroz","pirinç"],["legumes","sebzeler"],["produto","ürün"],["vendedores","satıcılar"],["carregando","taşıyan"],["sacolas","poşetler"],["alimentos","gıdalar"]]},{"title":"Um Dia de Estudo","text":"Carlos quer melhorar seu português, mas às vezes acha difícil estudar sozinho. Por isso, cria uma rotina simples. Depois do café da manhã, ele estuda durante quarenta minutos. Primeiro, lê um texto curto. Depois, escreve frases usando as palavras novas. Em seguida, escuta a pronúncia e repete cada frase em voz alta. Quando comete um erro, não fica triste. Ele corrige a frase e tenta novamente. À tarde, conversa com um amigo brasileiro e pratica o que aprendeu. O amigo fala devagar e explica algumas expressões comuns. À noite, Carlos revisa o conteúdo antes de dormir. Depois de algumas semanas, percebe que consegue compreender conversas que antes pareciam muito rápidas. Ele entende que aprender uma língua exige paciência, constância e prática diária.","words":[["melhorar","geliştirmek"],["sozinho","tek başına"],["rotina","düzen"],["em seguida","ardından"],["escuta","dinler"],["repete","tekrar eder"],["comete","yapar"],["constância","istikrar"]]},{"title":"O Vizinho Novo","text":"Um novo vizinho chamado Ibrahim chega ao prédio em uma manhã tranquila. Ele traz algumas caixas e parece cansado depois da mudança. João percebe a situação e oferece ajuda. Juntos, levam as caixas até o apartamento. Enquanto trabalham, conversam sobre o bairro, o mercado e a mesquita mais próxima. Ibrahim conta que está aprendendo português e ainda tem dificuldade para entender algumas conversas. João diz que pode ajudá-lo sempre que precisar. No fim da tarde, Ibrahim prepara um chá e convida João para entrar. Eles conversam com calma e descobrem que têm muitos interesses em comum. Antes de ir embora, João deixa seu número de telefone. Ibrahim agradece pela gentileza e diz que ficou feliz por encontrar um vizinho tão prestativo.","words":[["prédio","apartman"],["caixas","kutular"],["mudança","taşınma"],["próxima","yakındaki"],["dificuldade","zorluk"],["sempre que","ne zaman ... ise"],["interesses","ilgiler"],["prestativo","yardımsever"]]},{"title":"Uma Tarde no Parque","text":"Depois do almoço, Sara leva seus dois filhos ao parque. O dia está ensolarado, mas o vento está agradável. As crianças correm, brincam e observam os pássaros nas árvores. Sara senta em um banco e lê algumas páginas de um livro. Depois de alguns minutos, uma amiga chega com sua filha. As crianças começam a brincar juntas enquanto as mães conversam. Sara fala sobre seu estudo de português e conta que está tentando aprender cinco palavras novas por dia. Sua amiga sugere que ela leia pequenas histórias e repita as frases em voz alta. Sara gosta da ideia e decide praticar durante o caminho de volta para casa. Antes de sair do parque, ela recolhe os papéis que encontrou perto do banco e coloca tudo no lixo. Ela ensina aos filhos que cuidar do lugar onde vivemos também é uma forma de responsabilidade.","words":[["ensolarado","güneşli"],["vento","rüzgar"],["pássaros","kuşlar"],["árvores","ağaçlar"],["banco","bank"],["sugere","önerir"],["recolhe","toplar"],["responsabilidade","sorumluluk"]]},{"title":"Preparando o Jantar","text":"No fim da tarde, Omar volta para casa depois do trabalho. Sua esposa já começou a preparar o jantar, mas ainda precisa de alguns ingredientes. Omar verifica a lista e vai rapidamente ao mercado. Ele compra tomates, cebolas, arroz e frango. No caminho de volta, encontra seu irmão, que pergunta se ele precisa de ajuda. Omar responde que está tudo bem, mas convida o irmão para jantar. Em casa, os dois ajudam na cozinha. Um corta os legumes e o outro prepara a mesa. Quando a comida fica pronta, todos se sentam juntos. Antes de comer, agradecem a Allah pela comida e pela oportunidade de estar em família. Durante o jantar, conversam sobre o dia. Depois, limpam a cozinha juntos. Omar percebe que uma tarefa simples fica mais fácil quando todos cooperam.","words":[["ingredientes","malzemeler"],["tomates","domatesler"],["cebolas","soğanlar"],["frango","tavuk"],["rapidamente","hızlıca"],["cozinha","mutfak"],["mesa","masa"],["cooperam","iş birliği yaparlar"]]},{"title":"Uma Pequena Ajuda","text":"Mariam está saindo de casa quando percebe que uma senhora da vizinhança está tentando carregar uma caixa pesada. Ela se aproxima e pergunta se pode ajudar. A senhora aceita com um sorriso. Mariam leva a caixa até a porta e depois espera enquanto a senhora procura a chave. Durante a conversa, descobrem que moram no mesmo bairro há muitos anos, mas nunca tinham conversado. A senhora conta algumas histórias antigas sobre a rua e Mariam escuta com atenção. Antes de se despedirem, a senhora faz uma oração por Mariam e agradece sua gentileza. Mariam volta para casa pensando naquele encontro. Ela percebe que uma pequena ajuda pode criar uma amizade inesperada. À noite, conta tudo à família e escreve uma frase em português sobre o que aconteceu.","words":[["carregar","taşımak"],["caixa","kutu"],["aproxima","yaklaşır"],["chave","anahtar"],["vizinhança","mahalle çevresi"],["antigas","eski"],["gentileza","nezaket"],["inesperada","beklenmedik"]]},{"title":"Aprendendo com um Erro","text":"Pedro está estudando português quando encontra uma frase que não consegue compreender. Ele tenta traduzir sozinho, mas escolhe uma palavra errada. Depois, percebe que a frase ficou sem sentido. Em vez de desistir, Pedro procura a explicação em seu material de estudo. Ele lê novamente o exemplo e entende a diferença entre duas palavras parecidas. Então escreve as duas palavras no caderno e cria uma frase para cada uma. Mais tarde, mostra o exercício ao professor. O professor corrige um pequeno detalhe e elogia o esforço de Pedro. Ele explica que cometer erros faz parte do aprendizado. Pedro agradece e continua estudando. Naquela noite, ele revisa as duas palavras antes de dormir. No dia seguinte, consegue usá-las corretamente em uma conversa. Pedro fica contente porque percebe que seu erro acabou ajudando-o a aprender melhor.","words":[["frase","cümle"],["traduzir","çevirmek"],["errada","yanlış"],["sentido","anlam"],["desistir","vazgeçmek"],["diferença","fark"],["parecidas","benzer"],["corretamente","doğru şekilde"]]},{"title":"Uma Manhã na Mesquita","text":"Na manhã de domingo, Hamza vai cedo à mesquita. Antes de entrar, ele cumprimenta alguns irmãos que conhece. O lugar está tranquilo e limpo. Depois da oração, um grupo permanece sentado para ler e conversar. Hamza participa da conversa e pergunta sobre algumas palavras em português que ouviu durante a semana. Um dos irmãos explica cada palavra com exemplos simples. Hamza anota tudo em seu caderno. Depois, eles organizam uma pequena atividade para as crianças. Hamza ajuda a preparar os livros e distribui água aos participantes. Quando a atividade termina, todos agradecem uns aos outros. No caminho para casa, Hamza pensa no quanto aprendeu naquela manhã. Ele percebe que estudar uma língua pode acontecer em muitos lugares, especialmente quando há pessoas dispostas a ensinar e ajudar.","words":[["irmãos","kardeşler"],["permanece","kalır"],["grupo","grup"],["ouviu","duydu"],["exemplos","örnekler"],["anota","not alır"],["distribui","dağıtır"],["dispostas","istekli"]]},{"title":"O Plano da Semana","text":"Na noite de domingo, Fatima senta à mesa com seu caderno. Ela quer organizar melhor a semana. Primeiro, escreve os horários das orações. Depois, separa um tempo para o trabalho, a família, o estudo e o descanso. Ela também escolhe três dias para estudar português com mais atenção. Na segunda-feira, pretende revisar verbos. Na quarta-feira, vai ler uma história. No sábado, quer conversar com uma amiga brasileira para praticar. Fatima sabe que seu plano pode mudar, por isso não fica preocupada quando alguma coisa acontece de maneira diferente. O objetivo é manter uma rotina possível e não abandonar o estudo. Antes de fechar o caderno, ela faz uma pequena dua e agradece a Allah pela oportunidade de aprender. Depois, prepara suas coisas para o dia seguinte e vai dormir com tranquilidade.","words":[["horários","horários"],["separa","ayırır"],["descanso","dinlenme"],["pretende","niyet eder"],["revisar","tekrar etmek"],["abandonar","terk etmek"],["possível","mümkün"],["tranquilidade","huzur"]]}],"dictionary":{"hoje":"bugün","dia":"gün","tranquilo":"sakin, huzurlu","trabalho":"iş","vai":"gider","mesquita":"cami","encontra":"bulur, karşılaşır","amigo":"arkadaş","entrada":"giriş","dois":"iki","conversam":"sohbet ederler","fazem":"yaparlar, kılarlar","oração":"na let saved=JSON.parse(localStorage.getItem("pt_saved")||"[]"), completed=JSON.parse(localStorage.getItem("pt_completed")||"[]"), writings=JSON.parse(localStorage.getItem("pt_writings")||"{}"), page="home";
const navItems=[["home","Ana Sayfa"],["lesson","Dersler"],["stories","22 Hikâye"],["verbs","222 Fiil"],["hutbe","Hutbeler"],["saved","Kelimelerim"]];
function nav(){document.getElementById("nav").innerHTML=navItems.map(x=>'<button class="'+(page===x[0]?"active":"")+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join("")}
function go(p){page=p;nav();render()}
function closeLookup(e){e.stopPropagation();document.querySelectorAll('.tok.active').forEach(x=>x.classList.remove('active'));document.querySelector('.lookup')?.remove();activeLookupNode=null;activeLookupWord=null}
function saveWord(w){saved.includes(w)?saved=saved.filter(x=>x!==w):saved.push(w);localStorage.setItem("pt_saved",JSON.stringify(saved));render()}
function markStory(i){completed.includes(i)?completed=completed.filter(x=>x!==i):completed.push(i);localStorage.setItem("pt_completed",JSON.stringify(completed));render()}
const SPECIAL_PT_WORDS=new Set(["oração","mesquita","Alcorão","Allah","Ramadão","suhur","jejum","jejuar","caridade","sinceridade","ablução","purificação","impureza","recompensa","súplica","misericórdia","Senhor","Profeta","Mensageiro","hadith","Islam","Islã","muçulmano","monoteísta","tolerante","reta","Al-Hanifiyyah","As-Samhah","Abraão","Ibrahim","Tevhid","fardo","isr","licença","incrédulos","misericordioso","Louvado","divindade","ressurreição","ressuscitados","bênçãos","paz","pecado","direitos","comunidade","simplificação","pureza","ritual","impureza","lícitas","ilícito","misericórdia","invocação","perdão","autêntico","servos","vitória"]);
function normPT(w){return (w||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[“”".,!?;:()\[\]{}]/g,"").trim()}
function findWordKey(clean){let n=normPT(clean);let k=[...SPECIAL_PT_WORDS].find(x=>normPT(x)===n);if(k)return k;k=Object.keys(DATA.dictionary||{}).find(x=>normPT(x)===n);if(k)return k;let v=(DATA.verbs||[]).find(x=>normPT(x.pt)===n);return v?v.pt:null}
function tokenize(text){return text.split(/(\s+|[,.!?;:()])/).map(x=>{let clean=x.toLowerCase().replace(/^[^a-zà-ÿ-]+|[^a-zà-ÿ-]+$/gi,"");if(!clean)return x;let key=findWordKey(clean)||clean;let isSpecial=!![...SPECIAL_PT_WORDS].find(k=>normPT(k)===normPT(key));let cls=isSpecial?`tok c${([...SPECIAL_PT_WORDS].indexOf([...SPECIAL_PT_WORDS].find(k=>normPT(k)===normPT(key)))%4)+1} special`:`tok`;return `<span class="${cls}" onclick="lookup(event,${JSON.stringify(key)})">${x}</span>`}).join("")}
let activeLookupWord=null, activeLookupNode=null;
function speakPT(word){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(word);u.lang='pt-BR';u.rate=.9;const voices=speechSynthesis.getVoices();const v=voices.find(x=>/^pt-BR$/i.test(x.lang))||voices.find(x=>/^pt/i.test(x.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}
function getWordMeaning(w){let k=findWordKey(w)||w;return DATA.dictionary?.[k]||DATA.dictionary?.[w]||((DATA.verbs||[]).find(v=>normPT(v.pt)===normPT(w))?.tr)||"Türkçe anlamı henüz eklenmedi"}
function getWordExample(w){let v=(DATA.verbs||[]).find(x=>normPT(x.pt)===normPT(w));if(v)return {pt:v.example,tr:v.trExample};let key=normPT(w);for(const st of (DATA.stories||[])){for(const sent of String(st.text||"").split(/(?<=[.!?])\s+/)){if(normPT(sent).includes(key))return {pt:sent,tr:"Bu cümle hikâye metninden alınmıştır."}}}return {pt:w,tr:"Örnek cümle daha sonra eklenecek."}}
function lookup(e,w){e.stopPropagation();const node=e.currentTarget.closest('.tok');if(activeLookupNode===node&&activeLookupWord===w){closeLookup(e);return}document.querySelectorAll('.tok.active').forEach(x=>x.classList.remove('active'));document.querySelector('.lookup')?.remove();activeLookupNode=node;activeLookupWord=w;node.classList.add('active');let box=document.createElement('div');box.className='lookup show';let meaning=getWordMeaning(w), ex=getWordExample(w), isSaved=saved.includes(w);box.innerHTML=`<button class="closeWord" style="position:absolute;right:12px;top:12px;border:0;background:#eee7db;border-radius:9px;padding:4px 8px" onclick="closeLookup(event)">✕</button><div class="popupLabel">Palavra selecionada</div><b>${w}</b><div class="lookupMeaning">${meaning}</div><div class="lookupExample"><div class="exPt">${ex.pt}</div><div class="exTr">${ex.tr}</div></div><div class="lookupActions"><button type="button" onclick='speakPT(${JSON.stringify(w)})'>🔊<br>Telaffuz</button><button type="button" onclick='speakPT(${JSON.stringify(ex.pt)})'>✓<br>Örnek</button><button type="button" class="${isSaved?'saved':''}" onclick='saveWord(${JSON.stringify(w)})'>${isSaved?'✓':'⭐'}<br>${isSaved?'Favorilerde':'Kaydet'}</button></div>`;document.body.appendChild(box)}
function answer(el,ok){let r=document.createElement("div");r.className="result";r.innerText=ok?"✓ Doğru cevap":"✗ Tekrar dene";el.parentElement.appendChild(r)}
function saveWriting(i){writings[i]=document.getElementById("writing").value;localStorage.setItem("pt_writings",JSON.stringify(writings));document.getElementById("savedMsg").innerText="Ödev kaydedildi."}

const KHUTBAH=[
 {head:"Giriş",pt:"Em nome de Deus, o Clemente, o Misericordioso.",tr:"Rahmân ve Rahîm olan Allah’ın adıyla."},
 {head:"Giriş",pt:"Sede benévolos, e não sejais intransigentes!",tr:"Merhametli olun ve katı davranmayın!"},
 {pt:"Louvado seja Deus, com um louvor abundante, puro e abençoado, conforme convém à majestade de Sua Face e à grandeza de Seu Poder. Testemunho que não há divindade além de Deus, testemunho pelo qual vivemos, morreremos e seremos ressuscitados no Dia da Ressurreição. E testemunho que nosso mestre Muhammad é Seu servo e Mensageiro. Ó Deus, concede Tuas bênçãos e paz sobre ele entre os primeiros e os últimos.",tr:"Yüzünün yüceliğine ve kudretinin büyüklüğüne layık, bol, temiz ve bereketli bir hamd ile Allah’a hamd ederim. Allah’tan başka ilâh olmadığına şahitlik ederim. Bu şahitlikle yaşar, ölür ve kıyamet gününde diriltiliriz. Efendimiz Muhammed’in O’nun kulu ve Resûlü olduğuna da şahitlik ederim. Allah’ım, ilklerden ve sonrakilerden olanlar arasında ona salât ve selâm eyle."},
 {head:"Bundan sonra",pt:"Prosseguindo:",tr:"Bundan sonra:"},
 {pt:"A facilidade na jurisprudência islâmica constitui uma das características mais marcantes desta religião e uma dádiva divina por meio da qual Deus Louvado seja elevou a posição desta mensagem eterna.",tr:"İslâm hukukundaki kolaylık, bu dinin en belirgin özelliklerinden ve Allah’ın bu ebedî mesajın değerini yükselttiği ilâhî nimetlerden biridir."},
 {pt:"Todo aquele que contempla as normas da nobre Sharia, em seus diversos aspectos e circunstâncias, percebe claramente que a facilidade e a remoção das dificuldades são objetivos fundamentais.",tr:"Yüce Şeriat’ın farklı yönlerini ve şartlarını inceleyen herkes, kolaylığın ve güçlüklerin kaldırılmasının temel hedeflerden olduğunu açıkça görür."},
 {pt:"Isso é comprovado pelas palavras do Altíssimo reveladas na surata Al Haj versículo 78: \"E não vos impôs dificuldade alguma quanto à religião, porque é o credo de vosso pai, Abraão. Ele vos denominou muçulmanos, antes deste.\", e mencionou na surata Al Bacara versículo 185: \"Deus vos deseja a comodidade e não a dificuldade.\"",tr:"Bu, Yüce Allah’ın Hac sûresi 78. ayette bildirdiği şu sözlerle sabittir: “Dinde size hiçbir güçlük yüklemedi; babanız İbrahim’in dinini esas aldı. Daha önce de size Müslümanlar adını verdi.” Bakara sûresi 185. ayette ise: “Allah sizin için kolaylık ister, zorluk istemez.” buyurmuştur."},
 {pt:"Da mesma forma, os ensinamentos do Mensageiro de Deus (S.A.A.S) esclarecem os propósitos da Sharia.",tr:"Aynı şekilde Allah Resûlü’nün (S.A.A.S.) öğretileri de Şeriat’ın maksatlarını açıklamaktadır."},
 {pt:"O Profeta (S.A.A.S) disse: \"A prática da religião é fácil, e a religião é mais forte do que o fanatismo.\" (Al-Bukhari).",tr:"Peygamber (S.A.A.S.) şöyle buyurmuştur: “Dini yaşamak kolaydır ve din, aşırı taassuptan daha güçlüdür.” (Buhârî)."},
 {pt:"Também (S.A.A.S) disse: \"A melhor parte de vossa religião é a mais fácil; a melhor parte de vossa religião é a mais fácil; a melhor parte de vossa religião é a mais fácil.\" (Ahmad).",tr:"Yine (S.A.A.S.) şöyle buyurmuştur: “Dininizin en hayırlı kısmı en kolay olanıdır; dininizin en hayırlı kısmı en kolay olanıdır; dininizin en hayırlı kısmı en kolay olanıdır.” (Ahmed)."},
 {pt:"E em outra passagem ainda o Profeta (S.A.A.S) afirmou: \"Deus ama que Suas concessões sejam aceitas, assim como ama que Suas obrigações sejam cumpridas.\" (Ibn Hibban).",tr:"Başka bir yerde Peygamber (S.A.A.S.) şöyle buyurmuştur: “Allah, ruhsatlarının kabul edilmesini, farzlarının yerine getirilmesini sevdiği gibi sever.” (İbn Hibbân)."},
 {pt:"E, conforme narrou Jabir ibn Abdullah (que Deus esteja satisfeito com ele), que o Profeta (S.A.A.S) declarou: \"Deus não me enviou para impor dificuldades nem para agir com rigor; enviou-me como mestre e facilitador.\" (Muslim).",tr:"Câbir b. Abdullah’ın (Allah ondan razı olsun) rivayetine göre Peygamber (S.A.A.S.) şöyle buyurmuştur: “Allah beni zorluk çıkarmak ve sert davranmak için göndermedi; beni bir öğretici ve kolaylaştırıcı olarak gönderdi.” (Müslim)."},
 {head:"Manifestações da facilidade na Jurisprudência Islâmica",pt:"Manifestações da facilidade na Jurisprudência Islâmica",tr:"İslâm hukukunda kolaylığın tezahürleri."},
 {head:"1. A abertura da porta do arrependimento",pt:"1. A abertura da porta do arrependimento",tr:"1. Tövbe kapısının açık olması."},
 {pt:"Deus, Exaltado seja, revelou na surata Al Zummar versículo 53: \"Dize: Ó Meus servos que transgredistes contra vós mesmos! Não desespereis da misericórdia de Deus. Em verdade, Deus perdoa todos os pecados. Ele é, por certo, o Perdoador, o Misericordioso.\"",tr:"Yüce Allah Zümer sûresi 53. ayette şöyle buyurmuştur: “De ki: Ey nefislerine karşı haddi aşan kullarım! Allah’ın rahmetinden ümit kesmeyin. Şüphesiz Allah bütün günahları bağışlar. O, gerçekten çok bağışlayıcı ve çok merhametlidir.”"},
 {pt:"Alguns podem não perceber a grandeza dessa facilidade até conhecerem a legislação dos povos anteriores.",tr:"Bazıları, önceki toplumların hükümlerini öğreninceye kadar bu kolaylığın büyüklüğünü fark etmeyebilir."},
 {pt:"Quando o povo de Moisés (Que a paz esteja com ele) adorou o bezerro de ouro e desejou arrepender-se, Deus determinou-lhes uma prova extremamente severa: deveriam matar uns aos outros para que seu arrependimento fosse aceito.",tr:"Mûsâ’nın (aleyhisselâm) kavmi altın buzağıya tapıp tövbe etmek istediğinde Allah onlara son derece ağır bir imtihan yükledi: Tövbenin kabul edilmesi için birbirlerini öldürmeleri gerekiyordu."},
 {pt:"Deus Louvado seja revelou na surata Al Bacara 54: \"Ó povo meu, por certo que vos condenastes, ao adorardes o bezerro. Voltai, portanto, arrependidos, penitenciando-vos para o vosso Criador, e imolai-vos mutuamente. Isso será preferível aos olhos de vosso Criador. Ele vos absolverá, porque é o Remissório, o Misericordiosíssimo.\"",tr:"Allah Teâlâ Bakara sûresi 54. ayette şöyle buyurmuştur: “Ey kavmim! Buzağıya tapmanız sebebiyle gerçekten kendinize zulmettiniz. Yaratıcınıza tövbe edin ve birbirinizi öldürün. Bu, Yaratıcınız katında sizin için daha hayırlıdır. Böylece O sizin tövbenizi kabul eder. Çünkü O, tövbeleri çok kabul eden ve çok merhamet edendir.”"},
 {pt:"Quanto ao Islam, a misericórdia e a facilidade manifestam-se no fato de que o arrependimento sincero basta para que Deus aceite o servo.",tr:"İslâm’da ise rahmet ve kolaylık, kulun samimi tövbesinin Allah tarafından kabul edilmesi için yeterli olmasında görülür."},
 {pt:"Quem abandona o pecado, arrepende-se sinceramente, decide não voltar a cometê-lo e restitui os direitos de seus proprietários, encontrará Deus Altíssimo aceitando seu arrependimento.",tr:"Günahı terk eden, samimiyetle tövbe eden, ona bir daha dönmemeye karar veren ve hak sahiplerinin haklarını iade eden kimse, Yüce Allah’ı tövbesini kabul etmiş olarak bulacaktır."},
 {head:"2. A facilidade nas regras da purificação",pt:"2. A facilidade nas regras da purificação",tr:"2. Temizlik hükümlerindeki kolaylık."},
 {pt:"Entre as graças concedidas a esta comunidade está a simplificação das normas relativas à pureza ritual.",tr:"Bu ümmete verilen nimetlerden biri de taharet hükümlerinin kolaylaştırılmasıdır."},
 {pt:"Nas legislações anteriores, quando uma roupa era atingida por impureza, era necessário cortar a parte contaminada.",tr:"Önceki şeriatlarda bir elbiseye necaset bulaştığında, bulaşan kısmın kesilmesi gerekiyordu."},
 {pt:"Conforme relatado pelo Imam Ahmad, o Mensageiro de Deus (S.A.A.S) disse: \"Quando a urina atingia a roupa de um dos filhos de Israel, eles cortavam a parte atingida com uma tesoura.\"",tr:"İmam Ahmed’in rivayetine göre Allah Resûlü (S.A.A.S.) şöyle buyurmuştur: “İsrâiloğullarından birinin elbisesine idrar bulaştığında, bulaşan kısmı makasla keserlerdi.”"},
 {pt:"Na Jurisprudência Islâmica, entretanto, basta lavar a parte impura com água pura.",tr:"İslâm hukukunda ise necis olan kısmı temiz suyla yıkamak yeterlidir."},
 {head:"3. A facilidade no jejum",pt:"3. A facilidade no jejum",tr:"3. Oruçtaki kolaylık."},
 {pt:"Deus Exaltado seja permitiu que o doente, o viajante, a gestante e a lactante interrompam o jejum, conforme mencionado na surata Al Bacara versículo 184: \"o cumprir o jejum, por achar-se enfermo ou em viagem, jejuará, depois, o mesmo número de dias.\"",tr:"Yüce Allah Bakara sûresi 184. ayette belirtildiği üzere hastanın ve yolcunun orucunu ertelemesine izin vermiştir: “Kim hasta veya yolcu olursa, tutamadığı günler sayısınca başka günlerde oruç tutsun.”"},
 {pt:"O Profeta (S.A.A.S) disse: \"Deus dispensou o viajante de metade da oração e do jejum, e concedeu licença à gestante e à lactante.\" (Narrado por An-Nasa'i).",tr:"Peygamber (S.A.A.S.) şöyle buyurmuştur: “Allah yolcudan namazın ve orucun yarısını kaldırmış, hamile ve emziren kadına da ruhsat vermiştir.” (Nesâî)."},
 {pt:"Também faz parte dessa misericórdia o fato de que quem come ou bebe por esquecimento durante o jejum não invalida seu jejum.",tr:"Bu rahmetin bir yönü de oruçlu kimsenin unutarak yiyip içmesinin orucunu bozmamasıdır."},
 {pt:"O Profeta (S.A.A.S) disse: \"Quem comer ou beber por esquecimento enquanto jejua deve completar seu jejum, pois foi Deus Quem o alimentou e o saciou.\" (Narrado por An-Nasa'i).",tr:"Peygamber (S.A.A.S.) şöyle buyurmuştur: “Kim oruçlu olduğu hâlde unutarak yer veya içerse orucunu tamamlasın. Çünkü onu Allah yedirmiş ve içirmiştir.” (Nesâî)."},
 {pt:"Esses são apenas alguns exemplos entre muitos outros que demonstram que a Sharia Islâmica é apropriada para todos os tempos e lugares, sendo fundamentada na facilidade e na remoção das dificuldades. Essa é uma característica exclusiva da religião do Islam.",tr:"Bunlar, İslâm Şeriatı’nın bütün zamanlara ve mekânlara uygun olduğunu, kolaylık ve güçlüklerin kaldırılması esasına dayandığını gösteren birçok örnekten sadece birkaçıdır. Bu, İslâm dininin kendine özgü bir özelliğidir."},
 {pt:"O Profeta (S.A.A.S) disse: \"Fui enviado com a religião monoteísta, reta e tolerante.\"",tr:"Peygamber (S.A.A.S.) şöyle buyurmuştur: “Ben tevhid üzere, dosdoğru ve hoşgörülü bir din ile gönderildim.”"},
 {pt:"E Ibn Abbas (que Deus esteja satisfeito com ambos) relatou que perguntaram ao Mensageiro de Deus (S.A.A.S): \"Qual religião é a mais amada por Deus?\" Ele (S.A.A.S) respondeu: \"A religião monoteísta, reta e tolerante.\" (Narrado por Ahmad).",tr:"İbn Abbas (Allah ikisinden de razı olsun), Allah Resûlü’ne (S.A.A.S.) “Allah’ın en çok sevdiği din hangisidir?” diye sorulduğunu, onun da “Tevhid üzere, dosdoğru ve hoşgörülü din” diye cevap verdiğini rivayet etmiştir. (Ahmed)."},
 {pt:"O Profeta Muhammad (S.A.A.S) disse: “Fui enviado com a religião monoteísta, reta e tolerante (Al-Hanifiyyah As-Samhah).”.",tr:"Peygamber Muhammed (S.A.A.S.) şöyle buyurmuştur: “Ben Hanîf ve semhâ din ile gönderildim.” (Al-Hanîfiyyetü’s-Semha)."},
 {pt:"E foi narrado por Ibn Abbas (que Deus esteja satisfeito com ambos) que perguntaram ao Mensageiro de Deus (S.A.A.S): \"Qual religião é a mais amada por Deus?\" Ele respondeu: \"A religião monoteísta, reta e tolerante (Al-Hanifiyyah As-Samhah).\" (Narrado por Ahmad).",tr:"İbn Abbas’tan (Allah ikisinden de razı olsun) rivayet edildiğine göre Allah Resûlü’ne “Allah’ın en sevdiği din hangisidir?” diye sorulmuş, o da “Hanîf ve semhâ din” diye cevap vermiştir. (Ahmed)."},
 {pt:"A expressão Al-Hanifiyyah refere-se à religião que se afasta da falsidade e se volta para a verdade, isto é, o monoteísmo puro legado pelo Profeta Abraão (Ibrahim). Já As-Samhah significa a religião fácil, moderada, tolerante e desprovida de rigor excessivo.",tr:"Al-Hanîfiyye ifadesi, bâtıldan uzaklaşıp hakka yönelen, yani Peygamber İbrahim’in miras bıraktığı saf tevhid dinini ifade eder. As-Semha ise kolay, mutedil, hoşgörülü ve aşırı sertlikten uzak din demektir."},
 {pt:"Entre as nobres características do Mensageiro de Deus (S.A.A.S) está o fato de ter sido enviado como facilitador, portador de boas novas e libertador dos pesados fardos e das severas restrições que recaíam sobre as comunidades anteriores.",tr:"Allah Resûlü’nün (S.A.A.S.) güzel vasıflarından biri, kolaylaştırıcı, müjdeleyici ve önceki ümmetlerin üzerindeki ağır yükleri ve şiddetli kısıtlamaları kaldırıcı olarak gönderilmiş olmasıdır."},
 {pt:"Deus, o Altíssimo, revelou na surata Al Araf versículo 157: \"São aqueles que seguem o Mensageiro, o Profeta iletrado, o qual encontram mencionado em sua Tora e seu Evangelho, o qual lhes recomenda o bem e lhes proíbe o ilícito, prescreve-lhes todo o bem e veda-lhes o imundo, alivia-os dos seus fardos e livra-os dos grilhões que os deprimem.\"",tr:"Yüce Allah A‘râf sûresi 157. ayette şöyle buyurmuştur: “Onlar, yanlarındaki Tevrat ve İncil’de yazılı buldukları ümmî Peygamber olan Resûl’e uyan kimselerdir. O, onlara iyiliği emreder, kötülüğü yasaklar, temiz şeyleri helâl, pis şeyleri haram kılar, üzerlerindeki ağır yükleri ve zincirleri kaldırır.”"},

function khNorm(w){return w.toLowerCase().replace(/[“”".,!?;:()\[\]{}]/g,'').trim()}
function khGloss(w){let n=normPT(w);let hk=Object.keys(HUTBE_GLOSS).find(x=>normPT(x)===n);if(hk)return HUTBE_GLOSS[hk];let dk=findWordKey(w);return DATA.dictionary?.[dk]||DATA.dictionary?.[w]||"Türkçe karşılığı bağlama göre değişebilir"}
const SPECIAL_KH_WORDS=new Set(["Deus","Allah","Senhor","misericordioso","Louvado","divindade","testemunho","mensageiro","Profeta","bênçãos","paz","ressurreição","oração","purificação","impureza","jejum","súplica","misericórdia","Islam","muçulmano","monoteísta","reta","tolerante","Al-Hanifiyyah","As-Samhah","falsidade","verdade","monoteísmo","Abraão","Ibrahim","ilícito","imundo","fardo","isr","Ummah","Alcorão","hadith","autêntico","invocação","perdão","servos","vitória","incrédulos","caridade","sinceridade"]);
function tokenizeKhutbah(text){return text.split(/(\s+|[,.!?;:()])/).map(x=>{if(!x.trim())return x;let clean=khNorm(x);let isSpecial=[...SPECIAL_KH_WORDS].some(w=>khNorm(w)===clean)||[...SPECIAL_PT_WORDS].some(w=>normPT(w)===normPT(clean));let cls=isSpecial?`khTok khC${(["1","2","3","4"][Math.abs(clean.length)%4])}`:"khTok";return `<span class="${cls}" data-kh-word="${String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${x}</span>`}).join('')}
document.addEventListener('click',function(e){const node=e.target.closest('.khTok');if(!node)return;const word=node.textContent||'';showKhutbahWord(e,word,khGloss(word));});
function showKhutbahWord(e,word,meaning){e.stopPropagation();let box=document.getElementById('khutbahLookup');let node=e.currentTarget;let key=khNorm(word);if(node.classList.contains('active')){closeKhutbahWord(e);return}document.querySelectorAll('.khTok.active').forEach(x=>x.classList.remove('active'));node.classList.add('active');let isSaved=saved.includes(key), ex=getWordExample(key);box.innerHTML=`<button class="closeWord" onclick="closeKhutbahWord(event)">✕</button><div class="popupLabel">Palavra selecionada</div><b>${word}</b><span>${meaning}</span><div class="lookupExample"><div class="exPt">${ex.pt}</div><div class="exTr">${ex.tr}</div></div><div class="khWordActions"><button type="button" onclick="speakPT(${JSON.stringify(word)})">🔊<br>Telaffuz</button><button type="button" onclick="speakPT(${JSON.stringify(ex.pt)})">✓<br>Örnek</button><button type="button" class="${isSaved?'saved':''}" onclick="saveKhutbahWord(${JSON.stringify(key)})">${isSaved?'✓':'⭐'}<br>${isSaved?'Favorilerde':'Kaydet'}</button></div>`;box.classList.add('show')}
function closeKhutbahWord(e){e.stopPropagation();document.querySelectorAll('.khTok.active').forEach(x=>x.classList.remove('active'));document.getElementById('khutbahLookup').classList.remove('show')}
function saveKhutbahWord(w){let key=khNorm(w);if(!key)return;saved.includes(key)?saved=saved.filter(x=>x!==key):saved.push(key);localStorage.setItem('pt_saved',JSON.stringify(saved));let active=document.querySelector('.khTok.active');if(active){showKhutbahWord({stopPropagation(){},currentTarget:active},active.textContent,khGloss(active.textContent));}if(page==='saved')render();}

function setArabicFont(v){['amiri','naskh','scheherazade','lateef','cairo','elmessiri','reem','markazi','aref','rakkas'].forEach(x=>document.body.classList.remove('arabic-'+x));document.body.classList.add('arabic-'+v);localStorage.setItem('pt_arabic_font',v);updateSettingsPanel()}
function updateSettingsPanel(){let p=document.getElementById('ptSettingsPanel');if(!p)return;let sz=localStorage.getItem('pt_learn_size')||18,tr=localStorage.getItem('pt_tr_learn_size')||16,font=localStorage.getItem('pt_learn_font')||'sade',arabic=localStorage.getItem('pt_arabic_font')||'amiri';p.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b.dataset.size==sz));p.querySelectorAll('[data-trsize]').forEach(b=>b.classList.toggle('active',b.dataset.trsize==tr));p.querySelectorAll('[data-font]').forEach(b=>b.classList.toggle('active',b.dataset.font==font));p.querySelectorAll('[data-arabic]').forEach(b=>b.classList.toggle('active',b.dataset.arabic==arabic))}
function applyLearnSettings(){let sz=parseInt(localStorage.getItem('pt_learn_size')||18),tr=parseInt(localStorage.getItem('pt_tr_learn_size')||16),font=localStorage.getItem('pt_learn_font')||'sade',arabic=localStorage.getItem('pt_arabic_font')||'amiri';document.documentElement.style.setProperty('--learn-size',sz+'px');document.documentElement.style.setProperty('--tr-learn-size',tr+'px');document.body.classList.add('font-'+font);setArabicFont(arabic)}

function openStory(i){let s=DATA.stories[i],a=document.getElementById("app");a.innerHTML='<div class="card story"><h2>'+(i+1)+'. '+s.title+'</h2>'+s.text.split(". ").map(p=>'<p>'+tokenize(p+(p.endsWith(".")?"":"."))+'</p>').join("")+'</div><div class="card"><h2>Başlıca kelimeler</h2>'+s.words.map(w=>'<span class="wordtag">'+w[0]+' = '+w[1]+'</span>').join("")+'<p><button class="btn '+(completed.includes(i)?"saved":"")+'" onclick="markStory('+i+')">'+(completed.includes(i)?"✓ Hikâye tamamlandı":"Hikâyeyi tamamladım")+'</button></p></div><div class="card"><h2>Hikâyeye göre soru cevap</h2><p>1. Hikâyenin ana konusu nedir?</p><button class="btn" onclick="answer(this,true)">Günlük hayat ve İslami yaşam</button><button class="btn" onclick="answer(this,false)">Bir spor karşılaşması</button><p>2. Hikâyede hangi kelime cami anlamına gelir?</p><button class="btn" onclick="answer(this,true)">mesquita</button><button class="btn" onclick="answer(this,false)">mercado</button></div><div class="card"><h2>Senin hikâyen</h2><div class="task">Verilen kelimeleri kullanarak benzer bir hikâye yaz: '+s.words.map(w=>w[0]).join(" · ")+'</div><textarea id="writing" placeholder="Portekizce hikâyeni buraya yaz...">'+(writings[i]||"")+'</textarea><button class="btn green" onclick="saveWriting('+i+')">Ödevi kaydet</button><p class="small" id="savedMsg"></p></div>';nav()}
