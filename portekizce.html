mple":"Yeni saate uyum sağlamam gerekiyor."}],"stories":[{"title":"Camiye Gitmek","text":"Hoje é um dia tranquilo. João termina o trabalho e vai à mesquita. Ele encontra seu amigo Ali na entrada. Os dois conversam um pouco e depois fazem a oração. João fica feliz porque gosta de rezar com seus amigos.","words":[["mesquita","cami"],["oração","namaz, dua"],["amigo","arkadaş"],["trabalho","iş"],["rezar","namaz kılmak"]]},{"title":"Sabah Namazı","text":"Maria acorda cedo. Ela lava o rosto e faz a ablução. Depois, prepara um lugar limpo e faz a oração da manhã. Ela lê algumas páginas do Alcorão e agradece a Allah pelo novo dia.","words":[["acorda","uyanır"],["ablução","abdest"],["manhã","sabah"],["Alcorão","Kur'an"],["agradece","şükreder, teşekkür eder"]]},{"title":"Ramazan Günü","text":"Durante o Ramadão, Ahmed acorda antes do amanhecer para o suhur. Ele come uma refeição simples e bebe água. Durante o dia, ele jejua e trabalha normalmente. Ao pôr do sol, ele faz a oração e quebra o jejum com sua família.","words":[["Ramadão","Ramazan"],["suhur","sahur"],["amanhecer","tan vakti"],["jejuar","oruç tutmak"],["jejum","oruç"],["família","aile"]]},{"title":"Ailem","text":"Minha família mora perto da mesquita. Meu pai trabalha de manhã e minha mãe prepara o almoço. Depois do trabalho, todos se encontram em casa. Nós conversamos, comemos juntos e agradecemos a Allah.","words":[["família","aile"],["pai","baba"],["mãe","anne"],["almoço","öğle yemeği"],["casa","ev"],["juntos","birlikte"]]},{"title":"Arkadaşım","text":"Meu amigo Yusuf estuda português todos os dias. Ele lê um texto curto e escreve algumas frases. Quando não entende uma palavra, ele pergunta e aprende. Depois, ele conversa comigo e pratica as palavras novas.","words":[["amigo","arkadaş"],["estuda","ders çalışır"],["texto","metin"],["frases","cümleler"],["entende","anlar"],["palavra","kelime"]]},{"title":"Kur'an Okumak","text":"Depois da oração, Hamza senta em um lugar tranquilo e lê o Alcorão. Ele lê devagar para entender as palavras. Depois, escreve uma frase sobre o que aprendeu. Antes de dormir, ele repete as palavras novas.","words":[["Alcorão","Kur'an"],["devagar","yavaşça"],["entender","anlamak"],["aprendeu","öğrendi"],["dormir","uyumak"],["repete","tekrar eder"]]},{"title":"Pazara Gitmek","text":"No sábado, Aisha vai ao mercado com sua mãe. Elas compram frutas, pão e água. Aisha pergunta o preço e paga a compra. Na volta, elas encontram uma vizinha e conversam sobre a mesquita do bairro.","words":[["sábado","cumartesi"],["mercado","pazar"],["frutas","meyveler"],["pão","ekmek"],["preço","fiyat"],["bairro","mahalle"]]},{"title":"Misafiri Ağırlamak","text":"Hoje a família recebe um convidado. A mãe prepara comida e o pai limpa a sala. Eles oferecem água e comida ao visitante. Depois, todos conversam com respeito e fazem uma pequena dua.","words":[["convidado","misafir"],["comida","yemek"],["visitante","ziyaretçi"],["oferecem","ikram ederler"],["respeito","saygı"],["dua","dua"]]},{"title":"Cuma Günü","text":"Na sexta-feira, Omar acorda cedo e se prepara para a oração de sexta-feira. Ele toma banho, veste uma roupa limpa e vai à mesquita. Depois da oração, encontra alguns amigos. Eles conversam e voltam para casa.","words":[["sexta-feira","cuma"],["banho","banyo"],["roupa","kıyafet"],["limpa","temiz"],["oração","namaz"],["voltam","dönerler"]]},{"title":"Sadaka Vermek","text":"Fatima vê uma pessoa que precisa de ajuda. Ela compra comida e oferece uma parte para essa pessoa. Depois, ela volta para casa. Sua mãe explica que a caridade deve ser feita com sinceridade e sem esperar recompensa.","words":[["pessoa","kişi"],["ajuda","yardım"],["compra","satın alır"],["oferece","sunar"],["caridade","sadaka, yardım"],["sinceridade","samimiyet"],["recompensa","karşılık, ödül"]]},{"title":"Güzel Bir Gün","text":"No fim da semana, Bilal acorda cedo. Ele faz a oração, lê um pouco e ajuda sua família em casa. À tarde, visita a mesquita e encontra seus amigos. À noite, agradece a Allah pelo dia e dorme tranquilo.","words":[["fim","son"],["semana","hafta"],["ajuda","yardım eder"],["visita","ziyaret eder"],["agradece","şükreder, teşekkür eder"],["tranquilo","huzurlu"]]},{"title":"Sabahın Bereketi","text":"Todos os dias, Mehmet acorda cedo antes do nascer do sol. Ele abre a janela, respira o ar fresco e agradece a Allah pela oportunidade de começar um novo dia. Depois, faz a ablução com calma e prepara um pequeno café da manhã. Enquanto come, revisa cinco palavras em português que aprendeu na noite anterior. Mais tarde, vai à mesquita para a oração da manhã. No caminho, encontra um vizinho idoso e o cumprimenta com respeito. Depois da oração, os dois conversam por alguns minutos. Mehmet volta para casa, organiza seus livros e começa a estudar. Ele sabe que pequenos esforços, repetidos todos os dias, podem trazer grandes resultados.","words":[["acorda","uyanır"],["nascer do sol","güneşin doğuşu"],["janela","pencere"],["oportunidade","fırsat"],["ablução","abdest"],["revisa","tekrar eder"],["vizinho","komşu"],["esforços","çabalar"]]},{"title":"Uma Visita à Biblioteca","text":"Depois da oração da manhã, Yusuf decide visitar a biblioteca do bairro. Ele precisa encontrar um livro simples para praticar português. Ao entrar, cumprimenta a funcionária e pergunta onde estão os livros para iniciantes. Ela mostra uma estante perto da janela. Yusuf escolhe um livro curto, senta-se em uma mesa tranquila e começa a ler devagar. Quando encontra uma palavra desconhecida, ele toca no dicionário do celular e anota o significado em seu caderno. Depois de uma hora, percebe que entende muito mais do que antes. Antes de sair, devolve o livro e agradece à funcionária pela ajuda. Em casa, conta à família o que aprendeu e decide voltar à biblioteca no sábado seguinte.","words":[["biblioteca","kütüphane"],["bairro","mahalle"],["funcionária","çalışan kadın"],["estante","kitaplık"],["iniciante","başlangıç seviyesi"],["desconhecida","bilinmeyen"],["significado","anlam"],["devolve","geri verir"]]},{"title":"O Mercado de Sexta-Feira","text":"Na sexta-feira, Aisha acompanha sua mãe ao mercado. Antes de sair, elas fazem uma pequena lista para não esquecer nada. No mercado, compram arroz, frutas, legumes, pão e água. Aisha pergunta o preço de cada produto e aprende novas palavras enquanto conversa com os vendedores. Depois, vê uma senhora carregando muitas sacolas e oferece ajuda. A senhora agradece e sorri. Aisha fica feliz porque sua mãe sempre ensina que ajudar os outros é uma boa atitude. Quando terminam as compras, elas encontram uma vizinha e conversam sobre a oração de sexta-feira. Em casa, Aisha ajuda a guardar os alimentos. À noite, ela escreve algumas frases sobre o dia e percebe que aprendeu português sem sentir que estava estudando.","words":[["lista","liste"],["arroz","pirinç"],["legumes","sebzeler"],["produto","ürün"],["vendedores","satıcılar"],["carregando","taşıyan"],["sacolas","poşetler"],["alimentos","gıdalar"]]},{"title":"Um Dia de Estudo","text":"Carlos quer melhorar seu português, mas às vezes acha difícil estudar sozinho. Por isso, cria uma rotina simples. Depois do café da manhã, ele estuda durante quarenta minutos. Primeiro, lê um texto curto. Depois, escreve frases usando as palavras novas. Em seguida, escuta a pronúncia e repete cada frase em voz alta. Quando comete um erro, não fica triste. Ele corrige a frase e tenta novamente. À tarde, conversa com um amigo brasileiro e pratica o que aprendeu. O amigo fala devagar e explica algumas expressões comuns. À noite, Carlos revisa o conteúdo antes de dormir. Depois de algumas semanas, percebe que consegue compreender conversas que antes pareciam muito rápidas. Ele entende que aprender uma língua exige paciência, constância e prática diária.","words":[["melhorar","geliştirmek"],["sozinho","tek başına"],["rotina","düzen"],["em seguida","ardından"],["escuta","dinler"],["repete","tekrar eder"],["comete","yapar"],["constância","istikrar"]]},{"title":"O Vizinho Novo","text":"Um novo vizinho chamado Ibrahim chega ao prédio em uma manhã tranquila. Ele traz algumas caixas e parece cansado depois da mudança. João percebe a situação e oferece ajuda. Juntos, levam as caixas até o apartamento. Enquanto trabalham, conversam sobre o bairro, o mercado e a mesquita mais próxima. Ibrahim conta que está aprendendo português e ainda tem dificuldade para entender algumas conversas. João diz que pode ajudá-lo sempre que precisar. No fim da tarde, Ibrahim prepara um chá e convida João para entrar. Eles conversam com calma e descobrem que têm muitos interesses em comum. Antes de ir embora, João deixa seu número de telefone. Ibrahim agradece pela gentileza e diz que ficou feliz por encontrar um vizinho tão prestativo.","words":[["prédio","apartman"],["caixas","kutular"],["mudança","taşınma"],["próxima","yakındaki"],["dificuldade","zorluk"],["sempre que","ne zaman ... ise"],["interesses","ilgiler"],["prestativo","yardımsever"]]},{"title":"Uma Tarde no Parque","text":"Depois do almoço, Sara leva seus dois filhos ao parque. O dia está ensolarado, mas o vento está agradável. As crianças correm, brincam e observam os pássaros nas árvores. Sara senta em um banco e lê algumas páginas de um livro. Depois de alguns minutos, uma amiga chega com sua filha. As crianças começam a brincar juntas enquanto as mães conversam. Sara fala sobre seu estudo de português e conta que está tentando aprender cinco palavras novas por dia. Sua amiga sugere que ela leia pequenas histórias e repita as frases em voz alta. Sara gosta da ideia e decide praticar durante o caminho de volta para casa. Antes de sair do parque, ela recolhe os papéis que encontrou perto do banco e coloca tudo no lixo. Ela ensina aos filhos que cuidar do lugar onde vivemos também é uma forma de responsabilidade.","words":[["ensolarado","güneşli"],["vento","rüzgar"],["pássaros","kuşlar"],["árvores","ağaçlar"],["banco","bank"],["sugere","önerir"],["recolhe","toplar"],["responsabilidade","sorumluluk"]]},{"title":"Preparando o Jantar","text":"No fim da tarde, Omar volta para casa depois do trabalho. Sua esposa já começou a preparar o jantar, mas ainda precisa de alguns ingredientes. Omar verifica a lista e vai rapidamente ao mercado. Ele compra tomates, cebolas, arroz e frango. No caminho de volta, encontra seu irmão, que pergunta se ele precisa de ajuda. Omar responde que está tudo bem, mas convida o irmão para jantar. Em casa, os dois ajudam na cozinha. Um corta os legumes e o outro prepara a mesa. Quando a comida fica pronta, todos se sentam juntos. Antes de comer, agradecem a Allah pela comida e pela oportunidade de estar em família. Durante o jantar, conversam sobre o dia. Depois, limpam a cozinha juntos. Omar percebe que uma tarefa simples fica mais fácil quando todos cooperam.","words":[["ingredientes","malzemeler"],["tomates","domatesler"],["cebolas","soğanlar"],["frango","tavuk"],["rapidamente","hızlıca"],["cozinha","mutfak"],["mesa","masa"],["cooperam","iş birliği yaparlar"]]},{"title":"Uma Pequena Ajuda","text":"Mariam está saindo de casa quando percebe que uma senhora da vizinhança está tentando carregar uma caixa pesada. Ela se aproxima e pergunta se pode ajudar. A senhora aceita com um sorriso. Mariam leva a caixa até a porta e depois espera enquanto a senhora procura a chave. Durante a conversa, descobrem que moram no mesmo bairro há muitos anos, mas nunca tinham conversado. A senhora conta algumas histórias antigas sobre a rua e Mariam escuta com atenção. Antes de se despedirem, a senhora faz uma oração por Mariam e agradece sua gentileza. Mariam volta para casa pensando naquele encontro. Ela percebe que uma pequena ajuda pode criar uma amizade inesperada. À noite, conta tudo à família e escreve uma frase em português sobre o que aconteceu.","words":[["carregar","taşımak"],["caixa","kutu"],["aproxima","yaklaşır"],["chave","anahtar"],["vizinhança","mahalle çevresi"],["antigas","eski"],["gentileza","nezaket"],["inesperada","beklenmedik"]]},{"title":"Aprendendo com um Erro","text":"Pedro está estudando português quando encontra uma frase que não consegue compreender. Ele tenta traduzir sozinho, mas escolhe uma palavra errada. Depois, percebe que a frase ficou sem sentido. Em vez de desistir, Pedro procura a explicação em seu material de estudo. Ele lê novamente o exemplo e entende a diferença entre duas palavras parecidas. Então escreve as duas palavras no caderno e cria uma frase para cada uma. Mais tarde, mostra o exercício ao professor. O professor corrige um pequeno detalhe e elogia o esforço de Pedro. Ele explica que cometer erros faz parte do aprendizado. Pedro agradece e continua estudando. Naquela noite, ele revisa as duas palavras antes de dormir. No dia seguinte, consegue usá-las corretamente em uma conversa. Pedro fica contente porque percebe que seu erro acabou ajudando-o a aprender melhor.","words":[["frase","cümle"],["traduzir","çevirmek"],["errada","yanlış"],["sentido","anlam"],["desistir","vazgeçmek"],["diferença","fark"],["parecidas","benzer"],["corretamente","doğru şekilde"]]},{"title":"Uma Manhã na Mesquita","text":"Na manhã de domingo, Hamza vai cedo à mesquita. Antes de entrar, ele cumprimenta alguns irmãos que conhece. O lugar está tranquilo e limpo. Depois da oração, um grupo permanece sentado para ler e conversar. Hamza participa da conversa e pergunta sobre algumas palavras em português que ouviu durante a semana. Um dos irmãos explica cada palavra com exemplos simples. Hamza anota tudo em seu caderno. Depois, eles organizam uma pequena atividade para as crianças. Hamza ajuda a preparar os livros e distribui água aos participantes. Quando a atividade termina, todos agradecem uns aos outros. No caminho para casa, Hamza pensa no quanto aprendeu naquela manhã. Ele percebe que estudar uma língua pode acontecer em muitos lugares, especialmente quando há pessoas dispostas a ensinar e ajudar.","words":[["irmãos","kardeşler"],["permanece","kalır"],["grupo","grup"],["ouviu","duydu"],["exemplos","örnekler"],["anota","not alır"],["distribui","dağıtır"],["dispostas","istekli"]]},{"title":"O Plano da Semana","text":"Na noite de domingo, Fatima senta à mesa com seu caderno. Ela quer organizar melhor a semana. Primeiro, escreve os horários das orações. Depois, separa um tempo para o trabalho, a família, o estudo e o descanso. Ela também escolhe três dias para estudar português com mais atenção. Na segunda-feira, pretende revisar verbos. Na quarta-feira, vai ler uma história. No sábado, quer conversar com uma amiga brasileira para praticar. Fatima sabe que seu plano pode mudar, por isso não fica preocupada quando alguma coisa acontece de maneira diferente. O objetivo é manter uma rotina possível e não abandonar o estudo. Antes de fechar o caderno, ela faz uma pequena dua e agradece a Allah pela oportunidade de aprender. Depois, prepara suas coisas para o dia seguinte e vai dormir com tranquilidade.","words":[["horários","horários"],["separa","ayırır"],["descanso","dinlenme"],["pretende","niyet eder"],["revisar","tekrar etmek"],["abandonar","terk etmek"],["possível","mümkün"],["tranquilidade","huzur"]]},{"title":"Uma manhã tranquila","text":"A manhã começa cedo. Eu acordo, faço minha oração e bebo água. Depois, estudo português por trinta minutos.\n\nSabah erken başlar. Uyanırım, namazımı kılarım ve su içerim. Sonra otuz dakika Portekizce çalışırım.","words":[["manhã","sabah"]]},{"title":"No caminho para a mesquita","text":"Eu caminho até a mesquita. No caminho, encontro um amigo e conversamos sobre a aula.\n\nCamiye kadar yürüyorum. Yolda bir arkadaşımla karşılaşıyorum ve ders hakkında konuşuyoruz.","words":[["caminho","yol"]]},{"title":"Uma nova palavra","text":"Hoje aprendo uma palavra nova. Escrevo a palavra no caderno, leio o exemplo e repito a pronúncia.\n\nBugün yeni bir kelime öğreniyorum. Kelimeyi deftere yazıyorum, örneği okuyorum ve telaffuzu tekrar ediyorum.","words":[["palavra","kelime"]]},{"title":"A família reunida","text":"À noite, minha família se reúne em casa. Nós conversamos, comemos juntos e agradecemos a Allah pela paz.\n\nAkşam ailem evde bir araya geliyor. Konuşuyoruz, birlikte yemek yiyoruz ve huzur için Allah’a şükrediyoruz.","words":[["família","aile"]]},{"title":"Uma pergunta importante","text":"Na aula, eu faço uma pergunta. O professor explica a regra com calma e dá dois exemplos.\n\nDerste bir soru soruyorum. Öğretmen kuralı sakin bir şekilde açıklıyor ve iki örnek veriyor.","words":[["pergunta","soru"]]},{"title":"O caderno verde","text":"Meu caderno tem palavras, frases e pequenas notas. Eu reviso tudo antes de dormir.\n\nDefterimde kelimeler, cümleler ve küçük notlar var. Uyumadan önce hepsini tekrar ediyorum.","words":[["caderno","defter"]]},{"title":"Aprender com erros","text":"Eu cometo um erro na frase. Em vez de ficar triste, corrijo a frase e repito. Assim, aprendo melhor.\n\nCümlede hata yapıyorum. Üzülmek yerine cümleyi düzeltiyorum ve tekrar ediyorum. Böylece daha iyi öğreniyorum.","words":[["erro","hata"]]},{"title":"No mercado","text":"Vou ao mercado depois da aula. Compro pão, leite e frutas. Pergunto o preço e pago com calma.\n\nDersten sonra markete gidiyorum. Ekmek, süt ve meyve alıyorum. Fiyatı soruyor ve sakin bir şekilde ödüyorum.","words":[["mercado","market"]]},{"title":"Um convite","text":"Meu amigo me convida para estudar juntos. Eu aceito porque estudar em grupo pode ser útil.\n\nArkadaşım beni birlikte çalışmaya davet ediyor. Kabul ediyorum çünkü grup halinde çalışmak faydalı olabilir.","words":[["convite","davet"]]},{"title":"O plano da semana","text":"No domingo, faço um plano para a semana. Estudo gramática, leio uma história e reviso dez palavras por dia.\n\nPazar günü hafta için bir plan yapıyorum. Gramer çalışıyor, bir hikâye okuyor ve her gün on kelime tekrar ediyorum.","words":[["plano","plan"]]},{"title":"A chuva","text":"Está chovendo, então fico em casa. Aproveito o tempo para ouvir português e escrever frases.\n\nYağmur yağıyor, bu yüzden evde kalıyorum. Zamanı Portekizce dinlemek ve cümleler yazmak için değerlendiriyorum.","words":[["chuva","yağmur"]]},{"title":"Uma pequena viagem","text":"No fim de semana, faço uma pequena viagem. Levo um livro, uma garrafa de água e meu caderno.\n\nHafta sonu küçük bir seyahat yapıyorum. Yanıma bir kitap, bir şişe su ve defterimi alıyorum.","words":[["viagem","seyahat"]]},{"title":"Na sala de aula","text":"Na sala de aula, os alunos escutam o professor. Depois, praticam perguntas e respostas em pares.\n\nSınıfta öğrenciler öğretmeni dinliyor. Sonra ikili olarak soru ve cevap pratiği yapıyorlar.","words":[["sala de aula","sınıf"]]},{"title":"Uma expressão útil","text":"Aprendo a expressão “com licença”. Uso essa expressão quando quero pedir passagem ou falar com alguém com educação.\n\n“Com licença” ifadesini öğreniyorum. Yol istemek veya biriyle kibarca konuşmak istediğimde bu ifadeyi kullanıyorum.","words":[["expressão","ifade"]]},{"title":"O tempo bem usado","text":"Tenho pouco tempo hoje, mas posso estudar por quinze minutos. Pequenos passos também ajudam.\n\nBugün az zamanım var ama on beş dakika çalışabilirim. Küçük adımlar da yardımcı olur.","words":[["tempo","zaman"]]},{"title":"A oração da manhã","text":"Depois da oração da manhã, sinto tranquilidade. Leio algumas páginas e começo meu trabalho.\n\nSabah namazından sonra huzur hissediyorum. Birkaç sayfa okuyup işime başlıyorum.","words":[["oração","namaz/dua"]]},{"title":"Uma boa notícia","text":"Recebo uma boa notícia de um amigo. Respondo à mensagem e agradeço a Allah.\n\nBir arkadaşımdan güzel bir haber alıyorum. Mesaja cevap veriyor ve Allah’a şükrediyorum.","words":[["notícia","haber"]]},{"title":"O professor paciente","text":"O professor é paciente. Quando alguém não entende, ele explica de outra maneira.\n\nÖğretmen sabırlı. Biri anlamadığında başka bir şekilde açıklıyor.","words":[["paciente","sabırlı"]]},{"title":"A biblioteca","text":"Na biblioteca, encontro livros em português. Escolho um livro simples e começo a ler.\n\nKütüphanede Portekizce kitaplar buluyorum. Basit bir kitap seçip okumaya başlıyorum.","words":[["biblioteca","kütüphane"]]},{"title":"Um hábito novo","text":"Meu novo hábito é revisar palavras antes de dormir. Depois de algumas semanas, lembro de muitas delas.\n\nYeni alışkanlığım uyumadan önce kelimeleri tekrar etmek. Birkaç hafta sonra çoğunu hatırlıyorum.","words":[["hábito","alışkanlık"]]},{"title":"O telefone silencioso","text":"Coloco o telefone no modo silencioso durante a aula. Assim, consigo me concentrar melhor.\n\nDers sırasında telefonu sessiz moda alıyorum. Böylece daha iyi odaklanabiliyorum.","words":[["silencioso","sessiz"]]},{"title":"Uma conversa simples","text":"Olá! Tudo bem? Sim, tudo bem. Você estuda português? Sim, estudo todos os dias.\n\nMerhaba! Her şey yolunda mı? Evet, yolunda. Portekizce çalışıyor musun? Evet, her gün çalışıyorum.","words":[["conversa","konuşma"]]},{"title":"O primeiro dia","text":"No primeiro dia, não entendo tudo. Mas continuo ouvindo e repetindo. Aos poucos, começo a compreender mais.\n\nİlk gün her şeyi anlamıyorum. Ama dinlemeye ve tekrar etmeye devam ediyorum. Yavaş yavaş daha çok anlamaya başlıyorum.","words":[["primeiro","ilk"]]},{"title":"Uma escolha difícil","text":"Tenho duas opções: descansar ou estudar. Escolho estudar por vinte minutos e depois descanso.\n\nİki seçeneğim var: dinlenmek veya çalışmak. Yirmi dakika çalışmayı seçip sonra dinleniyorum.","words":[["escolha","seçim"]]},{"title":"O livro emprestado","text":"Um amigo me empresta um livro. Prometo cuidar dele e devolvê-lo na próxima semana.\n\nBir arkadaşım bana kitap ödünç veriyor. Ona iyi bakacağıma ve gelecek hafta geri vereceğime söz veriyorum.","words":[["emprestado","ödünç"]]},{"title":"No ônibus","text":"No ônibus, sento perto da janela. Aproveito a viagem para revisar palavras no celular.\n\nOtobüste pencerenin yanında oturuyorum. Yolculuğu telefondan kelimeleri tekrar etmek için değerlendiriyorum.","words":[["ônibus","otobüs"]]},{"title":"A pergunta do dia","text":"A pergunta do dia é: por que você estuda português? Minha resposta é simples: quero compreender e comunicar melhor.\n\nGünün sorusu: Neden Portekizce çalışıyorsun? Cevabım basit: daha iyi anlamak ve iletişim kurmak istiyorum.","words":[["pergunta do dia","günün sorusu"]]},{"title":"Um dia de jejum","text":"Durante o jejum, procuro ter paciência e controlar minhas palavras. À noite, agradeço a Allah pela comida.\n\nOruç sırasında sabırlı olmaya ve sözlerimi kontrol etmeye çalışıyorum. Akşam Allah’a yemek için şükrediyorum.","words":[["jejum","oruç"]]},{"title":"Uma visita à mesquita","text":"Faço uma visita à mesquita com meu amigo. Depois da oração, conversamos um pouco e voltamos para casa.\n\nArkadaşımla camiyi ziyaret ediyorum. Namazdan sonra biraz konuşup eve dönüyoruz.","words":[["visita","ziyaret"]]},{"title":"O dia de estudo","text":"Hoje estudo duas lições. Primeiro aprendo a regra, depois faço os exercícios e finalmente leio uma história.\n\nBugün iki ders çalışıyorum. Önce kuralı öğreniyor, sonra alıştırmaları yapıyor ve son olarak bir hikâye okuyorum.","words":[["estudo","çalışma"]]},{"title":"A palavra difícil","text":"Uma palavra parece difícil. Eu separo suas sílabas, escuto a pronúncia e uso a palavra em uma frase.\n\nBir kelime zor görünüyor. Hecelerine ayırıyor, telaffuzunu dinliyor ve kelimeyi bir cümlede kullanıyorum.","words":[["difícil","zor"]]},{"title":"Uma mensagem educada","text":"Escrevo uma mensagem educada: “Olá, tudo bem? Pode me ajudar, por favor?”\n\nKibar bir mesaj yazıyorum: “Merhaba, her şey yolunda mı? Bana yardım edebilir misiniz lütfen?”","words":[["mensagem","mesaj"]]},{"title":"A visita da família","text":"Minha família vem me visitar. Preparamos comida, conversamos e passamos uma tarde tranquila juntos.\n\nAilem beni ziyarete geliyor. Yemek hazırlıyor, konuşuyor ve birlikte sakin bir öğleden sonra geçiriyoruz.","words":[["visitar","ziyaret etmek"]]},{"title":"A meta do mês","text":"Minha meta é aprender trezentas palavras e completar as lições. Eu registro meu progresso toda semana.\n\nHedefim üç yüz kelime öğrenmek ve dersleri tamamlamak. İlerlememi her hafta kaydediyorum.","words":[["meta","hedef"]]},{"title":"O erro de pronúncia","text":"Eu pronuncio uma palavra de forma errada. O professor corrige e eu repito devagar.\n\nBir kelimeyi yanlış telaffuz ediyorum. Öğretmen düzeltiyor ve ben yavaşça tekrar ediyorum.","words":[["pronúncia","telaffuz"]]},{"title":"Um momento de silêncio","text":"Depois de um dia cheio, fico alguns minutos em silêncio. Respiro, penso e agradeço pelas coisas boas.\n\nYoğun bir günden sonra birkaç dakika sessiz kalıyorum. Nefes alıyor, düşünüyor ve güzel şeyler için şükrediyorum.","words":[["silêncio","sessizlik"]]},{"title":"A aula online","text":"A aula começa às oito. Abro o computador, verifico o áudio e participo da conversa.\n\nDers saat sekizde başlıyor. Bilgisayarı açıyor, sesi kontrol ediyor ve konuşmaya katılıyorum.","words":[["online","çevrim içi"]]},{"title":"O café da manhã","text":"No café da manhã, como pão e fruta e bebo água. Depois, preparo meu material de estudo.\n\nKahvaltıda ekmek ve meyve yiyor, su içiyorum. Sonra çalışma malzemelerimi hazırlıyorum.","words":[["café da manhã","kahvaltı"]]},{"title":"A noite de revisão","text":"À noite, reviso as palavras aprendidas durante o dia. As palavras difíceis recebem mais atenção.\n\nAkşam gün içinde öğrendiğim kelimeleri tekrar ediyorum. Zor kelimelere daha fazla dikkat ediyorum.","words":[["revisão","tekrar"]]},{"title":"O objetivo da viagem","text":"Viajar também é uma oportunidade para praticar português. Quero pedir informações, comprar comida e conversar com pessoas.\n\nSeyahat etmek Portekizce pratik yapmak için de bir fırsat. Bilgi istemek, yemek almak ve insanlarla konuşmak istiyorum.","words":[["objetivo","amaç"]]},{"title":"Uma boa decisão","text":"Decido estudar um pouco todos os dias. Não preciso estudar muitas horas; preciso manter a constância.\n\nHer gün biraz çalışmaya karar veriyorum. Saatlerce çalışmam gerekmiyor; devamlılığı korumam gerekiyor.","words":[["decisão","karar"]]},{"title":"A palavra no contexto","text":"Uma palavra pode ter mais de um significado. Por isso, observo a frase inteira antes de escolher a tradução.\n\nBir kelimenin birden fazla anlamı olabilir. Bu yüzden çeviriyi seçmeden önce bütün cümleye bakıyorum.","words":[["contexto","bağlam"]]},{"title":"A revisão de A2","text":"No fim da unidade A2, reviso passado, futuro, pronomes, conectores e expressões do dia a dia.\n\nA2 ünitesinin sonunda geçmişi, geleceği, zamirleri, bağlaçları ve günlük ifadeleri tekrar ediyorum.","words":[["revisão","tekrar"]]},{"title":"Um pequeno progresso","text":"Hoje entendo uma frase que antes parecia difícil. Esse pequeno progresso me dá vontade de continuar.\n\nBugün daha önce zor görünen bir cümleyi anlıyorum. Bu küçük ilerleme devam etme isteği veriyor.","words":[["progresso","ilerleme"]]}],"dictionary":{"hoje":"bugün","dia":"gün","tranquilo":"sakin, huzurlu","trabalho":"iş","vai":"gider","mesquita":"cami","encontra":"bulur, karşılaşır","amigo":"arkadaş","entrada":"giriş","dois":"iki","conversam":"sohbet ederler","fazem":"yaparlar, kılarlar","oração":"namaz, dua","fica":"kalır","feliz":"mutlu","gosta":"hoşlanır","rezar":"namaz kılmak","cedo":"erken","acorda":"uyanır","lava":"yıkar","rosto":"yüz","faz":"yapar","ablução":"abdest","depois":"sonra","prepara":"hazırlar","lugar":"yer","limpo":"temiz","manhã":"sabah","algumas":"bazı, birkaç","páginas":"sayfalar","Alcorão":"Kur'an","agradece":"şükreder, teşekkür eder","Allah":"Allah","novo":"yeni","durante":"sırasında","Ramadão":"Ramazan","suhur":"sahur","amanhecer":"tan vakti","come":"yer","refeição":"öğün","simples":"basit","bebe":"içer","água":"su","jejua":"oruç tutar","normalmente":"normal olarak","sol":"güneş","quebra":"bozar","jejum":"oruç","família":"aile","mora":"yaşar, oturur","perto":"yakın","pai":"baba","mãe":"anne","almoço":"öğle yemeği","todos":"herkes, her gün","casa":"ev" const SPECIAL_PT_WORDS=new Set(["oração","mesquita","Alcorão","Allah","Ramadão","suhur","jejum","jejuar","caridade","sinceridade","ablução","purificação","impureza","recompensa","súplica","misericórdia","Senhor","Profeta","Mensageiro","hadith","Islam","Islã","muçulmano","monoteísta","tolerante","reta","Al-Hanifiyyah","As-Samhah","Abraão","Ibrahim","Tevhid","fardo","isr","licença","incrédulos","misericordioso","Louvado","divindade","ressurreição","ressuscitados","bênçãos","paz","pecado","direitos","comunidade","simplificação","pureza","ritual","impureza","lícitas","ilícito","misericórdia","invocação","perdão","autêntico","servos","vitória"]);
function normPT(w){return (w||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[“”".,!?;:()\[\]{}]/g,"").trim()}
function findWordKey(clean){let n=normPT(clean);let k=[...SPECIAL_PT_WORDS].find(x=>normPT(x)===n);if(k)return k;k=Object.keys(DATA.dictionary||{}).find(x=>normPT(x)===n);if(k)return k;let v=(DATA.verbs||[]).find(x=>normPT(x.pt)===n);return v?v.pt:null}
function tokenize(text){return text.split(/(\s+|[,.!?;:()])/).map(x=>{let clean=x.toLowerCase().replace(/^[^a-zà-ÿ-]+|[^a-zà-ÿ-]+$/gi,"");if(!clean)return x;let key=findWordKey(clean)||clean;let special=[...SPECIAL_PT_WORDS].find(k=>normPT(k)===normPT(key));let cls=special?`tok c${([...SPECIAL_PT_WORDS].indexOf(special)%4)+1} special`:`tok`;return `<span class="${cls}" data-pt-word="${String(key).replace(/&/g,'&amp;').replace(/\"/g,'&quot;')}">${x}</span>`}).join("")}

function speakPT(word){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(word);u.lang='pt-BR';u.rate=.9;const voices=speechSynthesis.getVoices();const v=voices.find(x=>/^pt-BR$/i.test(x.lang))||voices.find(x=>/^pt/i.test(x.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}
function getWordMeaning(w){let n=normPT(w);let k=findWordKey(w)||w;let direct=DATA.dictionary?.[k]||DATA.dictionary?.[w];if(direct)return direct;let v=(DATA.verbs||[]).find(x=>normPT(x.pt)===n);if(v)return v.tr;for(const st of (DATA.stories||[])){let sw=(st.words||[]).find(x=>normPT(x[0])===n);if(sw)return sw[1];}const common={"eu":"ben","você":"sen/siz","ele":"o","ela":"o","nós":"biz","eles":"onlar","elas":"onlar","meu":"benim","minha":"benim","meus":"benim","minhas":"benim","seu":"senin/sizin","sua":"senin/sizin","um":"bir","uma":"bir","o":"belirli tanımlık (eril)","a":"belirli tanımlık (dişil)","os":"belirli tanımlık (çoğul)","as":"belirli tanımlık (çoğul)","de":"-den/-dan, -ın/-in","do":"-ın/-in; do","da":"-ın/-in; da","em":"-de/-da","no":"-de/-da; no","na":"-de/-da; na","para":"-e/-a; için","com":"ile","sem":"olmadan","que":"ki; ne/neyi","não":"hayır, değil","sim":"evet","é":"-dır/-dir","está":"-dır/-dir; bulunuyor","são":"-dırlar/-dirler","tem":"sahip, var","há":"var","como":"nasıl; gibi","quando":"ne zaman","onde":"nerede","porque":"çünkü","mas":"ama","e":"ve","também":"ayrıca","muito":"çok","mais":"daha fazla","hoje":"bugün","amanhã":"yarın","ontem":"dün","dia":"gün","vida":"hayat","casa":"ev","água":"su","livro":"kitap","amigo":"arkadaş","família":"aile","pai":"baba","mãe":"anne","filho":"oğul/evlat","filha":"kız/evlat","tempo":"zaman/hava","bem":"iyi; güzel","bom":"iyi","boa":"iyi","todos":"hepsi/bütün","todas":"hepsi/bütün","cada":"her"};return common[n]||"Türkçe anlamı bu bağlamda öğrenmek için kelimeyi sözlüğüne ekleyebilirsin."}
function getWordExample(w){let v=(DATA.verbs||[]).find(x=>normPT(x.pt)===normPT(w));if(v)return {pt:v.example,tr:v.trExample};let key=normPT(w);for(const st of (DATA.stories||[])){for(const sent of String(st.text||"").split(/(?<=[.!?])\s+/)){if(normPT(sent).includes(key))return {pt:sent,tr:"Bu cümle hikâye metninden alınmıştır."}}}return {pt:w,tr:"Örnek cümle daha sonra eklenecek."}}
function lookup(e,w){e.stopPropagation();const node=e.currentTarget.closest('.tok');if(activeLookupNode===node&&activeLookupWord===w){closeLookup(e);return}document.querySelectorAll('.tok.active').forEach(x=>x.classList.remove('active'));document.querySelector('.lookup')?.remove();activeLookupNode=node;activeLookupWord=w;node.classList.add('active');let box=document.createElement('div');box.className='lookup show';let meaning=getWordMeaning(w), ex=getWordExample(w), isSaved=saved.includes(w);box.innerHTML=`<button class="closeWord" style="position:absolute;right:12px;top:12px;border:0;background:#e8e0d3;border-radius:9px;padding:4px 8px" onclick="closeLookup(event)">✕</button><div class="popupLabel">Palavra selecionada</div><b>${w}</b><div class="lookupMeaning">${meaning}</div><div class="lookupExample"><div class="exPt">${ex.pt}</div><div class="exTr">${ex.tr}</div></div><div class="lookupActions"><button type="button" onclick='speakPT(${JSON.stringify(w)})'>🔊<br>Telaffuz</button><button type="button" onclick='speakPT(${JSON.stringify(ex.pt)})'>✓<br>Örnek</button><button type="button" class="${isSaved?'saved':''}" onclick='saveWord(${JSON.stringify(w)})'>${isSaved?'✓':'⭐'}<br>${isSaved?'Favorilerde':'Kaydet'}</button></div>`;document.body.appendChild(box)}

 {head:"Bundan sonra",pt:"Prosseguindo:",tr:"Bundan sonra:"},
 {pt:"A facilidade na jurisprudência islâmica constitui uma das características mais marcantes desta religião e uma dádiva divina por meio da qual Deus Louvado seja elevou a posição desta mensagem eterna.",tr:"İslâm hukukundaki kolaylık, bu dinin en belirgin özelliklerinden ve Allah’ın bu ebedî mesajın değerini yükselttiği ilâhî nimetlerden biridir."},
 {pt:"Todo aquele que contempla as normas da nobre Sharia, em seus diversos aspectos e circunstâncias, percebe claramente que a facilidade e a remoção das dificuldades são objetivos fundamentais.",tr:"Yüce Şeriat’ın farklı yönlerini ve şartlarını inceleyen herkes, kolaylığın ve güçlüklerin kaldırılmasının temel hedeflerden olduğunu açıkça görür."},
 {pt:"Isso é comprovado pelas palavras do Altíssimo reveladas na surata Al Haj versículo 78: \"E não vos impôs dificuldade alguma quanto à religião, porque é o credo de vosso pai, Abraão. Ele vos denominou muçulmanos, antes deste.\", e mencionou na surata Al Bacara versículo 185: \"Deus vos deseja a comodidade e não a dificuldade.\"",tr:"Bu, Yüce Allah’ın Hac sûresi 78. ayette bildirdiği şu sözlerle sabittir: “Dinde size hiçbir güçlük yüklemedi; babanız İbrahim’in dinini esas aldı. Daha önce de size Müslümanlar adını verdi.” Bakara sûresi 185. ayette ise: “Allah sizin için kolaylık ister, zorluk istemez.” buyurmuştur."},

 {pt:"O Profeta (S.A.A.S) disse: \"A prática da religião é fácil, e a religião é mais forte do que o fanatismo.\" (Al-Bukhari).",tr:"Peygamber (S.A.A.S.) şöyle buyurmuştur: “Dini yaşamak kolaydır ve din, aşırı taassuptan daha güçlüdür.” (Buhârî)."},
 {pt:"Também (S.A.A.S) disse: \"A melhor parte de vossa religião é a mais fácil; a melhor parte de vossa religião é a mais fácil; a melhor parte de vossa religião é a mais fácil.\" (Ahmad).",tr:"Yine (S.A.A.S.) şöyle buyurmuştur: “Dininizin en hayırlı kısmı en kolay olanıdır; dininizin en hayırlı kısmı en kolay olanıdır; dininizin en hayırlı kısmı en kolay olanıdır.” (Ahmed)."},
 {pt:"E em outra passagem ainda o Profeta (S.A.A.S) afirmou: \"Deus ama que Suas concessões sejam aceitas, assim como ama que Suas obrigações sejam cumpridas.\" (Ibn Hibban).",tr:"Başka bir yerde Peygamber (S.A.A.S.) şöyle buyurmuştur: “Allah, ruhsatlarının kabul edilmesini, farzlarının yerine getirilmesini sevdiği gibi sever.” (İbn Hibbân)."},
 {pt:"E, conforme narrou Jabir ibn Abdullah (que Deus esteja satisfeito com ele), que o Profeta (S.A.A.S) declarou: \"Deus não me enviou para impor dificuldades nem para agir com rigor; enviou-me como mestre e facilitador.\" (Muslim).",tr:"Câbir b. Abdullah’ın (Allah ondan razı olsun) rivayetine göre Peygamber (S.A.A.S.) şöyle buyurmuştur: “Allah beni zorluk çıkarmak ve sert davranmak için göndermedi; beni bir öğretici ve kolaylaştırıcı olarak gönderdi.” (Müslim)."},
 {head:"Manifestações da facilidade na Jurisprudência Islâmica",pt:"Manifestações da facilidade na Jurisprudência Islâmica",tr:"İslâm hukukunda kolaylığın tezahürleri."},
 {head:"1. A abertura da porta do arrependimento",pt:"1. A abertura da porta do arrependimento",tr:"1. Tövbe kapısının açık olması."},

 {pt:"Alguns podem não perceber a grandeza dessa facilidade até conhecerem a legislação dos povos anteriores.",tr:"Bazıları, önceki toplumların hükümlerini öğreninceye kadar bu kolaylığın büyüklüğünü fark etmeyebilir."},
 {pt:"Quando o povo de Moisés (Que a paz esteja com ele) adorou o bezerro de ouro e desejou arrepender-se, Deus determinou-lhes uma prova extremamente severa: deveriam matar uns aos outros para que seu arrependimento fosse aceito.",tr:"Mûsâ’nın (aleyhisselâm) kavmi altın buzağıya tapıp tövbe etmek istediğinde Allah onlara son derece ağır bir imtihan yükledi: Tövbenin kabul edilmesi için birbirlerini öldürmeleri gerekiyordu."},
 {pt:"Deus Louvado seja revelou na surata Al Bacara 54: \"Ó povo meu, por certo que vos condenastes, ao adorardes o bezerro. Voltai, portanto, arrependidos, penitenciando-vos para o vosso Criador, e imolai-vos mutuamente. Isso será preferível aos olhos de vosso Criador. Ele vos absolverá, porque é o Remissório, o Misericordiosíssimo.\"",tr:"Allah Teâlâ Bakara sûresi 54. ayette şöyle buyurmuştur: “Ey kavmim! Buzağıya tapmanız sebebiyle gerçekten kendinize zulmettiniz. Yaratıcınıza tövbe edin ve birbirinizi öldürün. Bu, Yaratıcınız katında sizin için daha hayırlıdır. Böylece O sizin tövbenizi kabul eder. Çünkü O, tövbeleri çok kabul eden ve çok merhamet edendir.”"},

 {pt:"Também faz parte dessa misericórdia o fato de que quem come ou bebe por esquecimento durante o jejum não invalida seu jejum.",tr:"Bu rahmetin bir yönü de oruçlu kimsenin unutarak yiyip içmesinin orucunu bozmamasıdır."},
 {pt:"O Profeta (S.A.A.S) disse: \"Quem comer ou beber por esquecimento enquanto jejua deve completar seu jejum, pois foi Deus Quem o alimentou e o saciou.\" (Narrado por An-Nasa'i).",tr:"Peygamber (S.A.A.S.) şöyle buyurmuştur: “Kim oruçlu olduğu hâlde unutarak yer veya içerse orucunu tamamlasın. Çünkü onu Allah yedirmiş ve içirmiştir.” (Nesâî)."},
 {pt:"Esses são apenas alguns exemplos entre muitos outros que demonstram que a Sharia Islâmica é apropriada para todos os tempos e lugares, sendo fundamentada na facilidade e na remoção das dificuldades. Essa é uma característica exclusiva da religião do Islam.",tr:"Bunlar, İslâm Şeriatı’nın bütün zamanlara ve mekânlara uygun olduğunu, kolaylık ve güçlüklerin kaldırılması esasına dayandığını gösteren birçok örnekten sadece birkaçıdır. Bu, İslâm dininin kendine özgü bir özelliğidir."},
 {pt:"O Profeta (S.A.A.S) disse: \"Fui enviado com a religião monoteísta, reta e tolerante.\"",tr:"Peygamber (S.A.A.S.) şöyle buyurmuştur: “Ben tevhid üzere, dosdoğru ve hoşgörülü bir din ile gönderildim.”"},
 {pt:"E Ibn Abbas (que Deus esteja satisfeito com ambos) relatou que perguntaram ao Mensageiro de Deus (S.A.A.S): \"Qual religião é a mais amada por Deus?\" Ele (S.A.A.S) respondeu: \"A religião monoteísta, reta e tolerante.\" (Narrado por Ahmad).",tr:"İbn Abbas (Allah ikisinden de razı olsun), Allah Resûlü’ne (S.A.A.S.) “Allah’ın en çok sevdiği din hangisidir?” diye sorulduğunu, onun da “Tevhid üzere, dosdoğru ve hoşgörülü din” diye cevap verdiğini rivayet etmiştir. (Ahmed)."},
 {pt:"O Profeta Muhammad (S.A.A.S) disse: “Fui enviado com a religião monoteísta, reta e tolerante (Al-Hanifiyyah As-Samhah).”.",tr:"Peygamber Muhammed (S.A.A.S.) şöyle buyurmuştur: “Ben Hanîf ve semhâ din ile gönderildim.” (Al-Hanîfiyyetü’s-Semha)."},
 {pt:"E foi narrado por Ibn Abbas (que Deus esteja satisfeito com ambos) que perguntaram ao Mensageiro de Deus (S.A.A.S): \"Qual religião é a mais amada por Deus?\" Ele respondeu: \"A religião monoteísta, reta e tolerante (Al-Hanifiyyah As-Samhah).\" (Narrado por Ahmad).",tr:"İbn Abbas’tan (Allah ikisinden de razı olsun) rivayet edildiğine göre Allah Resûlü’ne “Allah’ın en sevdiği din hangisidir?” diye sorulmuş, o da “Hanîf ve semhâ din” diye cevap vermiştir. (Ahmed)."},
 {pt:"A expressão Al-Hanifiyyah refere-se à religião que se afasta da falsidade e se volta para a verdade, isto é, o monoteísmo puro legado pelo Profeta Abraão (Ibrahim). Já As-Samhah significa a religião fácil, moderada, tolerante e desprovida de rigor excessivo.",tr:"Al-Hanîfiyye ifadesi, bâtıldan uzaklaşıp hakka yönelen, yani Peygamber İbrahim’in miras bıraktığı saf tevhid dinini ifade eder. As-Semha ise kolay, mutedil, hoşgörülü ve aşırı sertlikten uzak din demektir."},
 {pt:"Entre as nobres características do Mensageiro de Deus (S.A.A.S) está o fato de ter sido enviado como facilitador, portador de boas novas e libertador dos pesados fardos e das severas restrições que recaíam sobre as comunidades anteriores.",tr:"Allah Resûlü’nün (S.A.A.S.) güzel vasıflarından biri, kolaylaştırıcı, müjdeleyici ve önceki ümmetlerin üzerindeki ağır yükleri ve şiddetli kısıtlamaları kaldırıcı olarak gönderilmiş olmasıdır."},
 {pt:"Deus, o Altíssimo, revelou na surata Al Araf versículo 157: \"São aqueles que seguem o Mensageiro, o Profeta iletrado, o qual encontram mencionado em sua Tora e seu Evangelho, o qual lhes recomenda o bem e lhes proíbe o ilícito, prescreve-lhes todo o bem e veda-lhes o imundo, alivia-os dos seus fardos e livra-os dos grilhões que os deprimem.\"",tr:"Yüce Allah A‘râf sûresi 157. ayette şöyle buyurmuştur: “Onlar, yanlarındaki Tevrat ve İncil’de yazılı buldukları ümmî Peygamber olan Resûl’e uyan kimselerdir. O, onlara iyiliği emreder, kötülüğü yasaklar, temiz şeyleri helâl, pis şeyleri haram kılar, üzerlerindeki ağır yükleri ve zincirleri kaldırır.”"},
 {pt:"O termo \"fardo\" (isr) refere-se às legislações rigorosas e às obrigações pesadas impostas às nações que precederam esta comunidade.",tr:"“Yük” (ısr) kelimesi, bu ümmetten önceki milletlere yüklenen ağır şeriat hükümlerini ve ağır sorumlulukları ifade eder."},
 {pt:"Em Sua infinita misericórdia, Deus Louvado seja aliviou a Ummah islâmica, removendo dela esses encargos e tornando lícitas muitas coisas que haviam sido proibidas aos povos anteriores.",tr:"Allah sonsuz rahmetiyle İslâm ümmetinin yükünü hafifletmiş, bu ağır sorumlulukları kaldırmış ve önceki toplumlara haram kılınmış birçok şeyi bu ümmete helâl kılmıştır."},
 {pt:"Por essa razão, o muçulmano recita constantemente esta grandiosa súplica revelada no Alcorão na surata Al Bacara versículo 286: “Ó Senhor nosso, não nos condenes, se nos esquecermos ou nos equivocarmos! Ó Senhor nosso, não nos imponhas carga, como a que impuseste aos nossos antepassados! Ó Senhor nosso, não nos sobrecarregues com o que não podemos suportar! Absolve-nos! Perdoa-nos! Tem misericórdia de nós! Tu és nosso Protetor! Concede-nos a vitória sobre os incrédulos!\"",tr:"Bu sebeple Müslüman, Bakara sûresi 286. ayette yer alan şu büyük duayı sürekli okur: “Rabbimiz! Unutur veya yanılırsak bizi sorumlu tutma. Rabbimiz! Bizden öncekilere yüklediğin gibi bize de ağır bir yük yükleme. Rabbimiz! Gücümüzün yetmediği şeyi bize taşıtma. Bizi affet, bizi bağışla, bize merhamet et. Sen bizim Mevlâmızsın. Kâfirlere karşı bize yardım et.”"},
 {pt:"E em um hadith autêntico, Deus Exaltado seja respondeu a essa súplica dizendo: \"Já o fiz.\" Ou seja, Deus aceitou essa invocação, atendeu ao pedido de Seus servos e concedeu à comunidade de Muhammad (S.A.A.S) a facilidade, a misericórdia e o alívio dos encargos excessivos que pesavam sobre as nações anteriores.",tr:"Sahih bir hadiste, Yüce Allah bu duaya “Bunu yaptım” diye cevap vermiştir. Yani Allah bu yakarışı kabul etmiş, kullarının isteğine karşılık vermiş ve Muhammed ümmetine önceki milletlerin taşıdığı ağır yüklerden kolaylık, rahmet ve kurtuluş vermiştir."},
 {pt:"Ou seja, aceitei vossa súplica e concedi aquilo que Me pedistes.",tr:"Yani: Duanızı kabul ettim ve Benden istediğiniz şeyi size verdim."},
 {pt:"Estas são minhas palavras e rogo perdão a Deus, o Grandioso, por mim e por vós. E nossa última de nossas súplicas é: Louvado seja Deus, Senhor dos mundos.",tr:"Sözlerim bunlardır. Kendim ve sizin için Yüce Allah’tan bağışlanma diliyorum. Dualarımızın sonu da şudur: Âlemlerin Rabbi Allah’a hamd olsun."}
];

function khNorm(w){return w.toLowerCase().replace(/[“”".,!?;:()\[\]{}]/g,'').trim()}
function khGloss(w){let n=normPT(w);let hk=Object.keys(HUTBE_GLOSS).find(x=>normPT(x)===n);if(hk)return HUTBE_GLOSS[hk];return getWordMeaning(w)}
const SPECIAL_KH_WORDS=new Set(["Deus","Allah","Senhor","misericordioso","Louvado","divindade","testemunho","mensageiro","Profeta","bênçãos","paz","ressurreição","oração","purificação","impureza","jejum","súplica","misericórdia","Islam","muçulmano","monoteísta","reta","tolerante","Al-Hanifiyyah","As-Samhah","falsidade","verdade","monoteísmo","Abraão","Ibrahim","ilícito","imundo","fardo","isr","Ummah","Alcorão","hadith","autêntico","invocação","perdão","servos","vitória","incrédulos","caridade","sinceridade"]);
function tokenizeKhutbah(text){return text.split(/(\s+|[,.!?;:()])/).map(x=>{if(!x.trim())return x;let clean=khNorm(x);let isSpecial=[...SPECIAL_KH_WORDS].some(w=>khNorm(w)===clean)||[...SPECIAL_PT_WORDS].some(w=>normPT(w)===normPT(clean));let cls=isSpecial?`khTok khC${(["1","2","3","4"][Math.abs(clean.length)%4])}`:"khTok";return `<span class="${cls}" data-kh-word="${String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${x}</span>`}).join('')}
document.addEventListener('click',function(e){const node=e.target.closest('.khTok');if(!node)return;const word=node.textContent||'';showKhutbahWord(e,word,khGloss(word));});
function showKhutbahWord(e,word,meaning){e.stopPropagation();let box=document.getElementById('khutbahLookup');let node=e.currentTarget;let key=khNorm(word);if(node.classList.contains('active')){closeKhutbahWord(e);return}document.querySelectorAll('.khTok.active').forEach(x=>x.classList.remove('active'));node.classList.add('active');let isSaved=saved.includes(key), ex=getWordExample(key);box.innerHTML=`<button class="closeWord" onclick="closeKhutbahWord(event)">✕</button><div class="popupLabel">Palavra selecionada</div><b>${word}</b><span>${meaning}</span><div class="lookupExample"><div class="exPt">${ex.pt}</div><div class="exTr">${ex.tr}</div></div><div class="khWordActions"><button type="button" onclick="speakPT(${JSON.stringify(word)})">🔊<br>Telaffuz</button><button type="button" onclick="speakPT(${JSON.stringify(ex.pt)})">✓<br>Örnek</button><button type="button" class="${isSaved?'saved':''}" onclick="saveKhutbahWord(${JSON.stringify(key)})">${isSaved?'✓':'⭐'}<br>${isSaved?'Favorilerde':'Kaydet'}</button></div>`;box.classList.add('show')}
function closeKhutbahWord(e){e.stopPropagation();document.querySelectorAll('.khTok.active').forEach(x=>x.classList.remove('active'));document.getElementById('khutbahLookup').classList.remove('show')}
function saveKhutbahWord(w){let key=khNorm(w);if(!key)return;saved.includes(key)?saved=saved.filter(x=>x!==key):saved.push(key);localStorage.setItem('pt_saved',JSON.stringify(saved));let active=document.querySelector('.khTok.active');if(active){showKhutbahWord({stopPropagation(){},currentTarget:active},active.textContent,khGloss(active.textContent));}if(page==='saved')render();}
function toggleSettings(){document.getElementById('ptSettingsPanel')?.classList.toggle('show');updateSettingsPanel()}
function setLearnSize(v){document.documentElement.style.setProperty('--learn-size',v+'px');localStorage.setItem('pt_learn_size',v);updateSettingsPanel()}
function setTrLearnSize(v){document.documentElement.style.setProperty('--tr-learn-size',v+'px');localStorage.setItem('pt_tr_learn_size',v);updateSettingsPanel()}
function setLearnFont(v){document.body.classList.remove('font-sade','font-serif','font-rounded','font-elegant','font-humanist');document.body.classList.add('font-'+v);localStorage.setItem('pt_learn_font',v);updateSettingsPanel()}
function setArabicFont(v){['amiri','naskh','scheherazade','lateef','cairo','elmessiri','reem','markazi','aref','rakkas'].forEach(x=>document.body.classList.remove('arabic-'+x));document.body.classList.add('arabic-'+v);localStorage.setItem('pt_arabic_font',v);updateSettingsPanel()}
function updateSettingsPanel(){let p=document.getElementById('ptSettingsPanel');if(!p)return;let sz=localStorage.getItem('pt_learn_size')||18,tr=localStorage.getItem('pt_tr_learn_size')||16,font=localStorage.getItem('pt_learn_font')||'sade',arabic=localStorage.getItem('pt_arabic_font')||'amiri';p.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b.dataset.size==sz));p.querySelectorAll('[data-trsize]').forEach(b=>b.classList.toggle('active',b.dataset.trsize==tr));p.querySelectorAll('[data-font]').forEach(b=>b.classList.toggle('active',b.dataset.font==font));p.querySelectorAll('[data-arabic]').forEach(b=>b.classList.toggle('active',b.dataset.arabic==arabic))}
function applyLearnSettings(){let sz=parseInt(localStorage.getItem('pt_learn_size')||18),tr=parseInt(localStorage.getItem('pt_tr_learn_size')||16),font=localStorage.getItem('pt_learn_font')||'sade',arabic=localStorage.getItem('pt_arabic_font')||'amiri';document.documentElement.style.setProperty('--learn-size',sz+'px');document.documentElement.style.setProperty('--tr-learn-size',tr+'px');document.body.classList.add('font-'+font);setArabicFont(arabic)}
function renderKhutbah(){let a=document.getElementById('app');a.innerHTML=`<div class="khutbahPage"><div class="learnHero"><div class="eyebrow">HUTBE · PORTUGUÊS</div><h2 class="khutbahTitle">🇧🇷 Portekizce Hutbeler</h2><p>Portekizce metni oku; hemen altında Türkçe karşılığını gör. Kelimelere dokunarak anlam, telaffuz, örnek ve kayıt seçeneklerine ulaş.</p></div><div class="khutbahMeta">Hutbe: İslâm hukukunda kolaylık</div><div class="khutbahOpening"><div class="khutbahAyah">فَقُولَا لَهُ قَوْلًا لَيِّنًا لَعَلَّهُ يَتَذَكَّرُ أَوْ يَخْشَى</div><div class="khutbahAyahTr">“Onunla yumuşak bir söz söyleyin. Belki öğüt alır veya Allah’tan korkar.”</div><div class="khutbahHadith">إِنَّ اللَّهَ رَفِيقٌ يُحِبُّ الرِّفْقَ</div><div class="khutbahHadithTr">“Şüphesiz Allah Refîktir, yumuşak davranmayı sever.”</div><div class="khutbahHadith">إِنَّ اللَّهَ يُحِبُّ الرِّفْقَ فِي الْأَمْرِ كُلِّهِ</div><div class="khutbahHadithTr">“Şüphesiz Allah bütün işlerde yumuşak davranmayı sever.”</div></div>${KHUTBAH.map(x=>`<div class="khutbahBlock">${x.head?`<h3 class="khutbahHead">${x.head}</h3>`:''}<p class="khutbahPt">${tokenizeKhutbah(x.pt)}</p><div class="khutbahTr">${x.tr}</div></div>`).join('')}</div><div id="khutbahLookup" class="khutbahLookup"></div>`}
function showQuickWord(w){let meaning=getWordMeaning(w),ex=getWordExample(w);let box=document.createElement('div');box.className='lookup show';box.innerHTML=`<button class="closeWord" style="position:absolute;right:12px;top:12px;border:0;background:#e8e0d3;border-radius:9px;padding:4px 8px" onclick="this.parentElement.remove()">✕</button><div class="popupLabel">Palavra selecionada</div><b>${w}</b><div class="lookupMeaning">${meaning}</div><div class="lookupExample"><div class="exPt">${ex.pt}</div><div class="exTr">${ex.tr}</div></div><div class="lookupActions"><button type="button" onclick='speakPT(${JSON.stringify(w)})'>🔊<br>Telaffuz</button><button type="button" onclick='speakPT(${JSON.stringify(ex.pt)})'>✓<br>Örnek</button><button type="button" onclick='saveWord(${JSON.stringify(w)})'>⭐<br>Kaydet</button></div>`;document.body.appendChild(box)}
function filterVerbs(){const q=(document.getElementById('verbSearch')?.value||'').toLowerCase().trim();document.querySelectorAll('#verbList .verbItem').forEach(el=>el.style.display=!q||el.dataset.search.includes(q)?'block':'none')}
function render(){
let a=document.getElementById("app");
if(page==="home"){
 a.innerHTML=`<section class="learnHero"><div class="eyebrow">PORTekİZCE ÖĞRENİYORUM</div><h2>Seviyeni seç 🌿</h2><p>A1 temel seviyeden başlayabilir veya A2 çalışmalarına geçebilirsin. Her seviye kendi ders, hikâye ve fiil bölümüne sahiptir.</p></section>
 <div class="levelGrid"><div class="levelCard levelA1" onclick="go('a1')"><div class="levelBadge">A1</div><h2>Temel Seviye</h2><p>Günlük konuşmalar, temel dil bilgisi ve İslami kelimeler.</p><div class="levelStats"><span>20 Ders</span><span>20 Hikâye</span><span>111 Fiil</span></div><button class="btn green" type="button">A1'e Başla</button></div>
 <div class="levelCard levelA2" onclick="go('a2')"><div class="levelBadge">A2</div><h2>Orta Başlangıç</h2><p>20. dersten sonra devam eden dersler, 21–60. hikâyeler ve 112. fiilden itibaren fiiller.</p><div class="levelStats"><span>20 Ders</span><span>40 Hikâye</span><span>333 Fiil</span></div><button class="btn" type="button">A2'ye Başla</button></div></div>`;
}
if(page==="levelhome"){
 const isA1=level==="a1", offset=isA1?0:20, storyCount=isA1?20:40, verbStart=isA1?0:111, verbCount=isA1?111:DATA.verbs.length-111;
 const completedCount=completed.filter(i=>i>= (isA1?0:20) && i< (isA1?20:60)).length;
 const pct=Math.round(completedCount/storyCount*100);
 const featured=isA1?["oração","mesquita","misericórdia","sinceridade","Alcorão"]:["viagem","decisão","contexto","objetivo","progresso"];
 a.innerHTML=`<section class="learnHero"><div class="eyebrow">${level.toUpperCase()} · Brezilya Portekizcesi</div><h2>Bugün biraz Portekizce 🌿</h2><p>Kısa bir ders, birkaç kelime ve bir hikâye. Az ama düzenli çalışma için sade bir öğrenme alanı.</p></section>
 <div class="quickGrid"><div class="quickCard" onclick="go('lesson')"><span class="qIcon">📚</span><b>Dersler</b><span>${isA1?20:20} konu</span></div><div class="quickCard" onclick="go('stories')"><span class="qIcon">📖</span><b>Hikâyeler</b><span>${storyCount} metin</span></div><div class="quickCard" onclick="go('verbs')"><span class="qIcon">🔤</span><b>Fiiller</b><span>${verbCount} fiil</span></div></div>
 <div class="card"><h2>${level.toUpperCase()} ilerlemen</h2><div class="progress"><span style="width:${pct}%"></span></div><p class="small">${completedCount} / ${storyCount} hikâye tamamlandı · ${saved.length} kayıtlı kelime · %${pct}</p></div>
 <div class="sectionLabel">Bugünün mini planı</div><div class="dailyRow"><div class="dailyCard"><b>① Bir ders</b><p>${isA1?"Ders 1’den başlayıp konuyu ve alıştırmayı tamamla.":"21. dersten başlayıp A2 konusunu ve alıştırmayı tamamla."}</p><button class="btn green" onclick="go('lesson')">Başla</button></div><div class="dailyCard"><b>② Bir hikâye</b><p>Metni oku, önemli kelimelere dokun ve anlamlarını öğren.</p><button class="btn" onclick="go('stories')">Oku</button></div></div>
 <div class="sectionLabel">Bugünün kelimeleri</div><div class="wordStrip">${featured.map(w=>`<button class="wordChip" onclick='showQuickWord(${JSON.stringify(w)})'>${w}</button>`).join('')}</div>
 <div class="card"><h2>Kelime sandığın</h2><p class="small">Kaydettiğin kelimeleri tekrar ederek hafızanı tazele.</p><button class="btn" onclick="go('saved')">⭐ ${saved.length} kelimeyi aç</button></div>`;
}
if(page==="lesson"){
 const isA1=level==="a1", start=isA1?0:20, list=DATA.lessons.slice(start,start+20);
 a.innerHTML=`<div class="card"><h2>${level.toUpperCase()} · 20 Ders</h2><p class="small">Her ders küçük bir paket: dil bilgisi + İslami kelimeler + örnek + mini alıştırma.</p><div class="lessonGrid">${list.map((l,i)=>{const real=start+i;return `<div class="lessonCard lessonTone${i%10}" onclick="openLesson(${real})"><div class="lessonNo">${String(i+1).padStart(2,'0')}</div><h3>${i+1}. ${l.title}</h3><p>${l.topic}</p><div class="lessonTeach">${l.teach||''}</div><span class="small">5 kelime · 1 alıştırma</span></div>`}).join('')}</div></div>`;
}
if(page==="verbs"){
 const isA1=level==="a1", start=isA1?0:111, list=isA1?DATA.verbs.slice(0,111):DATA.verbs.slice(111);
 a.innerHTML=`<div class="card"><h2>${level.toUpperCase()} · ${list.length} Fiil</h2><p class="small">Fiili ara, örnek cümleyi oku ve telaffuzunu dinle.</p><div class="searchBox"><input id="verbSearch" type="search" placeholder="Fiil ara… (fazer, yapmak)" oninput="filterVerbs()"></div><div id="verbList">${list.map((v,i)=>{const real=start+i;return `<div class="verbItem" data-search="${(v.pt+' '+v.tr).toLowerCase()}"><div class="verbHead"><span class="verbNo">${real+1}.</span> <span class="verbPt">${v.pt}</span> <span class="verbTr">- ${v.tr} -</span> <span class="verbAr">${v.ar}</span></div><div class="verbExample"><b>Ex:</b><div class="ptEx">• ${v.example}</div><div class="trEx">${v.trExample}</div><button class="btn" type="button" aria-label="Telaffuz" title="Telaffuz" onclick='speakPT(${JSON.stringify(v.example)})'>🔊</button></div></div>`}).join('')}</div></div>`;
}
if(page==="stories"){
 const isA1=level==="a1", start=isA1?0:20, list=isA1?DATA.stories.slice(0,20):DATA.stories.slice(20,60);
 a.innerHTML=`<div class="card"><h2>${level.toUpperCase()} · ${list.length} Hikâye</h2><p class="small">Önce Portekizceyi oku. Bilmediğin <b>her kelimeye dokun</b>; Türkçesi, örneği, telaffuzu ve kaydetme seçenekleri açılır. Özel kelimeler renkli gösterilir.</p><div class="studyTip">💡 <b>Çalışma yöntemi:</b> Önce anlamına bakmadan oku → sonra bilmediğin kelimelere dokun → en son hikâyeyi tekrar oku.</div>${list.map((st,i)=>{const real=start+i;return `<div class="item"><h3>${real+1}. ${st.title}</h3><p class="small">${completed.includes(real)?"✓ Tamamlandı":"Henüz tamamlanmadı"}</p><button class="btn green" onclick="openStory(${real})">Hikâyeyi aç</button></div>`}).join('')}</div>`;
}
if(page==="hutbe"){renderKhutbah()}
if(page==="saved"){
 a.innerHTML=`<div class="card"><h2>Kelimelerim</h2><p class="small">${saved.length} kelime kayıtlı.</p>${saved.length?saved.map(w=>`<div class="item"><div class="pt">${w}</div><div class="tr">${DATA.dictionary[w]||HUTBE_GLOSS[w]||"Türkçe anlam"}</div><button class="btn" onclick="saveWord(${JSON.stringify(w)})">Kaydı kaldır</button></div>`).join(''):"Henüz kelime kaydetmedin."}</div>`;
}
}
function openLesson(i){
 let l=DATA.lessons[i],a=document.getElementById("app");
 a.innerHTML=`<div class="card lessonDetail"><div class="eyebrow">${i<20?'A1':'A2'} · DERS ${String(i+1).padStart(2,'0')}</div><h2>${i+1}. ${l.title}</h2><p class="small">${l.topic}</p><div class="lessonExplain"><b>📌 Bu derste</b><p>${l.teach||"Konuyu örneklerle öğren."}</p></div><h3>🧠 Kuralı öğren</h3><div class="lessonRule"><b>Portekizce mantığı</b><p>${l.teach}</p><div class="ruleExample">${l.example}</div><div class="lessonTr">${l.tr}</div></div><h3>📚 Temel kelimeler</h3><div class="lessonWords">${l.words.map(w=>`<div class="lessonWord"><div><b>${w[0]}</b><span>${w[1]}</span></div><button class="miniSpeak" onclick='speakPT(${JSON.stringify(w[0])})'>🔊</button></div>`).join('')}</div><h3>✍️ Uygula</h3><div class="lessonExercise"><p>${l.exercise}</p><button class="btn" onclick="answer(this,true)">${l.answers[0]}</button><button class="btn" onclick="answer(this,false)">${l.answers[1]}</button></div><div class="lessonExtra"><b>🔁 Tekrar yöntemi</b><p>Cümleyi önce sesli oku → Türkçesini kontrol et → aynı yapıyla kendin bir cümle kur.</p></div><p><button class="btn green" onclick="go('lesson')">← Derslere dön</button></p></div>`;
}
function openStory(i){let s=DATA.stories[i],a=document.getElementById("app");a.innerHTML='<div class="card story"><div class="eyebrow">'+(i<20?'A1':'A2')+' · HİKÂYE '+(i+1)+'</div><h2>'+(i+1)+'. '+s.title+'</h2>'+s.text.split(". ").map(p=>'<p>'+tokenize(p+(p.endsWith(".")?"":"."))+'</p>').join("")+'</div><div class="card"><h2>Başlıca kelimeler</h2>'+s.words.map(w=>'<span class="wordtag">'+w[0]+' = '+w[1]+'</span>').join("")+'<p><button class="btn '+(completed.includes(i)?"saved":"")+'" onclick="markStory('+i+')">'+(completed.includes(i)?"✓ Hikâye tamamlandı":"Hikâyeyi tamamladım")+'</button></p></div><div class="card"><h2>Hikâyeye göre soru cevap</h2><p>1. Hikâyenin ana konusu nedir?</p><button class="btn" onclick="answer(this,true)">Günlük hayat ve İslami yaşam</button><button class="btn" onclick="answer(this,false)">Bir spor karşılaşması</button><p>2. Hikâyede hangi kelime cami anlamına gelir?</p><button class="btn" onclick="answer(this,true)">mesquita</button><button class="btn" onclick="answer(this,false)">mercado</button></div><div class="card"><h2>Senin hikâyen</h2><div class="task">Verilen kelimeleri kullanarak benzer bir hikâye yaz: '+s.words.map(w=>w[0]).join(" · ")+'</div><textarea id="writing" placeholder="Portekizce hikâyeni buraya yaz...">'+(writings[i]||"")+'</textarea><button class="btn green" onclick="saveWriting('+i+')">Ödevi kaydet</button><p class="small" id="savedMsg"></p></div>';nav()}
applyLearnSettings();nav();render();updateSettingsPanel();
</script></body></html>
