<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f0e6"><title>Portekizce Öğreniyorum · A1 A2 B1</title>
<style>
:root{--bg:#f6f0e6;--card:#fffdf8;--green:#718172;--green2:#dfe7de;--line:#e4ddd1;--text:#403a34;--muted:#756d64;--gold:#a88c5d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{text-align:center;padding:28px 16px 14px}h1{font-size:27px;margin:0 0 7px}.sub{color:var(--muted);font-size:14px}
nav{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 14px;position:sticky;top:0;background:rgba(246,240,230,.97);z-index:5}
nav button{border:0;background:var(--card);color:var(--text);border-radius:20px;padding:11px 15px;white-space:nowrap;font-size:14px}nav button.active{background:var(--green);color:white}
button{cursor:pointer}.btn:active,nav button:active{transform:scale(.98)}
.levelCard{transition:transform .15s ease,box-shadow .15s ease}.levelCard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(64,58,52,.09)}
.searchbox{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:inherit;margin:4px 0 10px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}.quick .btn{white-space:nowrap}
.focus{background:#f2eadc;border-left:4px solid var(--gold);padding:12px 14px;border-radius:12px;line-height:1.6}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
main{max-width:820px;margin:auto;padding:4px 14px 70px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}
h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:15px 0 7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f0ebe2;border-radius:16px;padding:15px}.stat b{font-size:23px;display:block;margin-bottom:3px}.badge{display:inline-block;background:var(--green2);padding:5px 9px;border-radius:999px;font-size:12px;margin:2px}
.item{padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.pt{font-size:19px;font-weight:700}.tr,.small{color:var(--muted)}.small{font-size:13px}
.btn{display:inline-block;border:0;background:#eee7db;color:var(--text);padding:10px 13px;border-radius:12px;text-decoration:none;margin:5px 4px 5px 0}.btn.green{background:var(--green);color:white}
.lessonBox{border-left:4px solid var(--green);padding:10px 13px;background:#f8f4ec;border-radius:10px;margin:10px 0;line-height:1.6}
.story p{font-size:16px;line-height:1.8}.wordtag{display:inline-block;background:var(--green2);padding:7px 9px;border-radius:11px;margin:4px;font-size:14px}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:white}
select,input{border:1px solid var(--line);background:white;border-radius:12px;padding:10px;font:inherit;max-width:100%}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.progress{height:9px;background:#e5dfd4;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}
.levelCards{display:grid;grid-template-columns:1fr;gap:12px;margin:14px 0}
.levelCard{background:linear-gradient(145deg,var(--card),#f3eee5);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 5px 16px rgba(64,58,52,.05)}
.levelCard h2{margin:4px 0 7px;font-size:22px}.levelCard p{margin:6px 0 12px;line-height:1.55}
.levelMeta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}.levelMeta span{background:var(--green2);border-radius:999px;padding:6px 9px;font-size:12px}
.levelActions{display:flex;gap:7px;flex-wrap:wrap}.levelProgress{margin-top:10px}
.heroNote{line-height:1.65}.sectionTitle{margin:18px 2px 5px;font-size:18px}
@media(min-width:680px){.levelCards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}main{padding-left:9px;padding-right:9px}.card{padding:14px;border-radius:16px}}

/* v4 — seviye odaklı ana ekran */
:root{--shadow:0 10px 30px rgba(64,58,52,.08)}
body{background:
 radial-gradient(circle at 12% 0%,rgba(168,140,93,.10),transparent 28rem),
 var(--bg)}
header{padding:30px 16px 18px}
header h1{font-size:30px;letter-spacing:-.5px}
header .sub{max-width:620px;margin:auto;line-height:1.5}
nav{box-shadow:0 5px 18px rgba(64,58,52,.05);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.card,.levelCard{box-shadow:var(--shadow)}
.levelCards{grid-template-columns:1fr!important}
.levelCard{position:relative;overflow:hidden;padding:20px}
.levelCard:before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--green)}
.levelCard[data-level="A2"]:before{background:var(--gold)}
.levelCard[data-level="B1"]:before{background:#5f6678}
.levelTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.levelIcon{font-size:30px;line-height:1}
.levelCard h2{font-size:23px}
.levelCard .desc{min-height:0;color:var(--muted)}
.levelActions .btn{flex:1;text-align:center}
.levelActions{display:grid;grid-template-columns:1fr 1fr}
.dashboard{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}
.dash{background:#f3eee5;border-radius:14px;padding:11px;text-align:center;font-size:12px}
.dash b{display:block;font-size:18px;margin-bottom:2px}
.homeHero{background:linear-gradient(145deg,#fffdf8,#f0e9dc)}
.homeHero h2{font-size:24px}
.continueBtn{width:100%;padding:13px 16px;font-weight:700}
.levelNav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.levelNav button{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:11px 8px;font-weight:700}
.levelNav button.on{background:var(--green);color:#fff;border-color:var(--green)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.item{scroll-margin-top:80px}
@media(min-width:720px){
 .levelCards{grid-template-columns:repeat(3,1fr)!important}
 .levelActions{grid-template-columns:1fr}
 .levelCard .desc{min-height:72px}
}
@media(max-width:480px){
 header h1{font-size:26px}.dashboard{grid-template-columns:1fr 1fr}
 .levelActions{grid-template-columns:1fr 1fr}.levelCard{padding:17px}
}

/* v5 — A1/A2/B1 renk kimliği + okunabilir ders/hikâye ekranı */
:root{--a1:#4f8065;--a1soft:#e6f0e8;--a2:#b07b39;--a2soft:#f6ead8;--b1:#596783;--b1soft:#e7eaf1}
body.level-A1{--level:var(--a1);--levelsoft:var(--a1soft)}
body.level-A2{--level:var(--a2);--levelsoft:var(--a2soft)}
body.level-B1{--level:var(--b1);--levelsoft:var(--b1soft)}
.levelNav{position:sticky;top:58px;z-index:4;background:rgba(246,240,230,.96);padding:8px 0}
.levelNav button:nth-child(1).on{background:var(--a1);border-color:var(--a1)}
.levelNav button:nth-child(2).on{background:var(--a2);border-color:var(--a2)}
.levelNav button:nth-child(3).on{background:var(--b1);border-color:var(--b1)}
.lessonList{display:grid;gap:12px}
.lessonTile{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--level,var(--green));border-radius:18px;padding:15px;box-shadow:0 5px 16px rgba(64,58,52,.05)}
.lessonTile .lessonNo{font-size:12px;color:var(--muted);font-weight:700}.lessonTile h3{margin:4px 0 6px}
.lessonTile .lessonGoal{font-size:14px;line-height:1.5;color:var(--muted)}
.lessonTile details{margin-top:9px}.lessonTile summary{background:var(--levelsoft,#eef2ed)!important}
.storyTile{border-left:6px solid var(--level,var(--green));background:var(--card);border-radius:17px;padding:14px;margin:10px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.storyTile h3{margin:5px 0}.storyText{font-size:17px!important;line-height:1.85!important;margin-bottom:5px}
.storyTr{font-size:12.5px!important;line-height:1.6!important;color:var(--muted);background:#f4efe7;border-radius:10px;padding:9px 10px;margin:0 0 14px!important}
.storyTr:before{content:"Türkçesi";display:block;font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;color:var(--level,var(--green))}
.levelCard[data-level="A1"]{background:linear-gradient(145deg,#fffdf8,var(--a1soft));border-color:#cbdccd}
.levelCard[data-level="A2"]{background:linear-gradient(145deg,#fffdf8,var(--a2soft));border-color:#ead5b9}
.levelCard[data-level="B1"]{background:linear-gradient(145deg,#fffdf8,var(--b1soft));border-color:#d3d8e3}
.levelCard[data-level="A1"] .btn.green{background:var(--a1)}
.levelCard[data-level="A2"] .btn.green{background:var(--a2)}
.levelCard[data-level="B1"] .btn.green{background:var(--b1)}
.backHome{width:100%;margin-bottom:8px}
@media(max-width:560px){.levelNav{top:55px}.storyText{font-size:16px!important}.storyTr{font-size:12px!important}}

.storyWord{border-bottom:1px dotted var(--gold);cursor:pointer;border-radius:4px;padding:0 1px}
.storyWord:active{background:var(--levelsoft,var(--green2))}
.wordPopup{position:fixed;left:12px;right:12px;bottom:16px;z-index:30;max-width:560px;margin:auto;background:#fffdf8;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 16px 45px rgba(40,35,30,.22)}
.wordPopupTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.wordPopupPt{font-size:22px;font-weight:750}.wordPopupTr{font-size:14px;color:var(--muted);margin-top:3px}
.wordPopupActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.wordPopupActions .btn{margin:0}
.wordClose{border:0;background:#eee7db;border-radius:50%;width:34px;height:34px;font-size:18px}

/* v6 — derin çalışma deneyimi */
.studyStrip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.studyStat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.studyStat b{display:block;font-size:18px}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 8px}
.lessonTile{transition:.18s transform,.18s box-shadow}.lessonTile:hover{transform:translateY(-2px);box-shadow:0 9px 24px rgba(64,58,52,.09)}
.lessonTile.done{opacity:.78}.lessonTile.done:after{content:"✓";float:right;margin-top:-34px;font-size:22px;color:var(--level,var(--green))}
.lessonHead{display:flex;gap:10px;align-items:flex-start}.lessonNum{min-width:42px;height:42px;border-radius:13px;background:var(--levelsoft);color:var(--level);display:grid;place-items:center;font-weight:800}
.lessonContent{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.exampleRow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.exampleRow p{margin:0;line-height:1.55}
.taskBox{background:var(--levelsoft);border-left:4px solid var(--level);padding:12px;border-radius:10px;margin:12px 0}
.storyMeta{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0 12px}
.storyProgress{font-size:12px;color:var(--muted)}
.savedPanel{display:grid;gap:8px}.savedWord{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px}
.savedWord strong{font-size:16px}.savedWord small{display:block;color:var(--muted);margin-top:2px}
.modeTabs{display:flex;gap:7px;overflow:auto;padding:3px 0 9px;scrollbar-width:none}.modeTabs::-webkit-scrollbar{display:none}
.modeTabs .btn{white-space:nowrap;margin:0}
.emptyState{text-align:center;padding:28px 12px;color:var(--muted)}
.quizBox{background:linear-gradient(145deg,#fffdf8,var(--levelsoft,#f0ece4));border:1px solid var(--line);border-radius:17px;padding:15px;margin-top:12px}
.quizOpt{display:block;width:100%;text-align:left;margin:7px 0}
.wordPopupHint{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:480px){.studyStrip{grid-template-columns:1fr 1fr}.studyStrip .studyStat:last-child{grid-column:1/-1}.lessonHead h3{font-size:17px}}

/* v7 — fiil sistemi, numaralı ders fiilleri, vurgu kutuları, kompakt hikâye tercümesi */
.verbGrid{display:grid;gap:8px}
.verbRow{display:grid;grid-template-columns:42px minmax(105px,1fr) minmax(105px,1fr) 78px;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:12px;padding:10px 11px}
.verbIndex{font-weight:800;color:var(--muted);font-size:12px}.verbPt{font-size:17px;font-weight:800}.verbTr{font-size:14px}.verbMode{font-size:11px;color:var(--muted);text-align:right}
.verbRow:nth-child(3n+2){border-left-color:var(--gold)}.verbRow:nth-child(3n+3){border-left-color:#66728a}
.verbExample{grid-column:2/-1;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.lessonVerbList{margin:7px 0 0;padding:0;list-style:none;counter-reset:lv}
.lessonVerbList li{counter-increment:lv;padding:4px 8px;border-bottom:1px dashed rgba(80,70,60,.12);font-size:13px}
.lessonVerbList li:before{content:counter(lv) ".";font-weight:800;display:inline-block;width:25px;color:var(--level,var(--green))}
.lessonBox{background:#fff1c9!important;border:1px solid #e4c56e!important;border-left:5px solid #c38b21!important;color:#514522}
.lessonBox b{color:#76520d}
.taskBox{background:#e9e2f5!important;border-left-color:#78639a!important;color:#40384d}
.storyTr{position:relative;background:linear-gradient(to bottom,rgba(237,229,216,.88),rgba(237,229,216,.18),rgba(237,229,216,0))!important;border-radius:0!important;padding:3px 5px 7px!important;margin:-3px 0 7px!important;font-size:11.5px!important;line-height:1.35!important;color:#716a61!important}
.storyTr:before{content:none!important}
.storyText{margin-bottom:0!important}
@media(max-width:520px){.verbRow{grid-template-columns:32px 1fr 1fr;padding:9px 8px}.verbMode{grid-column:2/-1;text-align:left}.verbExample{grid-column:2/-1}.verbPt{font-size:15px}.verbTr{font-size:13px}}

/* v8 — sade fiil satırı: no · seviye renkleri | PT | TR | AR */
.verbRow{grid-template-columns:54px minmax(100px,1.15fr) minmax(100px,1fr) minmax(85px,.9fr)!important;align-items:center!important}
.verbIndex{align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px!important}
.verbLevelDots{display:flex;gap:3px}.verbLevelDots i{width:8px;height:8px;border-radius:50%;display:block}
.verbLevelDots .a1{background:var(--a1)}.verbLevelDots .a2{background:var(--a2)}.verbLevelDots .b1{background:var(--b1)}
.verbAr{font-size:20px;text-align:right;direction:rtl;font-family:"Scheherazade New","Noto Naskh Arabic",serif}
.verbMode,.verbExample{display:none!important}
.verbHead{display:grid;grid-template-columns:54px minmax(100px,1.15fr) minmax(100px,1fr) minmax(85px,.9fr);gap:9px;padding:0 11px 6px;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.verbHead span:last-child{text-align:right}
@media(max-width:520px){.verbRow,.verbHead{grid-template-columns:42px 1fr 1fr .85fr!important;gap:6px}.verbAr{font-size:18px}.verbPt{font-size:14px}.verbTr{font-size:12px}}

/* v9 — Hutbe çalışma alanı + gelişmiş ayarlar */
.topTools{position:absolute;right:12px;top:12px;display:flex;gap:6px}.topTool{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;font-size:16px}
header{position:relative}
.khHero{background:linear-gradient(145deg,#f8f0dd,#e9efe8);border-left:6px solid #718172}
.khPara{padding:14px 0;border-bottom:1px solid var(--line)}.khPara:last-child{border-bottom:0}
.khPt{font-size:17px;line-height:1.8;margin:0}.khTr{font-size:11.5px;line-height:1.4;color:var(--muted);margin:1px 0 6px;background:linear-gradient(to bottom,rgba(237,229,216,.78),rgba(237,229,216,0));padding:3px 5px 6px}
.khTools{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0}.khTag{font-size:11px;background:var(--green2);padding:5px 8px;border-radius:999px}
.settingsShade{display:none;position:fixed;inset:0;background:rgba(30,25,20,.35);z-index:40;padding:16px;align-items:flex-end;justify-content:center}.settingsShade.show{display:flex}
.settingsPanel{width:min(620px,100%);max-height:88vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:24px 24px 18px 18px;padding:18px;box-shadow:0 18px 60px rgba(30,25,20,.25)}
.settingsHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.settingsHead h2{margin:0}.settingsGroup{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:11px 0}.settingsLabel{font-size:13px;font-weight:800;margin-bottom:9px}
.settingBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.settingBtns button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px}.settingBtns button.on{background:var(--green);color:#fff}
.settingRow{display:flex;justify-content:space-between;align-items:center;gap:12px}.settingRow input[type=checkbox]{width:20px;height:20px}
body.ptLarge main{font-size:1.1em}body.ptLarge .storyText,body.ptLarge .khPt{font-size:19px}
body.ptCompact .storyTr,body.ptCompact .khTr{display:none}
body.ptCalm{--bg:#eee8dc;--card:#faf6ee;--text:#352f29}
body.ptFocus nav{display:none}body.ptFocus main{max-width:700px}
@media(max-width:520px){.topTools{top:8px;right:8px}.topTool{padding:7px 8px}.settingsPanel{padding:13px}.settingBtns{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="topTools"><button class="topTool" onclick="go('khutbah')" title="Hutbe">🕌</button><button class="topTool" onclick="openPtSettings()" title="Ayarlar">⚙️</button></div><h1>Portekizce Öğreniyorum</h1><div class="sub">Brezilya Portekizcesi · A1 + A2 + B1 · yoğun çalışma programı</div></header>
<nav id="nav"></nav><main id="app"></main>
<div class="settingsShade" id="ptSettings" onclick="if(event.target===this)closePtSettings()">
 <section class="settingsPanel">
  <div class="settingsHead"><div><div class="kicker">Çalışma deneyimi</div><h2>⚙️ Ayarlar</h2></div><button class="btn" onclick="closePtSettings()">✕</button></div>
  <div class="settingsGroup"><div class="settingsLabel">Yazı boyutu</div><div class="settingBtns"><button onclick="setPtSetting('size','normal',this)">Normal</button><button onclick="setPtSetting('size','large',this)">Büyük</button><button onclick="setPtSetting('size','compact',this)">Kompakt</button></div></div>
  <div class="settingsGroup"><div class="settingsLabel">Görünüm</div><div class="settingBtns"><button onclick="setPtSetting('theme','default',this)">Açık</button><button onclick="setPtSetting('theme','calm',this)">Sakin</button><button onclick="setPtSetting('focus','toggle',this)">Odak modu</button></div></div>
  <div class="settingsGroup"><div class="settingRow"><div><b>Türkçe alt çeviriler</b><div class="small">Hikâye ve hutbelerde küçük Türkçe satırları göster.</div></div><input id="translationToggle" type="checkbox" checked onchange="toggleTranslations(this.checked)"></div></div>
  <div class="settingsGroup"><div class="settingsLabel">Telaffuz hızı</div><input id="speechRate" style="width:100%" type="range" min=".65" max="1.15" step=".05" value=".88" oninput="saveSpeechRate(this.value)"><div class="small">Yavaş ← telaffuz hızı → normal</div></div>
  <button class="btn" onclick="resetPtSettings()">Ayarları sıfırla</button>
 </section>

1 genel tekrar","grammar":"integração B1","goal":"Geçmiş, gelecek, subjuntivo ve görüş dilini birleştir.","vocab":"compartilhar = paylaşmak · escolher = seçmek · preferir = tercih etmek · poder = ebilmek · dever = gerekmek, -meli · deixar = bırakmak","examples":["Hoje eu quero praticar português com calma e atenção.","Na minha rotina, eu tento usar palavras novas em situações reais.","Quando não entendo alguma coisa, pergunto, anoto e depois reviso.","É importante que eu consiga explicar minhas ideias com clareza."],"dialog":["A: O que você está estudando hoje?","B: Estou estudando b1 genel tekrar e praticando integração B1.","A: Como você pratica?","B: Leio exemplos, repito em voz alta e escrevo minhas próprias frases."],"task":"Geçmiş, gelecek, subjuntivo ve görüş dilini birleştir. En az 8 Portekizce cümle yaz; bunlardan 2 tanesinde bağlaç kullan ve 3 fiili farklı şahıslarla çek."}],"stories":[{"title":"Camiye Gitmek","text":"Hoje é um dia tranquilo. João termina o trabalho e vai à mesquita. Ele encontra seu amigo Ali na entrada. Os dois conversam um pouco e depois fazem a oração. João fica feliz porque gosta de rezar com seus amigos.","words":[["mesquita","cami"],["oração","namaz, dua"],["amigo","arkadaş"],["trabalho","iş"],["rezar","namaz kılmak"]],"tr":"Bugün sakin bir gün. João işini bitirir ve camiye gider. Girişte arkadaşı Ali ile karşılaşır. İkisi biraz sohbet eder ve sonra namazlarını kılar. João arkadaşlarıyla namaz kılmayı sevdiği için mutlu olur."},{"title":"Sabah Namazı","text":"Maria acorda cedo. Ela lava o rosto e faz a ablução. Depois, prepara um lugar limpo e faz a oração da manhã. Ela lê algumas páginas do Alcorão e agradece a Allah pelo novo dia.","words":[["acorda","uyanır"],["ablução","abdest"],["manhã","sabah"],["Alcorão","Kur'an"],["agradece","şükreder, teşekkür eder"]],"tr":"Maria erken uyanır. Yüzünü yıkar ve abdest alır. Sonra temiz bir yer hazırlar ve sabah namazını kılar. Kur'an'dan birkaç sayfa okur ve yeni gün için Allah'a şükreder."},{"title":"Ramazan Günü","text":"Durante o Ramadão, Ahmed acorda antes do amanhecer para o suhur. Ele come uma refeição simples e bebe água. Durante o dia, ele jejua e trabalha normalmente. Ao pôr do sol, ele faz a oração e quebra o jejum com sua família.","words":[["Ramadão","Ramazan"],["suhur","sahur"],["amanhecer","tan vakti"],["jejuar","oruç tutmak"],["jejum","oruç"],["família","aile"]],"tr":"Ramazan boyunca Ahmed sahur için tan vaktinden önce uyanır. Basit bir öğün yer ve su içer. Gün boyunca oruç tutar ve normal şekilde çalışır. Güneş batınca namazını kılar ve ailesiyle orucunu açar."},{"title":"Ailem","text":"Minha família mora perto da mesquita. Meu pai trabalha de manhã e minha mãe prepara o almoço. Depois do trabalho, todos se encontram em casa. Nós conversamos, comemos juntos e agradecemos a Allah.","words":[["família","aile"],["pai","baba"],["mãe","anne"],["almoço","öğle yemeği"],["casa","ev"],["juntos","birlikte"]],"tr":"Ailem caminin yakınında oturuyor. Babam sabah çalışıyor, annem öğle yemeğini hazırlıyor. İşten sonra herkes evde buluşuyor. Birlikte konuşuyor, yemek yiyor ve Allah'a şükrediyoruz."},{"title":"Arkadaşım","text":"Meu amigo Yusuf estuda português todos os dias. Ele lê um texto curto e escreve algumas frases. Quando não entende uma palavra, ele pergunta e aprende. Depois, ele conversa comigo e pratica as palavras novas.","words":[["amigo","arkadaş"],["estuda","ders çalışır"],["texto","metin"],["frases","cümleler"],["entende","anlar"],["palavra","kelime"]],"tr":"Arkadaşım Yusuf her gün Portekizce çalışıyor. Kısa bir metin okuyor ve birkaç cümle yazıyor. Bir kelimeyi anlamadığında soruyor ve öğreniyor. Sonra benimle konuşuyor ve yeni kelimeleri pratik ediyor."},{"title":"Kur'an Okumak","text":"Depois da oração, Hamza senta em um lugar tranquilo e lê o Alcorão. Ele lê devagar para entender as palavras. Depois, escreve uma frase sobre o que aprendeu. Antes de dormir, ele repete as palavras novas.","words":[["Alcorão","Kur'an"],["devagar","yavaşça"],["entender","anlamak"],["aprendeu","öğrendi"],["dormir","uyumak"],["repete","tekrar eder"]],"tr":"Namazdan sonra Hamza sakin bir yere oturur ve Kur'an okur. Kelimeleri anlamak için yavaşça okur. Sonra öğrendikleri hakkında bir cümle yazar. Uyumadan önce yeni kelimeleri tekrar eder."},{"title":"Pazara Gitmek","text":"No sábado, Aisha vai ao mercado com sua mãe. Elas compram frutas, pão e água. Aisha pergunta o preço e paga a compra. Na volta, elas encontram uma vizinha e conversam sobre a mesquita do bairro.","words":[["sábado","cumartesi"],["mercado","pazar"],["frutas","meyveler"],["pão","ekmek"],["preço","fiyat"],["bairro","mahalle"]],"tr":"Cumartesi günü Aisha annesiyle pazara gider. Meyve, ekmek ve su alırlar. Aisha fiyatı sorar ve alışverişi öder. Dönüşte bir komşuyla karşılaşırlar ve mahallenin camisi hakkında konuşurlar."},{"title":"Misafiri Ağırlamak","text":"Hoje a família recebe um convidado. A mãe prepara comida e o pai limpa a sala. Eles oferecem água e comida ao visitante. Depois, todos conversam com respeito e fazem uma pequena dua.","words":[["convidado","misafir"],["comida","yemek"],["visitante","ziyaretçi"],["oferecem","ikram ederler"],["respeito","saygı"],["dua","dua"]],"tr":"Bugün aile bir misafir ağırlıyor. Anne yemek hazırlıyor, baba salonu temizliyor. Misafire su ve yemek ikram ediyorlar. Sonra herkes saygılı bir şekilde sohbet ediyor ve kısa bir dua ediyor."},{"title":"Cuma Günü","text":"Na sexta-feira, Omar acorda cedo e se prepara para a oração de sexta-feira. Ele toma banho, veste uma roupa limpa e vai à mesquita. Depois da oração, encontra alguns amigos. Eles conversam e voltam para casa.","words":[["sexta-feira","cuma"],["banho","banyo"],["roupa","kıyafet"],["limpa","temiz"],["oração","namaz"],["voltam","dönerler"]],"tr":"Cuma günü Omar erken uyanır ve cuma namazı için hazırlanır. Banyo yapar, temiz kıyafet giyer ve camiye gider. Namazdan sonra birkaç arkadaşıyla buluşur. Sohbet eder ve eve dönerler."},{"title":"Sadaka Vermek","text":"Fatima vê uma pessoa que precisa de ajuda. Ela compra comida e oferece uma parte para essa pessoa. Depois, ela volta para casa. Sua mãe explica que a caridade deve ser feita com sinceridade e sem esperar recompensa.","words":[["pessoa","kişi"],["ajuda","yardım"],["compra","satın alır"],["oferece","sunar"],["caridade","sadaka, yardım"],["sinceridade","samimiyet"],["recompensa","karşılık, ödül"]],"tr":"Fatima yardıma ihtiyacı olan birini görür. Yiyecek satın alır ve bir kısmını o kişiye verir. Sonra eve döner. Annesi, sadakanın samimiyetle ve karşılık beklemeden verilmesi gerektiğini açıklar."},{"title":"Güzel Bir Gün","text":"No fim da semana, Bilal acorda cedo. Ele faz a oração, lê um pouco e ajuda sua família em casa. À tarde, visita a mesquita e encontra seus amigos. À noite, agradece a Allah pelo dia e dorme tranquilo.","words":[["fim","son"],["semana","hafta"],["ajuda","yardım eder"],["visita","ziyaret eder"],["agradece","şükreder, teşekkür eder"],["tranquilo","huzurlu"]],"tr":"Hafta sonunda Bilal erken uyanır. Namazını kılar, biraz okur ve evde ailesine yardım eder. Öğleden sonra camiyi ziyaret eder ve arkadaşlarıyla buluşur. Gece Allah'a gün için şükreder ve huzurla uyur."},{"title":"Yeni Komşu 1","level":"A1","text":"Hoje Meryem tem uma experiência sobre vizinho. Primeiro, organiza o dia e fala com uma pessoa conhecida. Depois, precisa resolver uma pequena situação e faz perguntas simples. No fim, tudo fica bem. A experiência ajuda a aprender palavras novas e a falar português com mais confiança.","words":[["vizinho","mahallede yeni bir komşuyla tanışma"],["experiência","deneyim"],["decisão","karar"],["aprender","öğrenmek"],["conversar","konuşmak"]],"tr":"Bugün Meryem, mahallede yeni bir komşuyla tanışma hakkında bir deneyim yaşıyor. Önce gününü düzenliyor ve tanıdığı biriyle konuşuyor. Sonra küçük bir durumu çözmesi gerekiyor ve basit sorular soruyor. Sonunda her şey yoluna giriyor. Bu deneyim yeni kelimeler öğrenmesine ve Portekizceyi daha özgüvenli konuşmasına yardımcı oluyor."},{"title":"Otobüsü Kaçırmak 1","level":"A1","text":"Hoje Carlos tem uma experiência sobre ônibus. Primeiro, organiza o dia e fala com uma pessoa conhecida. Depois, precisa resolver uma pequena situação e faz perguntas simples. No fim, tudo fica bem. A experiência ajuda a aprender palavras novas e a falar português com mais confiança.","words":[["ônibus","ulaşımda yaşanan küçük bir sorun"],["experiência","deneyim"],["decisão","karar"],["aprender","öğrenmek"],["conversar","konuşmak"]],"tr":"Bugün Carlos, ulaşımda yaşanan küçük bir sorun hakkında bir deneyim yaşıyor. Önce gününü düzenliyor ve tanıdığı biriyle konuşuyor. Sonra küçük bir durumu çözmesi gerekiyor ve basit sorular soruyor. Sonunda her şey yoluna giriyor. Bu deneyim yeni kelimeler öğrenmesine ve Portekizceyi daha özgüvenli konuşmasına yardımcı oluyor."},{"title":"Kütüphanede Bir Gün 1","level":"A1","text":"Hoje Ana tem uma experiência sobre biblioteca. Primeiro, organiza o dia e fala com uma pessoa conhecida. Depois, precisa resolver uma pequena situação e faz perguntas simples. No fim, tudo fica bem. A experiência ajuda a aprender palavras novas e a falar português com mais confiança.","words":[["biblioteca","kitap seçme ve ders çalışma"],["experiência","deneyim"],["decisão","karar"],["aprender","öğrenmek"],["conversar","konuşmak"]],"tr":"Bugün Ana, kitap seçme ve ders çalışma hakkında bir deneyim yaşıyor. Önce gününü düzenliyor ve tanıdığı biriyle konuşuyor. Sonra küçük bir durumu çözmesi gerekiyor ve basit sorular soruyor. Sonunda her şey yoluna giriyor. Bu deneyim yeni kelimeler öğrenmesine ve Portekizceyi daha özgüvenli konuşmasına yardımcı oluyor."},{"title":"Yağmurlu Sabah 1","level":"A1","text":"Hoje Yusuf tem uma experiência sobre chuva. Primeiro, organiza o dia e fala com uma pessoa conhecida. Depois, precisa resolver uma pequena situação e faz perguntas simples. No fim, tudo fica bem. A experiência ajuda a aprender palavras novas e a falar português com mais confiança.","w function toggleStory(n){storyDone.includes(n)?storyDone=storyDone.filter(x=>x!==n):storyDone.push(n);localStorage.setItem("pt99_done",JSON.stringify(storyDone));render()}
let searchTerm="";
let savedWords=JSON.parse(localStorage.getItem("pt_saved_words")||"[]");
function dictMeaning(w){
 let exact=Object.keys(DATA.dictionary).find(k=>k.toLowerCase()===w.toLowerCase());
 if(exact)return DATA.dictionary[exact];
 // story vocabulary is often richer than the global dictionary
 for(const s of DATA.stories){for(const pair of (s.words||[])){if(String(pair[0]).toLowerCase()===w.toLowerCase())return pair[1]}}
 return "";
}

function quickQuiz(){
 if(!savedWords.length){alert("Önce hikâyelerden birkaç kelime kaydet.");return}
 let w=savedWords[Math.floor(Math.random()*savedWords.length)], correct=dictMeaning(w)||"Sözlükte anlam yok";
 let pool=Object.values(DATA.dictionary).filter(x=>x!==correct).slice(0,3); let opts=[correct,...pool].sort(()=>Math.random()-.5);
 let a=document.getElementById("app");a.innerHTML=`<div class="card"><div class="kicker">Hızlı tekrar</div><h2>${esc(w)}</h2><p>Bu kelimenin Türkçesi hangisi?</p><div class="quizBox">${opts.map(o=>`<button class="btn quizOpt" onclick="alert('${String(o).replace(/'/g,"\\'")===String(correct).replace(/'/g,"\\'")?"Doğru ✓":"Tekrar dene"}')">${esc(o)}</button>`).join("")}</div><button class="btn" onclick="openSaved()">← Kelime defterine dön</button></div>`;
}
function storyTokenize(t){
 return t.split(/(\s+|[,.!?;:()“”"—–])/).map(x=>{
   let clean=x.toLowerCase().replace(/^[^a-zà-ÿçãõáéíóúâêô]+|[^a-zà-ÿçãõáéíóúâêô]+$/gi,"");
   if(!clean)return x;
   let key=Object.keys(DATA.dictionary).find(k=>k.toLowerCase()===clean);
   let tr=dictMeaning(clean);
   return `<span class="storyWord" onclick="showWord(event,'${clean.replace(/'/g,"\\'")}','${String(tr).replace(/'/g,"\\'")}')">${esc(x)}</span>`;
 }).join("");
}
function showWord(e,w,tr){
 e.stopPropagation();let old=document.getElementById("wordPopup");if(old)old.remove();
 let saved=savedWords.includes(w);
 let box=document.createElement("div");box.id="wordPopup";box.className="wordPopup";
 box.innerHTML=`<div class="wordPopupTop"><div><div class="wordPopupPt">${esc(w)}</div><div class="wordPopupTr">${tr?esc(tr):"Bu kelime sözlükte kayıtlı değil."}</div></div><button class="wordClose" onclick="closeWord()">×</button></div>
 <div class="wordPopupActions"><button class="btn" onclick="speakPT('${w.replace(/'/g,"\\'")}')">🔊 Telaffuz</button><button class="btn ${saved?"saved":""}" onclick="toggleSavedWord('${w.replace(/'/g,"\\'")}')">${saved?"✓ Kaydedildi":"🔖 Kaydet"}</button></div><div class="wordPopupHint">Kelimeyi dinle, Türkçesini gör ve kişisel kelime defterine kaydet.</div>`;
 document.body.appendChild(box);
}
function closeWord(){let b=document.getElementById("wordPopup");if(b)b.remove()}
function toggleSavedWord(w){savedWords.includes(w)?savedWords=savedWords.filter(x=>x!==w):savedWords.push(w);localStorage.setItem("pt_saved_words",JSON.stringify(savedWords));let b=document.getElementById("wordPopup");if(b)b.remove()}
function setLevel(v){levelFilter=v;document.body.className="level-"+v;render()}
function setSearch(v){searchTerm=v.toLowerCase().trim();render()}

const KHUTBAH=[{"pt":"﴿فَقُولَا لَهُ قَوْلًا لَيِّنًا لَعَلَّهُ يَتَذَكَّرُ أَوْ يَخْشَى﴾<br>«إِنَّ اللَّهَ رَفِيقٌ يُحِبُّ الرِّفْقَ»<br>«إِنَّ اللَّهَ يُحِبُّ الرِّفْقَ فِي الْأَمْرِ كُلِّهِ»","tr":"“Onunla yumuşak bir söz söyleyin. Belki öğüt alır veya Allah’tan korkar.”<br>“Şüphesiz Allah Refîktir, yumuşak davranmayı sever.”<br>“Şüphesiz Allah bütün işlerde yumuşak davranmayı sever.”"},{"pt":"Em nome de Deus, o Clemente, o Misericordioso. “Sede benévolos, e não sejais intransigentes!” Louvado seja Deus, com um louvor abundante, puro e abençoado, conforme convém à majestade de Sua Face e à grandeza de Seu Poder. Testemunho que não há divindade além de Deus, testemunho pelo qual vivemos, morreremos e seremos ressuscitados no Dia da Ressurreição. E testemunho que nosso mestre Muhammad é Seu servo e Mensageiro. Ó Deus, concede Tuas bênçãos e paz sobre ele entre os primeiros e os últimos. Prosseguindo:","tr":"Rahmân ve Rahîm olan Allah’ın adıyla. “Merhametli olun ve katı davranmayın!” Bundan sonra:"},{"pt":"A facilidade na jurisprudência islâmica constitui uma das características mais marcantes desta religião e uma dádiva divina por meio da qual Deus Louvado seja elevou a posição desta mensagem eterna. Todo aquele que contempla as normas da nobre Sharia, em seus diversos aspectos e circunstâncias, percebe claramente que a facilidade e a remoção das dificuldades são objetivos fundamentais. Isso é comprovado pelas palavras do Altíssimo reveladas na surata Al Haj versículo 78: “E não vos impôs dificuldade alguma quanto à religião, porque é o credo de vosso pai, Abraão. Ele vos denominou muçulmanos, antes deste.”, e mencionou na surata Al Bacara versículo 185: “Deus vos deseja a comodidade e não a dificuldade.”","tr":""},{"pt":"Da mesma forma, os ensinamentos do Mensageiro de Deus (S.A.A.S) esclarecem os propósitos da Sharia. O Profeta (S.A.A.S) disse: “A prática da religião é fácil, e a religião é mais forte do que o fanatismo.” (Al-Bukhari). Também (S.A.A.S) disse: “A melhor parte de vossa religião é a mais fácil; a melhor parte de vossa religião é a mais fácil; a melhor parte de vossa religião é a mais fácil.” (Ahmad). E em outra passagem ainda o Profeta (S.A.A.S) afirmou: “Deus ama que Suas concessões sejam aceitas, assim como ama que Suas obrigações sejam cumpridas.” (Ibn Hibban). E, conforme narrou Jabir ibn Abdullah (que Deus esteja satisfeito com ele), que o Profeta (S.A.A.S) declarou: “Deus não me enviou para impor dificuldades nem para agir com rigor; enviou-me como mestre e facilitador.” (Muslim).","tr":""},{"pt":"Manifestações da facilidade na Jurisprudência Islâmica<br>1. A abertura da porta do arrependimento","tr":"Tövbe kapısının açık olması"},{"pt":"Deus, Exaltado seja, revelou na surata Al Zummar versículo 53: “Dize: Ó Meus servos que transgredistes contra vós mesmos! Não desespereis da misericórdia de Deus. Em verdade, Deus perdoa todos os pecados. Ele é, por certo, o Perdoador, o Misericordioso.” Alguns podem não perceber a grandeza dessa facilidade até conhecerem a legislação dos povos anteriores. Quando o povo de Moisés (Que a paz esteja com ele) adorou o bezerro de ouro e desejou arrepender-se, Deus determinou-lhes uma prova extremamente severa: deveriam matar uns aos outros para que seu arrependimento fosse aceito.","tr":""},{"pt":"Deus Louvado seja revelou na surata Al Bacara 54: “Ó povo meu, por certo que vos condenastes, ao adorardes o bezerro. Voltai, portanto, arrependidos, penitenciando-vos para o vosso Criador, e imolai-vos mutuamente. Isso será preferível aos olhos de vosso Criador. Ele vos absolverá, porque é o Remissório, o Misericordiosíssimo.”","tr":""},{"pt":"Quanto ao Islam, a misericórdia e a facilidade manifestam-se no fato de que o arrependimento sincero basta para que Deus aceite o servo. Quem abandona o pecado, arrepende-se sinceramente, decide não voltar a cometê-lo e restitui os direitos de seus proprietários, encontrará Deus Altíssimo aceitando seu arrependimento.","tr":""},{"pt":"2. A facilidade nas regras da purificação","tr":"Temizlik hükümlerindeki kolaylık"},{"pt":"Entre as graças concedidas a esta comunidade está a simplificação das normas relativas à pureza ritual. Nas legislações anteriores, quando uma roupa era atingida por impureza, era necessário cortar a parte contaminada. Conforme relatado pelo Imam Ahmad, o Mensageiro de Deus (S.A.A.S) disse: “Quando a urina atingia a roupa de um dos filhos de Israel, eles cortavam a parte atingida com uma tesoura.” Na Jurisprudência Islâmica, entretanto, basta lavar a parte impura com água pura.","tr":"İslam hukukunda ise necis olan kısmı temiz suyla yıkamak yeterlidir."},{"pt":"3. A facilidade no jejum","tr":"Oruçtaki kolaylık"},{"pt":"Deus Exaltado seja permitiu que o doente, o viajante, a gestante e a lactante interrompam o jejum, conforme mencionado na surata Al Bacara versículo 184: “o cumprir o jejum, por achar-se enfermo ou em viagem, jejuará, depois, o mesmo número de dias.” O Profeta (S.A.A.S) disse: “Deus dispensou o viajante de metade da oração e do jejum, e concedeu licença à gestante e à lactante.” (Narrado por An-Nasa'i). Também faz parte dessa misericórdia o fato de que quem come ou bebe por esquecimento durante o jejum não invalida seu jejum. O Profeta (S.A.A.S) disse: “Quem comer ou beber por esquecimento enquanto jejua deve completar seu jejum, pois foi Deus Quem o alimentou e o saciou.” (Narrado por An-Nasa'i).","tr":""},{"pt":"Esses são apenas alguns exemplos entre muitos outros que demonstram que a Sharia Islâmica é apropriada para todos os tempos e lugares, sendo fundamentada na facilidade e na remoção das dificuldades. Essa é uma característica exclusiva da religião do Islam.","tr":""},{"pt":"O Profeta (S.A.A.S) disse: “Fui enviado com a religião monoteísta, reta e tolerante.” E Ibn Abbas (que Deus esteja satisfeito com ambos) relatou que perguntaram ao Mensageiro de Deus (S.A.A.S): “Qual religião é a mais amada por Deus?” Ele (S.A.A.S) respondeu: “A religião monoteísta, reta e tolerante.” (Narrado por Ahmad).","tr":""},{"pt":"O Profeta Muhammad (S.A.A.S) disse: “Fui enviado com a religião monoteísta, reta e tolerante (Al-Hanifiyyah As-Samhah).” E foi narrado por Ibn Abbas (que Deus esteja satisfeito com ambos) que perguntaram ao Mensageiro de Deus (S.A.A.S): “Qual religião é a mais amada por Deus?” Ele respondeu: “A religião monoteísta, reta e tolerante (Al-Hanifiyyah As-Samhah).” (Narrado por Ahmad).","tr":""},{"pt":"A expressão Al-Hanifiyyah refere-se à religião que se afasta da falsidade e se volta para a verdade, isto é, o monoteísmo puro legado pelo Profeta Abraão (Ibrahim). Já As-Samhah significa a religião fácil, moderada, tolerante e desprovida de rigor excessivo.","tr":""},{"pt":"Entre as nobres características do Mensageiro de Deus (S.A.A.S) está o fato de ter sido enviado como facilitador, portador de boas novas e libertador dos pesados fardos e das severas restrições que recaíam sobre as comunidades anteriores. Deus, o Altíssimo, revelou na surata Al Araf versículo 157: “São aqueles que seguem o Mensageiro, o Profeta iletrado, o qual encontram mencionado em sua Tora e seu Evangelho, o qual lhes recomenda o bem e lhes proíbe o ilícito, prescreve-lhes todo o bem e veda-lhes o imundo, alivia-os dos seus fardos e livra-os dos grilhões que os deprimem.”","tr":""},{"pt":"O termo “fardo” (isr) refere-se às legislações rigorosas e às obrigações pesadas impostas às nações que precederam esta comunidade. Em Sua infinita misericórdia, Deus Louvado seja aliviou a Ummah islâmica, removendo dela esses encargos e tornando lícitas muitas coisas que haviam sido proibidas aos povos anteriores.","tr":""},{"pt":"Por essa razão, o muçulmano recita constantemente esta grandiosa súplica revelada no Alcorão na surata Al Bacara versículo 286: “Ó Senhor nosso, não nos condenes, se nos esquecermos ou nos equivocarmos! Ó Senhor nosso, não nos imponhas carga, como a que impuseste aos nossos antepassados! Ó Senhor nosso, não nos sobrecarregues com o que não podemos suportar! Absolve-nos! Perdoa-nos! Tem misericórdia de nós! Tu és nosso Protetor! Concede-nos a vitória sobre os incrédulos!”","tr":""},{"pt":"E em um hadith autêntico, Deus Exaltado seja respondeu a essa súplica dizendo: “Já o fiz.” Ou seja, Deus aceitou essa invocação, atendeu ao pedido de Seus servos e concedeu à comunidade de Muhammad (S.A.A.S) a facilidade, a misericórdia e o alívio dos encargos excessivos que pesavam sobre as nações anteriores. Ou seja, aceitei vossa súplica e concedi aquilo que Me pedistes.","tr":""},{"pt":"Estas são minhas palavras e rogo perdão a Deus, o Grandioso, por mim e por vós. E nossa última de nossas súplicas é: Louvado seja Deus, Senhor dos mundos.","tr":""}];
function renderKhutbah(){

 a.innerHTML=`<div class="card khHero"><div class="kicker">Dinleme · okuma · kelime</div><h2>🕌 Portekizce Hutbe Çalışması</h2><p class="heroNote">Hutbeyi paragraf paragraf çalış. Portekizce kelimelere dokunarak Türkçe anlamını gör, telaffuzunu dinle ve kelime defterine kaydet.</p><div class="khTools"><button class="btn green" onclick="speakPT(KHUTBAH.map(x=>x.pt).join(' '))">🔊 Hutbenin tamamını dinle</button><button class="btn" onclick="openSaved()">🔖 Kelime defteri</button></div></div>
 <div class="card">${KHUTBAH.map((x,i)=>`<article class="khPara"><div class="storyMeta"><span class="khTag">Bölüm ${i+1}</span><span class="khTag">${i<2?"A1–A2":i<4?"A2":"B1"}</span></div><p class="khPt">${storyTokenize(x.pt)}</p>${x.tr?`<p class="khTr">${esc(x.tr)}</p>`:""}<button class="btn" onclick="speakPT(KHUTBAH[${i}].pt)">🔊 Dinle</button></article>`).join("")}</div>`;

let ptSpeechRate=parseFloat(localStorage.getItem("pt_speech_rate")||".88");
function openPtSettings(){document.getElementById("ptSettings").classList.add("show");syncPtSettings()}
function closePtSettings(){document.getElementById("ptSettings").classList.remove("show")}
function setPtSetting(type,val){
 if(type==="size"){localStorage.setItem("pt_size",val)}
 if(type==="theme"){localStorage.setItem("pt_theme",val)}
 if(type==="focus"){localStorage.setItem("pt_focus",localStorage.getItem("pt_focus")==="1"?"0":"1")}
 applyPtSettings();syncPtSettings()
}
function toggleTranslations(on){localStorage.setItem("pt_translations",on?"1":"0");applyPtSettings()}
function saveSpeechRate(v){ptSpeechRate=parseFloat(v);localStorage.setItem("pt_speech_rate",v)}
function applyPtSettings(){
 document.body.classList.toggle("ptLarge",localStorage.getItem("pt_size")==="large");
 document.body.classList.toggle("ptCalm",localStorage.getItem("pt_theme")==="calm");
 document.body.classList.toggle("ptFocus",localStorage.getItem("pt_focus")==="1");
 document.body.classList.toggle("ptCompact",localStorage.getItem("pt_translations")==="0");
}
function syncPtSettings(){
 let t=document.getElementById("translationToggle");if(t)t.checked=localStorage.getItem("pt_translations")!=="0";
 let r=document.getElementById("speechRate");if(r)r.value=localStorage.getItem("pt_speech_rate")||".88";
}
function resetPtSettings(){["pt_size","pt_theme","pt_focus","pt_translations","pt_speech_rate"].forEach(k=>localStorage.removeItem(k));ptSpeechRate=.88;applyPtSettings();syncPtSettings()}

function openStory(i){
 const s=DATA.stories[i]; page="stories"; levelFilter=s.level||"A1"; document.body.className="level-"+levelFilter; nav();
 const pts=s.text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[s.text];
 const trs=(s.tr||"").match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[s.tr||""];
 const paired=pts.map((p,j)=>`<p class="storyText">${storyTokenize(p.trim())}</p><p class="storyTr">${esc((trs[j]||"").trim())}</p>`).join("");
