<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f0e6"><title>Portekizce Öğreniyorum A1</title><style>
:root{--bg:#f6f0e6;--card:#fffdf8;--green:#718172;--green2:#dfe7de;--line:#e4ddd1;--text:#403a34;--muted:#756d64;--gold:#a88c5d}

.item{padding:14px 0;border-bottom:1px solid var(--line)}

.verbItem{padding:18px 4px;border-bottom:1px solid var(--line)}.verbHead{font-size:22px;line-height:1.55;color:var(--brown)}.verbNo{font-weight:800}.verbPt{font-weight:800}.verbTr{font-weight:500}.verbAr{font-family:"Amiri",serif;font-size:28px;direction:rtl;display:inline-block;margin-left:8px;color:var(--brown2)}.verbExample{margin-top:10px;background:#f2eadc;border-left:4px solid var(--green);border-radius:12px;padding:13px 14px}.verbExample b{display:block;color:var(--brown2);font-size:16px;margin-bottom:7px}.verbExample .ptEx{font-size:18px;line-height:1.65}.verbExample .trEx{margin-top:6px;color:var(--muted);font-size:15px;line-height:1.55}
.lookupPron{margin-top:8px}.lookupPron button{border:0;background:#dfe7de;color:#18553d;border-radius:10px;padding:8px 11px;font-weight:700}
.item:last-child{border-bottom:0}.pt{font-size:21px;font-weight:650}.tr{color:var(--muted);margin-top:4px}.sentence{margin:8px 0;line-height:1.55}
.btn{display:inline-block;border:0;background:#eee7db;color:var(--text);padding:10px 13px;border-radius:12px;text-decoration:none;margin-top:8px}.btn.green{background:var(--green);color:white}.btn.saved{background:#d5e1d4}
.story p{font-size:17px;line-height:1.8}.tok{border-bottom:1px dotted var(--gold);cursor:pointer}.lookup{display:none;background:#f0ebe2;border-radius:13px;padding:11px;margin:8px 0;font-size:14px}.lookup.show{display:block}
.wordtag{display:inline-block;background:var(--green2);padding:7px 9px;border-radius:11px;margin:4px;font-size:14px}.result{padding:10px;border-radius:12px;background:#f0ebe2;margin:8px 0}
.task{background:#f2eadc;border-left:4px solid var(--gold);padding:12px;border-radius:12px}textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:white}.small{font-size:13px;color:var(--muted)}
</style></head><body>

"},{"pt":"explicar","tr":"açıklamak","ar":"شَرَحَ","example":"Eu explico a lição.","trExample":"Dersi açıklıyorum."},{"pt":"aprender","tr":"öğrenmek","ar":"تَعَلَّمَ","example":"Eu aprendo uma palavra nova.","trExample":"Yeni bir kelime öğreniyorum."},{"pt":"ensinar","tr":"öğretmek","ar":"عَلَّمَ","example":"Eu ensino uma palavra ao meu amigo.","trExample":"Arkadaşıma bir kelime öğretiyorum."},{"pt":"escrever","tr":"yazmak","ar":"كَتَبَ","example":"Eu escrevo uma frase.","trExample":"Bir cümle yazıyorum."},{"pt":"receber","tr":"almak, teslim almak","ar":"تَلَقَّى","example":"Eu recebo uma mensagem.","trExample":"Bir mesaj alıyorum."},{"pt":"mandar","tr":"göndermek","ar":"أَرْسَلَ","example":"Eu mando uma mensagem.","trExample":"Bir mesaj gönderiyorum."},{"pt":"levar","tr":"götürmek","ar":"حَمَلَ","example":"Eu levo o livro comigo.","trExample":"Kitabı yanımda götürüyorum."},{"pt":"trazer","tr":"getirmek","ar":"جَلَبَ","example":"Eu trago água para a família.","trExample":"Aile için su getiriyorum."},{"pt":"colocar","tr":"koymak","ar":"وَضَعَ","example":"Eu coloco o livro na bolsa.","trExample":"Kitabı çantaya koyuyorum."},{"pt":"tirar","tr":"çıkarmak, almak","ar":"أَزَالَ","example":"Eu tiro o livro da bolsa.","trExample":"Kitabı çantadan çıkarıyorum."},{"pt":"lavar","tr":"yıkamak","ar":"غَسَلَ","example":"Eu lavo as mãos.","trExample":"Ellerimi yıkıyorum."},{"pt":"limpar","tr":"temizlemek","ar":"نَظَّفَ","example":"Eu limpo a sala.","trExample":"Odayı temizliyorum."},{"pt":"cozinhar","tr":"pişirmek","ar":"طَبَخَ","example":"Eu cozinho para minha família.","trExample":"Ailem için yemek pişiriyorum."},{"pt":"viajar","tr":"seyahat etmek","ar":"سَافَرَ","example":"Eu viajo para visitar minha família.","trExample":"Ailemi ziyaret etmek için seyahat ediyorum."},{"pt":"visitar","tr":"ziyaret etmek","ar":"زَارَ","example":"Eu visito a mesquita.","trExample":"Camiyi ziyaret ediyorum."},{"pt":"rezar","tr":"dua etmek, namaz kılmak","ar":"صَلَّى","example":"Eu rezo cinco vezes por dia.","trExample":"Günde beş vakit namaz kılıyorum."},{"pt":"jejuar","tr":"oruç tutmak","ar":"صَامَ","example":"Eu jejuo no Ramadão.","trExample":"Ramazan’da oruç tutuyorum."},{"pt":"memorizar","tr":"ezberlemek","ar":"حَفِظَ","example":"Eu memorizo uma surata.","trExample":"Bir sure ezberliyorum."},{"pt":"lembrar","tr":"hatırlamak","ar":"تَذَكَّرَ","example":"Eu lembro de Allah.","trExample":"Allah’ı hatırlıyorum."},{"pt":"esquecer","tr":"unutmak","ar":"نَسِيَ","example":"Eu não esqueço a oração.","trExample":"Namazı unutmuyorum."},{"pt":"entender","tr":"anlamak","ar":"فَهِمَ","example":"Eu entendo a frase.","trExample":"Cümleyi anlıyorum."},{"pt":"pensar","tr":"düşünmek","ar":"فَكَّرَ","example":"Eu penso antes de responder.","trExample":"Cevap vermeden önce düşünüyorum."},{"pt":"achar","tr":"düşünmek, bulmak","ar":"ظَنَّ","example":"Eu acho a resposta.","trExample":"Cevabı buluyorum."},{"pt":"acreditar","tr":"inanmak","ar":"آمَنَ","example":"Eu acredito em Allah.","trExample":"Allah’a inanıyorum."},{"pt":"continuar","tr":"devam etmek","ar":"اِسْتَمَرَّ","example":"Eu continuo estudando.","trExample":"Çalışmaya devam ediyorum."},{"pt":"parar","tr":"durmak","ar":"تَوَقَّفَ","example":"Eu paro para descansar.","trExample":"Dinlenmek için duruyorum."},{"pt":"correr","tr":"koşmak","ar":"جَرَى","example":"Eu corro no parque.","trExample":"Parkta koşuyorum."},{"pt":"sentar","tr":"oturmak","ar":"جَلَسَ","example":"Eu sento para estudar.","trExample":"Ders çalışmak için oturuyorum."},{"pt":"levantar","tr":"kalkmak","ar":"قَامَ","example":"Eu levanto cedo.","trExample":"Erken kalkıyorum."},{"pt":"acordar","tr":"uyanmak","ar":"اِسْتَيْقَظَ","example":"Eu acordo antes do amanhecer.","trExample":"Tan vaktinden önce uyanıyorum."},{"pt":"descansar","tr":"dinlenmek","ar":"اِسْتَرَاحَ","example":"Eu descanso depois da aula.","trExample":"Dersten sonra dinleniyorum."},{"pt":"assistir","tr":"izlemek","ar":"شَاهَدَ","example":"Eu assisto a uma aula.","trExample":"Bir ders izliyorum."},{"pt":"verificar","tr":"kontrol etmek","ar":"تَحَقَّقَ","example":"Eu verifico a palavra no dicionário.","trExample":"Kelimeyi sözlükte kontrol ediyorum."},{"pt":"telefonar","tr":"telefon etmek","ar":"اِتَّصَلَ","example":"Eu telefono para meu amigo.","trExample":"Arkadaşımı telefonla arıyorum."},{"pt":"ligar","tr":"aramak, açmak","ar":"اِتَّصَلَ","example":"Eu ligo para minha mãe.","trExample":"Annemi arıyorum."},{"pt":"enviar","tr":"göndermek","ar":"أَرْسَلَ","example":"Eu envio uma mensagem.","trExample":"Bir mesaj gönderiyorum."},{"pt":"cooperar","tr":"iş birliği yapmak","ar":"تَعَاوَنَ","example":"Nós cooperamos para o bem.","trExample":"İyilik için iş birliği yapıyoruz."},{"pt":"compartilhar","tr":"paylaşmak","ar":"شَارَكَ","example":"Nós compartilhamos o conhecimento.","trExample":"İlmi paylaşıyoruz."},{"pt":"escolher","tr":"seçmek","ar":"اِخْتَارَ","example":"Eu escolho uma boa palavra.","trExample":"Güzel bir kelime seçiyorum."},{"pt":"preferir","tr":"tercih etmek","ar":"فَضَّلَ","example":"Eu prefiro estudar de manhã.","trExample":"Sabah çalışmayı tercih ediyorum."},{"pt":"poder","tr":"ebilmek","ar":"اِسْتَطَاعَ","example":"Eu posso aprender.","trExample":"Öğrenebilirim."},{"pt":"dever","tr":"gerekmek, -meli","ar":"يَجِبُ","example":"Eu devo respeitar meus pais.","trExample":"Anne babama saygı göstermeliyim."},{"pt":"deixar","tr":"bırakmak","ar":"تَرَكَ","example":"Eu deixo o livro aqui.","trExample":"Kitabı burada bırakıyorum."},{"pt":"permitir","tr":"izin vermek","ar":"سَمَحَ","example":"Allah permite o bem.","trExample":"Allah hayra izin verir."},{"pt":"tentar","tr":"denemek","ar":"حَاوَلَ","example":"Eu tento falar português.","trExample":"Portekizce konuşmaya çalışıyorum."},{"pt":"conseguir","tr":"başarmak","ar":"اِسْتَطَاعَ","example":"Eu consigo entender a frase.","trExample":"Cümleyi anlayabiliyorum."},{"pt":"nascer","tr":"doğmak","ar":"وُلِدَ","example":"Uma criança nasce todos os dias.","trExample":"Her gün bir çocuk doğuyor."},{"pt":"morr . João fica feliz porque gosta de rezar com seus amigos.","words":[["mesquita","cami"],["oração","namaz, dua"],["amigo","arkadaş"],["trabalho","iş"],["rezar","namaz kılmak"]]},{"title":"Sabah Namazı","text":"Maria acorda cedo. Ela lava o rosto e faz a ablução. Depois, prepara um lugar limpo e faz a oração da manhã. Ela lê algumas páginas do Alcorão e agradece a Allah pelo novo dia.","words":[["acorda","uyanır"],["ablução","abdest"],["manhã","sabah"],["Alcorão","Kur'an"],["agradece","şükreder, teşekkür eder"]]},{"title":"Ramazan Günü","text":"Durante o Ramadão, Ahmed acorda antes do amanhecer para o suhur. Ele come uma refeição simples e bebe água. Durante o dia, ele jejua e trabalha normalmente. Ao pôr do sol, ele faz a oração e quebra o jejum com sua família.","words":[["Ramadão","Ramazan"],["suhur","sahur"],["amanhecer","tan vakti"],["jejuar","oruç tutmak"],["jejum","oruç"],["família","aile"]]},{"title":"Ailem","text":"Minha família mora perto da mesquita. Meu pai trabalha de manhã e minha mãe prepara o almoço. Depois do trabalho, todos se encontram em casa. Nós conversamos, comemos juntos e agradecemos a Allah.","words":[["família","aile"],["pai","baba"],["mãe","anne"],["almoço","öğle yemeği"],["casa","ev"],["juntos","birlikte"]]},{"title":"Arkadaşım","text":"Meu amigo Yusuf estuda português todos os dias. Ele lê um texto curto e escreve algumas frases. Quando não entende uma palavra, ele pergunta e aprende. Depois, ele conversa comigo e pratica as palavras novas.","words":[["amigo","arkadaş"],["estuda","ders çalışır"],["texto","metin"],["frases","cümleler"],["entende","anlar"],["palavra","kelime"]]},{"title":"Kur'an Okumak","text":"Depois da oração, Hamza senta em um lugar tranquilo e lê o Alcorão. Ele lê devagar para entender as palavras. Depois, escreve uma frase sobre o que aprendeu. Antes de dormir, ele repete as palavras novas.","words":[["Alcorão","Kur'an"],["devagar","yavaşça"],["entender","anlamak"],["aprendeu","öğrendi"],["dormir","uyumak"],["repete","t ],"example":"Eu acordo cedo e durmo à noite.","tr":"Erken uyanırım ve gece uyurum.","exercise":"Eu ___ cedo.","answers":["acordo","dormo"]},{"title":"Sahiplik","topic":"meu / minha / seu / sua","words":[["meu","benim"],["minha","benim"],["pai","baba"],["mãe","anne"],["família","aile"]],"example":"Minha família mora perto da mesquita.","tr":"Ailem caminin yakınında oturuyor.","exercise":"___ mãe está em casa.","answers":["Minha","Meu"]},{"title":"Gostar de","topic":"Gostar de ile sevdiğin şeyleri söyleme","words":[["gostar","hoşlanmak"],["estudar","çalışmak"],["ler","okumak"],["Alcorão","Kur’an"],["oração","namaz"]],"example":"Eu gosto de ler o Alcorão.","tr":"Kur’an okumayı seviyorum.","exercise":"Eu gosto ___ estudar.","answers":["de","a"]},{"title":"Soru cümleleri","topic":"Quem, onde, quando, o que","words":[["quem","kim"],["onde","nerede"],["quando","ne zaman"],["o que","ne"],["por quê","neden"]],"example":"Onde fica a mesquita?","tr":"Cami nerede?","exercise":"___ fica a mesquita?","answers":["Onde","Quem"]},{"title":"Olumsuz cümleler","topic":"Não ile olumsuzluk","words":[["não","değil, -me/-ma"],["perder","kaybetmek"],["esquecer","unutmak"],["esperança","ümit"],["oração","namaz"]],"example":"Eu não esqueço a oração.","tr":"Namazı unutmuyorum.","exercise":"Eu ___ esqueço.","answers":["não","sim"]},{"title":"Tekrar ve konuşma","topic":"A1 tekrar: temel fiiller ve İslami kelimeler","words":[["jejuar","oruç tutmak"],["jejum","oruç"],["caridade","sadaka"],["respeito","saygı"],["sinceridade","samimiyet"]],"example":"Eu jejuo no Ramadão e ajudo minha família.","tr":"Ramazan’da oruç tutuyorum ve aileme yardım ediyorum.","exercise":"Eu ___ no Ramadão.","answers":["jejuo","jejuar"]}]};
let saved=JSON.parse(localStorage.getItem("pt_saved")||"[]"), completed=JSON.parse(localStorage.getItem("pt_completed")||"[]"), writings=JSON.parse(localStorage.getItem("pt_writings")||"{}"), page="home";
const navItems=[["home","Ana Sayfa"],["lesson","Dersler"],["stories","11 Hikâye"],["verbs","111 Fiil"],["saved","Kelimelerim"]];
function nav(){document.getElementById("nav").innerHTML=navItems.map(x=>'<button class="'+(page===x[0]?"active":"")+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join("")}
function go(p){page=p;nav();render()}
function saveWord(w){saved.includes(w)?saved=saved.filter(x=>x!==w):saved.push(w);localStorage.setItem("pt_saved",JSON.stringify(saved));render()}
function markStory(i){completed.includes(i)?completed=completed.filter(x=>x!==i):completed.push(i);localStorage.setItem("pt_completed",JSON.stringify(completed));render()}
function tokenize(text){return text.split(/(\s+|[,.!?;:()])/).map(x=>{let clean=x.toLowerCase().replace(/^[^a-zà-ÿ]+|[^a-zà-ÿ]+$/gi,"");let key=Object.keys(DATA.dictionary).find(k=>k.toLowerCase()===clean);return key?'<span class="tok" onclick="lookup(event,\''+key.replace(/'/g,"\\'")+'\')">'+x+'</span>':x}).join("")}
let activeLookupWord=null, activeLookupNode=null;
function speakPT(word){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(word);u.lang='pt-BR';u.rate=.9;const voices=speechSynthesis.getVoices();const v=voices.find(x=>/^pt-BR$/i.test(x.lang))||voices.find(x=>/^pt/i.test(x.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}
function lookup(e,w){e.stopPropagation();const node=e.target.closest('.tok');if(activeLookupNode===node && activeLookupWord===w){const old=document.querySelector('.lookup');if(old)old.remove();activeLookupNode=null;activeLookupWord=null;return}let old=document.querySelector('.lookup');if(old)old.remove();activeLookupNode=node;activeLookupWord=w;let box=document.createElement('div');box.className='lookup show';box.innerHTML='<b>'+w+'</b><br>'+DATA.dictionary[w]+'<div class="lookupPron"><button type="button" onclick="speakPT(\''+w.replace(/'/g,"\\'")+'\')">🔊 Telaffuz</button></div><button class="btn '+(saved.includes(w)?"saved":"")+'" onclick="saveWord(\''+w.replace(/'/g,"\\'")+'\')">'+(saved.includes(w)?"✓ Kaydedildi":"🔖 Kaydet")+'</button>';e.target.parentElement.after(box)}
function answer(el,ok){let r=document.createElement("div");r.className="result";r.innerText=ok?"✓ Doğru cevap":"✗ Tekrar dene";el.parentElement.appendChild(r)}

}
if(page==="lesson"){
 a.innerHTML=`<div class="card"><h2>A1 · 11 Ders</h2><p class="small">Her derste bir dil bilgisi konusu, İslami kelimeler, örnek cümle ve kısa alıştırma bulunur.</p><div class="lessonGrid">${DATA.lessons.map((l,i)=>`<div class="lessonCard" onclick="openLesson(${i})"><h3>${i+1}. ${l.title}</h3><p>${l.topic}</p></div>`).join('')}</div></div>`;
}

 a.innerHTML=`<div class="card"><h2>A1 · 111 Fiil</h2><p class="small">Her fiil: Portekizce · Türkçe · Arapça karşılık · örnek cümle · Türkçesi.</p>${DATA.verbs.map((v,i)=>`<div class="verbItem"><div class="verbHead"><span class="verbNo">${i+1}.</span> <span class="verbPt">${v.pt}</span> <span class="verbTr">- ${v.tr} -</span> <span class="verbAr">${v.ar}</span></div><div class="verbExample"><b>Ex:</b><div class="ptEx">• ${v.example}</div><div class="trEx">${v.trExample}</div><button class="btn" type="button" onclick='speakPT(${JSON.stringify(v.example)})'>🔊 Telaffuz</button></div></div>`).join('')}</div>`;

}

}
function openLesson(i){
 let l=DATA.lessons[i],a=document.getElementById("app");

nav();render();
