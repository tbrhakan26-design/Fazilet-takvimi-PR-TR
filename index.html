.tap.selected{outline:2px solid var(--orange);background:#f7dfb9}
.term{font-weight:700;border-radius:5px;padding:1px 4px;cursor:pointer;transition:.15s}
.term:hover{filter:brightness(.96)}
.term.c1{background:#dcebdc;color:#18553d}
.term.c2{background:#e8def3;color:#56377a}
.term.c3{background:#f7dfbd;color:#7a4518}
.term.c1::after,.term.c2::after,.term.c3::after{content:" •";font-size:10px}
.studyLegend{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0 0;padding:8px 10px;border-radius:12px;background:#f8efdf;border:1px solid #e4d2b4;font-size:12px;color:#62564d}
.studyLegend span{padding:3px 7px;border-radius:8px;font-weight:700}.studyLegend .l1{background:#dcebdc;color:#18553d}.studyLegend .l2{background:#e8def3;color:#56377a}.studyLegend .l3{background:#f7dfbd;color:#7a4518}
.story{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:visible;box-shadow:0 2px 8px #4f2a1110}
.storyHeader{width:100%;border:0;background:transparent;color:var(--brown);padding:15px 16px 12px;display:flex;flex-direction:column;align-items:flex-start;position:relative;text-align:left;font-family:Georgia,serif;cursor:pointer}.storyArrow{position:relative;left:auto;top:auto;transform:none;margin:8px auto 0;width:48px;height:32px;flex:0 0 32px;border-radius:17px;background:rgba(255,250,240,.12);border:1px solid rgba(220,197,160,.22);display:flex;align-items:center;justify-content:center;font:36px/1 -apple-system,BlinkMacSystemFont,sans-serif;color:rgba(190,105,35,.72);transform-origin:center}.story.open .storyArrow{transform:rotate(180deg)}.storyTitle{font-size:21px;font-weight:700}.storyContent{display:none;padding:0 16px 17px;border-top:1px solid var(--line)}.story.open .storyContent{display:block}.storyContent .lang{border:0;padding:12px 0 0;margin:0;background:transparent}.storyContent .lang p{font-size:16px}
.inlineWord{position:absolute;z-index:30;width:min(330px,calc(100% - 20px));display:none;background:#fffaf0;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 10px 30px #4f2a1126;text-align:center}.inlineWord.show{display:block}.wordLabel{font-size:11px;color:#7b6b5b;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}.wordMeaning{font-size:18px!important;line-height:1.35;color:#173f31;margin:0 0 8px}.wordMeaning small{display:block;font-size:12px;color:#7b6b5b;margin-top:3px}.bubbles{display:flex;justify-content:center;gap:7px;margin:0}.bubble{flex:1;min-width:0;height:58px;border:1px solid #e1cda9;border-radius:14px;background:#fffdf8;box-shadow:none;font:700 11px -apple-system,BlinkMacSystemFont,sans-serif;color:#30241c;padding:5px 3px;cursor:pointer}.bubble i{display:block;width:25px;height:25px;border-radius:50%;margin:0 auto 3px;color:#fff;font:14px -apple-system,BlinkMacSystemFont,sans-serif;line-height:25px;font-style:normal}.bubble.s i{background:var(--orange)}.bubble.e i{background:var(--green)}.bubble.k i{background:#87501f}.exampleBox{display:none;margin:0 auto 8px;max-width:310px;background:#f2e5f8;border:1px solid #d8c2e4;border-radius:13px;padding:9px;font-size:13px;line-height:1.45;text-align:left}.exampleBox.show{display:block}.pronunciationBox{display:none;margin:0 auto 8px;max-width:310px;background:#e5f0e9;border:1px solid #bfd8c8;border-radius:13px;padding:8px;font-size:14px;color:#18553d;font-weight:700}.pronunciationBox.show{display:block}.exampleBox b{color:#56377a}.exampleBox .exTr{display:block;margin-top:4px;color:#5c5148}
.studyLegend{justify-content:flex-start}.lang.tr .term.c1,.lang.tr .term.c2,.lang.tr .term.c3{font-weight:700}.storyContent .lang p{font-size:16px;line-height:1.72}.storyContent .lang.tr p{font-size:16px;line-height:1.72}
.wordPopupArrow{position:absolute;width:12px;height:12px;background:#fffaf0;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg);top:-7px;left:28px}
.drawerShade{display:none;position:fixed;inset:0;background:#3b26165c;z-index:40}.drawerShade.show{display:block}.drawer{position:fixed;z-index:41;right:0;top:0;height:100%;width:min(330px,86%);background:var(--paper);box-shadow:-10px 0 35px #0003;padding:23px 20px;transform:translateX(100%);transition:.25s}.drawer.show{transform:translateX(0)}.drawerTop{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:15px}.drawerTop h2{margin:0;font-size:25px}.closeMenu{border:0;background:#fae6c1;border-radius:50%;width:43px;height:43px;color:var(--brown);font-size:24px}.drawer a,.drawer button.item{display:block;width:100%;border:0;background:none;text-align:left;color:var(--brown);font:19px "KoHo",sans-serif;padding:17px 6px;border-bottom:1px solid #ead9bc}.drawer .favCount{color:var(--green);font-size:14px;margin-left:5px}

.accordionHeader{width:100%;border:0;background:transparent;color:var(--brown);padding:42px 16px 15px;display:block;position:relative;text-align:left;font-family:"KoHo",sans-serif;cursor:pointer}
.accArrow{position:absolute;left:12px;top:10px;transform:none;width:48px;height:32px;border-radius:17px;background:rgba(255,250,240,.12);border:1px solid rgba(220,197,160,.22);display:flex;align-items:center;justify-content:center;font:36px/1 -apple-system,BlinkMacSystemFont,sans-serif;color:rgba(190,105,35,.72);transform-origin:center;transition:.2s}
.accordion.open .accArrow{transform:rotate(180deg)}
.accordionTitle{font-size:22px;font-weight:700;color:#18563f}
.accordionContent{display:none;padding:0 12px 16px;border-top:1px solid var(--line)}
.accordion.open .accordionContent{display:block}
.hadithAccordion .hadithCard{position:relative;border:0;box-shadow:none;padding:13px 5px 4px}
.hadithAccordion .arabic{font-size:22px;line-height:1.85}

.story{margin-top:0}
.storyHeader{padding:50px 16px 12px;align-items:center;text-align:center}.storyTitle{width:100%;text-align:center}.storyArrow{position:absolute;left:12px;top:10px;margin:0;order:0}

.shareBtn:active{transform:scale(.94)}
.hadithAccordion,.story{position:relative}
.story .shareBtn{top:8px;right:12px}
.hadithArabicHeader{width:100%;border:0;background:transparent;padding:50px 14px 12px;display:block;position:relative;cursor:pointer;text-align:center;overflow:hidden}.hadithArabicHeader .accArrow{left:12px;top:10px;margin-left:0;transform:none}.hadithArabicPreview{margin:0!important;font-size:22px!important;line-height:1.85!important}.hadithAccordion .accordionContent{padding:0 12px 16px}.hadithAccordion.open .hadithArabicHeader{border-bottom:1px solid var(--line)}

@font-face{font-family:'UthmanTaha';src:url('fonts/KFGQPC Uthman Taha Naskh Regular/KFGQPC Uthman Taha Naskh Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
.arabic,.arabic *,.arWord,.arabicWord{font-family:'UthmanTaha',serif!important;font-weight:400}
.accArrow::before,.storyArrow::before{content:"";width:13px;height:13px;border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg) translateY(-2px);transform-origin:center}.accordion.open .accArrow{transform:rotate(180deg)}.story.open .storyArrow{transform:rotate(180deg)}
.dayViewport{overflow:hidden;width:100%;position:relative}.dayTrack{display:flex;width:200%;transition:transform .32s ease}.dayPage{width:50%;flex:0 0 50%;overflow:hidden}.dayPage .header{padding-top:18px}.dayContent{position:relative}.dayContentPage{width:100%}.dayContentPage .section{margin-top:0}.dayPage .prayers{padding-bottom:8px}.dayPage .prayer{scroll-snap-align:center}
.dayPage .prayers{overflow-x:auto}.dayPage .prayer{min-width:104px}
.dayContentPage{animation:dayFade .2s ease}.dayPage{min-height:1px}@keyframes dayFade{from{opacity:.5;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
</style>

    source:'(Târîh-i Dımaşk)',
    storyTitle:'PALAVRAS SÁBIAS',
    storyPt:'<p>• As pessoas mais valiosas são aquelas que servem de meio para <span class="term tap c1" data-key="elevar">elevar</span> e renovar o Islã. Allah, o Altíssimo, faz com que a nossa religião seja promovida por meio do nosso Profeta (s.a.v.), dos amigos de Allah e dos renovadores. Por isso, promover os conhecimentos religiosos é uma das maiores virtudes. Ser motivo para a promoção e a revitalização de uma única regra da Sharî‘a já é uma grande virtude. Por isso, é necessário ter plena fidelidade e seguir de perto os mujtahids e os profetas.</p><p>• Há uma diferença entre o <span class="term tap c2" data-key="sábio">sábio</span> e o <span class="term tap c3" data-key="devoto">devoto</span>. O sábio que também é devoto e pratica aquilo que sabe é uma pessoa de grande valor. Para explicar o valor de quem é sábio e devoto, sua posição foi comparada à do devoto. A diferença entre o sábio e o devoto é tão grande quanto a diferença entre a lua e as estrelas. Nosso Mensageiro de Allah (s.a.v.) também deu a si mesmo como exemplo e disse, em sentido: “Minha superioridade sobre um de vós é como...” A missão profética existe para a continuidade e transmissão do conhecimento. Que Allah, o Altíssimo, nos conceda aprender e ensinar o verdadeiro conhecimento. O tinteiro do sábio foi pesado junto com o sangue do mártir, e o tinteiro do conhecimento do sábio foi considerado mais valioso.</p><p>• Em <em>İhyâü Ulûmi’d-dîn</em> afirma-se: “O conhecimento é a adoração do coração.” Assim como há purificação e limpeza antes da oração, e assim como a oração é uma adoração realizada pelos membros, o coração também possui uma adoração espiritual. Da mesma forma que a oração não é válida sem a purificação e o wudu dos membros, o conhecimento e a adoração também exigem preparação. Primeiro é necessário purificar os membros e as faculdades internas; do mesmo modo, o coração deve ser purificado das más qualidades, e a alma que ordena o mal deve ser libertada dos maus hábitos e da má moral, para que seja possível beneficiar-se do conhecimento.</p><p>• A construção e o florescimento do coração acontecem por meio do <span class="term tap c1" data-key="conhecimento">conhecimento</span>. Mas por qual conhecimento? Pelo conhecimento espiritual. Primeiro o coração será lavado com ele e, depois, será adornado.</p><p>• Uma pessoa sem <span class="term tap c2" data-key="espiritualidade">espiritualidade</span> é como uma ave congelada. Quando se olha para essa ave, não há nenhuma diferença entre ela e as outras aves. Mas dentro dela não há espírito. Assim como essa ave não pode beneficiar a si mesma nem aos outros, uma pessoa sem espiritualidade também não pode beneficiar a si mesma nem aos outros.</p>',
    storyTr:'<p>• İnsanların en kıymetlisi, en değerlisi, İslâm’ın tervîcine (yüceltilmesine) ve onun tecdîdine (ihyâsına) vesile olan insanlardır. Cenâb‑ı Hak, Peygamberimiz (s.a.v.) ile, evliyâullah ile, müceddid ile dinimizi tervîc ediyor. Onun için dînî ilimlerin tervîci, en büyük kıymettir. Sadece bir şer’î hükmün tervîcine, ihyasına sebep olmak bile, en büyük kıymettir. Onun için bu müctehidlere, peygamberlere tam bağlılık, tam benzemek lâzımdır.</p><p>• <span class="term tap c2" data-key="Âlim">Âlimle</span> <span class="term tap c3" data-key="âbid">âbid</span> arasında fark var. Âlim ve aynı zamanda âbid olan, ilmiyle âmil olan insanlar çok kıymetlidir. İşte ilmiyle âbid olan insanın kıymetini anlatabilmek için âbidle kıyas edilmiş. Âlim ile âbid arasındaki fark, ay ile yıldızlar arasındaki fark kadar büyük veyahut Resûlullah Efendimiz (s.a.v.) kendisini misal buyurarak “Sizin ednânızdan birisi üzerine fazlım gibi” buyurmuşlar. Peygamberlik vazifesi zaten ilmin devamı içindir. O hakiki ilmi öğrenip öğretebilmeyi Cenâb‑ı Hak nasip eylesin. Âlimin kaleminin mürekkebi ile şehidin kanı tartılmış, âlimin ilminin mürekkebi daha kıymetli gelmiştir.</p><p>• İhyâü Ulûmi’d-dîn’de; ilim, kalbin ibadetidir, deniliyor. Nasıl ki namazdan önce yapılacak taharet ve temizlik varsa, nasıl ki namaz, âzâlarla yapılan ibadetse; ama namazın aslı manevî bir ibadetse ve de âzâlar vasıtasıyla yapıldığı için âzâların temizliği önemliyse, âzâların temizliği olmadan, abdest, tahâret olmadan namaz sahih olmuyorsa, ilim ve ibadet de böyledir. Önce âzâların ve cevârihin temizlenmesi lâzım. Bunun gibi, kalbin de kötü vasıflardan temizlenmesi lâzım, nefs‑i emmârenin kötü vasıflardan, kötü ahlâklardan kurtulması lâzım ki ilimden istifade edilebilsin.</p><p>• Kalbin imarı, imareti, <span class="term tap c1" data-key="ilim">ilim</span> ile olur; ama hangi ilimle olur? Manevî ilimle olur. Kalp önce onunla yıkanacak, ondan sonra tezyînât olacak.</p><p>• Mâneviyatsız bir kişi, dondurulmuş kuşa benzer. O kuşa gidersiniz, bakarsınız, diğer kuşlardan hiçbir farkı yoktur. Ama içinde ruh yoktur. Bu kuşun, kendisine faydası olmadığı gibi başkasına da faydası yoktur. İşte maneviyatsız kişi, bu kuşa benzer.</p>'
  }
];

let activeWordPanel=null;
function selectWord(el){
 document.querySelectorAll('.term.tap').forEach(x=>x.classList.remove('selected'));
 el.classList.add('selected');
 currentKey=el.dataset.key;
 const w=words[currentKey]||{ar:'',pt:currentKey,tr:currentKey,example:'Uma frase de exemplo pode ser preparada para esta palavra.'};
 const root=el.closest('.hadithCard,.story');
 activeWordPanel=root?.querySelector('.inlineWord');
 if(!activeWordPanel) return;
 const meaning=activeWordPanel.querySelector('.wordMeaning');
 const example=activeWordPanel.querySelector('.exampleBox');
 const pron=activeWordPanel.querySelector('.pronunciationBox');
 if(meaning) meaning.innerHTML='<b>'+w.tr+'</b>';
 if(example){example.classList.remove('show');example.innerHTML='';}
 if(pron){pron.classList.remove('show');pron.textContent='';}
 activeWordPanel.classList.add('show');
 // Posiciona o balão imediatamente junto à palavra tocada, nunca no final da página.
 const parent=activeWordPanel.offsetParent || root;
 const er=el.getBoundingClientRect();
 const pr=parent.getBoundingClientRect();
 let left=er.left-pr.left+parent.scrollLeft-10;
 let top=er.top-pr.top+parent.scrollTop-activeWordPanel.offsetHeight-10;
 if(top<10) top=er.bottom-pr.top+parent.scrollTop+10;
 const maxLeft=parent.clientWidth-activeWordPanel.offsetWidth-10;
 left=Math.max(10,Math.min(left,maxLeft));
 activeWordPanel.style.left=left+'px';
 activeWordPanel.style.top=top+'px';
 const arrow=activeWordPanel.querySelector('.wordPopupArrow');
 if(arrow){let ax=er.left-pr.left+er.width/2-left-6;ax=Math.max(14,Math.min(activeWordPanel.offsetWidth-24,ax));arrow.style.left=ax+'px';}
}

}
let ptVoicePromise=null;
function getBestPortugueseVoice(){
 if(!('speechSynthesis' in window)) return null;
 const voices=speechSynthesis.getVoices();
 if(!voices.length) return null;
 const ranked=voices.filter(v=>/^pt-BR|^pt_/i.test(v.lang)||/^pt/i.test(v.lang)).sort((a,b)=>{
   const score=v=>{let n=(v.name||'').toLowerCase(),s=0;if(/luciana|fernanda|joana/.test(n))s+=30;if(/premium|enhanced|natural|neural/.test(n))s+=20;if(/pt-br/.test((v.lang||'').toLowerCase()))s+=10;return s};return score(b)-score(a)
 });
 return ranked[0]||voices.find(v=>/^pt/i.test(v.lang))||null;
}
function speakCurrent(){
 const w=words[currentKey];
 if(!w) return;
 const pron=activeWordPanel?.querySelector('.pronunciationBox');
 if(pron){pron.textContent='Pronúncia: '+pronunciation(currentKey);pron.classList.add('show');}
 if(!('speechSynthesis' in window)) return;
 const speak=()=>{const u=new SpeechSynthesisUtterance(w.pt);u.lang='pt-BR';const voice=getBestPortugueseVoice();if(voice)u.voice=voice;u.rate=.9;u.pitch=1;speechSynthesis.cancel();speechSynthesis.speak(u)};
 if(!speechSynthesis.getVoices().length){speechSynthesis.onvoiceschanged=()=>{speechSynthesis.onvoiceschanged=null;speak()};setTimeout(speak,350)}else speak();
}

function setupPrayerTracker(){
 const pages=[...document.querySelectorAll('.dayPage')];
 let lastActiveIndex=-1;
 function toMinutes(v){const m=(v||'').match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):9999}
 function update(){
  // Saat bilgisi doğrudan telefonun/brauzerin yerel saatinden alınır.
  // Sayfada saat gösterilmez, ancak namaz vakti takibi arka planda gerçek zamanlı çalışır.
  const now=new Date(), mins=now.getHours()*60+now.getMinutes();
  pages.forEach(page=>{
   const cards=[...page.querySelectorAll('.prayer')];
   const times=cards.map(c=>toMinutes(c.querySelector('.ptime')?.textContent));
   if(!cards.length) return;
   let idx=times.findIndex(t=>mins<t);
   if(idx<0) idx=times.length-1;
   cards.forEach((c,i)=>c.classList.toggle('active',i===idx));
   if(page.dataset.day==='0' && idx!==lastActiveIndex){
    const active=cards[idx];
    if(active) active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
    lastActiveIndex=idx;
   }
  });
 }
 update();
 // Dakikadaki değişimi kaçırmamak için telefon saatini her saniye kontrol eder.
 setInterval(update,1000);
}
let currentDay=0;
let todayIndex=0;
function localISO(){
 const d=new Date();
 const y=d.getFullYear();
 const m=String(d.getMonth()+1).padStart(2,'0');
 const day=String(d.getDate()).padStart(2,'0');
 return `${y}-${m}-${day}`;
}
function findTodayIndex(){
 const iso=localISO();
 const idx=calendarData.findIndex(d=>d.iso===iso);
 return idx>=0?idx:0;
}
function updateTodayBack(){
 document.querySelectorAll('.todayBackBtn').forEach((btn,i)=>btn.classList.toggle('show',currentDay!==todayIndex));
}
function setDay(day, animate=true){
 currentDay=Math.max(0,Math.min(calendarData.length-1,day));
 const track=document.getElementById('dayTrack');
 track.style.transition=animate?'transform .32s ease':'none';
 track.style.transform=`translateX(-${currentDay*(100/calendarData.length)}%)`;
 document.querySelectorAll('.dayContentPage').forEach(p=>p.style.display=(Number(p.dataset.contentDay)===currentDay?'block':'none'));
 updateTodayBack();
}
function goToday(){
 todayIndex=findTodayIndex();
 setDay(todayIndex,true);
 window.scrollTo({top:0,behavior:'smooth'});
}
(function setupDaySwipe(){
 const app=document.querySelector('.app');let sx=0,sy=0;
 app.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});
 app.addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)){
   if(e.target.closest('.prayers')) return;
   // Sağa doğru değil, ekranda sağdan sola kaydırma (swipe left) bir sonraki güne götürür.
   if(dx<0)setDay(currentDay+1);else setDay(currentDay-1);
  }
 },{passive:true});
})();
(function setupMidnightAutoAdvance(){
 todayIndex=findTodayIndex();
 setDay(todayIndex,false);
 let lastISO=localISO();
 setInterval(()=>{
   const iso=localISO();
   if(iso!==lastISO){
     lastISO=iso;
     const idx=calendarData.findIndex(d=>d.iso===iso);
     if(idx>=0){ todayIndex=idx; setDay(idx,true); }
     else { todayIndex=findTodayIndex(); updateTodayBack(); }
   }
 },1000);
})();
setupPrayerTracker(); updateFavCount();

function shareSection(event,btn){
 event.preventDefault(); event.stopPropagation();
 const root=btn.closest('.accordion,.story');
 if(!root) return;
 const title=root.querySelector('.storyTitle')?.textContent?.trim() || 'Hadith';
 const text=root.innerText.replace(/\s+/g,' ').trim();
 const data={title:'Fazilet Takvimi • '+title,text:text,url:location.href};
 if(navigator.share){ navigator.share(data).catch(()=>{}); }
 else if(navigator.clipboard){ navigator.clipboard.writeText(text+'\n'+location.href).then(()=>{btn.setAttribute('aria-label','Copiado');setTimeout(()=>btn.setAttribute('aria-label','Compartilhar esta seção'),1200)}).catch(()=>{}); }
}
</script>
