1:{title:"Birinci paragraf",ar:"ختم خواجگان؛ طریقت علیه نقشبندیه‌نک ارکان عظیمه‌سندن اولوب جناب حقک امریله خضر علیه السلام طرفندن سر حلقه سلسله حضرات خواجگان خواجه عبدالخالق غجدوانی (قدس الله سره العزیز) حضرتلرینه تعلیم بیورلمش، خواجه مشار الیه طرفندن وضع و تأسیس قلنمش بر رکن رکین رککندر. بو طریقت جلیله‌ده خواجه عبدالخالق حضرتلرین زمان سعادتلرندن اعتباراً بو رکن قدسی مرعی الاجرا اولمش، آکا توسل و تمسک، اسباب وصولک اهم مهمی عد ایدیلْمشدِر.",pron:"Hatm-i Hâcegân, tarîkat-ı aliyye-i Nakşibendiyye’nin erkân-ı azîmesinden olup Cenâb-ı Hakk’ın emriyle Hızır aleyhisselâm tarafından ser-halka-i silsile hazerât-ı Hâcegân’dan Hâce Abdülhâlık Gucdevânî, kuddise sırruhû’l-azîz, hazretlerine ta‘lîm buyurulmuş, Hâce-i müşârün-ileyh tarafından vaz‘ ve te’sîs kılınmış bir rükn-i rekîndir. Bu tarîkat-ı celîlede Hâce Abdülhâlık hazretlerinin zaman-ı saâdetlerinden i‘tibâren bu rükn-i kudsî mer‘îü’l-icrâ olmuş, aka tevessül ve temessük, esbâb-ı vusûlün en mühimmi add edilmiştir.",exp:"Hatm-i Hâcegân’ın Nakşibendiyye tarikatının önemli esaslarından biri olduğu anlatılıyor. Metne göre Hızır aleyhisselâm bunu Hâce Abdülhâlık Gucdevânî hazretlerine öğretmiş ve Hâce-i müşârün-ileyh tarafından tarikatın bir esası olarak tesis edilmiştir. Ardından bu rüknün uygulanmasının ve ona tevessül ile temessük edilmesinin önemine işaret edilmektedir."},

function muhEscape(x){return String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function muhClean(t){return t.replace(/[؛،,.!?؟()\[\]{}]/g,'').trim()}
function muhTokenize(text,p){return text.split(/(\s+)/).map((t,i)=>{if(/^\s+$/.test(t))return t;const key=muhClean(t);const safe=muhEscape(t);if(!key)return safe;return '<span class="muhWord" data-mkey="'+muhEscape(key)+'" onclick="event.stopPropagation();selectMuhWord(this,'+p+')">'+safe+'</span>';}).join('')}
function selectMuhWord(el,p){
 const para=document.getElementById('muhPara'+p);
 if(para&&!para.classList.contains('open')){document.querySelectorAll('.muhPara.open').forEach(x=>x.classList.remove('open'));para.classList.add('open')}
 let box=document.getElementById('muhFloatingInfo');
 const wasSelected=el.classList.contains('selected');
 document.querySelectorAll('.muhWord.selected').forEach(x=>x.classList.remove('selected'));
 if(wasSelected){if(box)box.classList.remove('show');return}
 el.classList.add('selected');
 if(!box){box=document.createElement('div');box.id='muhFloatingInfo';box.className='muhFloatingInfo';document.body.appendChild(box)}
 const key=el.dataset.mkey||'';
 box.innerHTML='<div class="muhWordInfoAr">'+muhEscape(key)+'</div><div class="muhWordInfoLine"><b>Türkçe okunuşu:</b> '+muhEscape(muhWords[key]||key)+'</div><div class="muhWordInfoLine"><b>Anlamı ve kısa izahı:</b> '+muhEscape(muhExplain[key]||'Bu kelime metin içindeki anlamına göre değerlendirilir.')+'</div>';
 box.classList.add('show');
 const r=el.getBoundingClientRect();
 const margin=12, width=Math.min(330,window.innerWidth-margin*2);
 box.style.width=width+'px';
 let left=Math.max(margin,Math.min(window.innerWidth-width-margin,r.left+r.width/2-width/2));
 let top=r.bottom+8;
 if(top+box.offsetHeight>window.innerHeight-margin){top=Math.max(margin,r.top-box.offsetHeight-8)}
 box.style.left=left+'px';box.style.top=top+'px';
}
function toggleMuhPara(n){const el=document.getElementById('muhPara'+n);document.querySelectorAll('.muhPara.open').forEach(x=>{if(x!==el)x.classList.remove('open')});el.classList.toggle('open');el.querySelectorAll('.muhWord.selected').forEach(x=>x.classList.remove('selected'));const info=document.getElementById('muhFloatingInfo');if(info)info.classList.remove('show')}
function syncMuhArabicFont(){const root=document.documentElement;const candidates=['fazilet-arabic-font','selectedArabicFontFamily','arabicFontFamily','arabicFont'];let val='';for(const k of candidates){try{val=localStorage.getItem(k)||''}catch(e){}if(val)break}if(val)root.style.setProperty('--muh-ar-font','"'+val.replace(/"/g,'')+'"')}
function showKeywordInfo(key){const box=document.getElementById('muhKeywordInfo');if(!box)return;box.innerHTML='<div class="muhKeywordInfoAr">'+muhEscape(key)+'</div><div class="muhKeywordInfoLine"><b>Türkçe okunuşu:</b> '+muhEscape(muhWords[key]||key)+'</div><div class="muhKeywordInfoLine"><b>Kısa izahı:</b> '+muhEscape(muhExplain[key]||'')+'</div>';box.classList.add('show');box.scrollIntoView({behavior:'smooth',block:'nearest'})}
function renderMuhimme(){const list=document.getElementById('muhParaList');if(!list)return;list.innerHTML=Object.keys(muhData).map(n=>{const d=muhData[n];return '<article class="muhPara" id="muhPara'+n+'"><div class="muhParaHead" onclick="toggleMuhPara('+n+')"><div class="muhParaOttoman">'+muhTokenize(d.ar,n)+'</div><span class="muhParaArrow"></span></div><div class="muhParaBody"><div class="muhPron">'+muhEscape(d.pron)+'</div><div class="muhExp">'+muhEscape(d.exp)+'</div></div></article>'}).join('')}
function openMuhimme(){closeMenu();document.getElementById('favorites').classList.remove('show');document.getElementById('muhimmePage').classList.add('show');document.documentElement.scrollTop=0;document.body.scrollTop=0;document.getElementById('dayContent').style.display='none';document.getElementById('homeLearningSection').style.display='none';syncMuhArabicFont();
renderMuhimme();window.scrollTo({top:0,behavior:'smooth'})}
function closeMuhimme(){document.getElementById('muhimmePage').classList.remove('show');document.getElementById('dayContent').style.display='block';document.getElementById('homeLearningSection').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}

    storyTitle:'HAYME ANA’NIN GAYRETİ',
    storyPt:'<div class="sentencePair"><div class="ptSentence"><span class="term tap c1" data-key="Hayme Ana">Hayme Ana</span> era uma senhora turcomena (Yörük) pertencente ao ramo Bozok dos Oğuzes, ao clã Kayı, dos descendentes de Gün Han, e seu nome verdadeiro era Fátima. Ela era a mãe de Ertuğrul Gazi e a avó de Osman Gazi, fundador do Estado Otomano.</div><div class="trSentence"><b>Türkçe anlamı:</b> Hayme Ana, Oğuzların Bozok kolunun Kayı Boyu’na mensup bir Türkmen hanımı olup asıl ismi Fâtıma’dır. Ertuğrul Gazi’nin annesi, Osmanlı Devleti’nin kurucusu Osman Gazi’nin ninesidir.</div></div>\n<div class="sentencePair"><div class="ptSentence">Ela era chamada de “Hayme Ana”, expressão que significa “mãe da tenda” ou “anciã da tenda”.</div><div class="trSentence"><b>Türkçe anlamı:</b> Ona, “Çadır anası, çadır büyüğü” manasına gelen “Hayme Ana” derlermiş.</div></div>\n<div class="sentencePair"><div class="ptSentence">O nome da região de Haymana, na Anatólia Central, vem dessa denominação.</div><div class="trSentence"><b>Türkçe anlamı:</b> İç Anadolu’daki Haymana yöresinin ismi buradan gelmektedir.</div></div>\n<div class="sentencePair"><div class="ptSentence">Embora seu local e sua data de nascimento não sejam conhecidos com precisão, Hayme Ana também era chamada de “Devlet Ana”, isto é, “Mãe do Estado”.</div><div class="trSentence"><b>Türkçe anlamı:</b> Doğum yeri ve tarihi tam olarak bilinmeyen Hayme Ana’ya “Devlet Ana” da derlermiş.</div></div>\n<div class="sentencePair"><div class="ptSentence">Hayme Ana vivia na aldeia de Çarşamba, em Domaniç.</div><div class="trSentence"><b>Türkçe anlamı:</b> Hayme Ana, Domaniç’in Çarşamba köyünde otururmuş.</div></div>\n<div class="sentencePair"><div class="ptSentence">Desde então, para os nômades Yörük das aldeias de Demirli, Erikli, Toraman e Fındıcak, o lugar onde Hayme Ana montava sua tenda passou a ser considerado o centro das pastagens de verão.</div><div class="trSentence"><b>Türkçe anlamı:</b> O zamandan beri de Demirli, Erikli, Toraman ve Fındıcak Köyleri yörükleri için Hayme Ana’nın çadır kurduğu yer, yayla için merkez kabul edilmiş.</div></div>\n<div class="sentencePair"><div class="ptSentence">Conta-se que Süleyman Şah, pai de Ertuğrul Gazi, caiu do cavalo e morreu como mártir durante uma expedição.</div><div class="trSentence"><b>Türkçe anlamı:</b> Şöyle anlatılır: Ertuğrul Gazi’nin babası Süleyman Şah, seferdeyken atından düşüp şehit olmuştur.</div></div>\n<div class="sentencePair"><div class="ptSentence">Antes de partir, deixou à sua esposa, Hayme Ana, alguns <span class="term tap c2" data-key="emanetler">bens confiados</span> para que ela os preservasse.</div><div class="trSentence"><b>Türkçe anlamı:</b> Refîkası Hayme Ana’ya, muhafaza etmesi için emanetler bırakmıştır.</div></div>\n<div class="sentencePair"><div class="ptSentence">Entre esses legados estavam o Alcorão Sagrado, o estandarte e seu filho, Hazretleri Ertuğrul Gazi.</div><div class="trSentence"><b>Türkçe anlamı:</b> Kur’ân‑ı Kerîm, sancak ve oğlu Ertuğrul Gazi Hazretlerini emanet olarak bırakmıştır.</div></div>\n<div class="sentencePair"><div class="ptSentence">Süleyman Şah lhe disse: “Você protegerá estas coisas e continuará esta expedição e esta luta.”</div><div class="trSentence"><b>Türkçe anlamı:</b> Süleyman Şah ona, “Bunları muhafaza edecek ve bu sefere, bu mücadeleye devam edeceksin.” demiştir.</div></div>\n<div class="sentencePair"><div class="ptSentence">Ao estabelecer-se na Anatólia, em Söğüt e Domaniç, ela deu continuidade a esse estandarte e a essa missão.</div><div class="trSentence"><b>Türkçe anlamı:</b> Anadolu’ya, Söğüt’e, Domaniç’e yerleşmek husûsunda bu sancağı devam ettirmiştir.</div></div>\n<div class="sentencePair"><div class="ptSentence">Ela criou esses filhos e cumpriu sua responsabilidade espiritual para com as gerações que serviriam ao Alcorão Sagrado.</div><div class="trSentence"><b>Türkçe anlamı:</b> Bu evlatları yetiştirmiş, Kur’ân‑ı Kerîm’e hizmet edecek olan nesillere karşı, bu manevî vazifeyi yerine getirmiştir.</div></div>\n<div class="sentencePair"><div class="ptSentence">Preservar os <span class="term tap c3" data-key="emanet">depósitos confiados</span> e cuidar deles... Por meio do esforço de uma mulher, Hayme Ana, e de sua proteção desses legados, que grande bênção Allah, o Altíssimo, concedeu à sua descendência!</div><div class="trSentence"><b>Türkçe anlamı:</b> Emanetleri muhafaza etmek ve sahip çıkmak… Bir hanımın, Hayme Ana’nın bu gayreti ve onları muhafaza etmesiyle Cenâb‑ı Hak, nasıl büyük bir nimet nasip ediyor, onun nesline!</div></div>\n<div class="sentencePair"><div class="ptSentence">Novamente, durante uma estação de pastagem de verão, Hayme Ana alcançou a misericórdia de Allah, o Altíssimo, e foi sepultada no alto de uma colina.</div><div class="trSentence"><b>Türkçe anlamı:</b> Yine bir yayla mevsiminde Hayme Ana, Cenâb‑ı Hakk’ın rahmetine ermiş, tepenin üstüne defnedilmiştir.</div></div>\n<div class="sentencePair"><div class="ptSentence">No ano hijri de 1302 (1886 d.C.), o Sultão Abdülhamîd Khan II, como sinal de seu respeito por seus antepassados, enviou cuidadosamente uma comissão para localizar o túmulo de sua bisavó Hayme Ana e mandou construir sobre ele um mausoléu.</div><div class="trSentence"><b>Türkçe anlamı:</b> Hicrî 1302 (M. 1886)’de Sultan İkinci Abdülhamîd Han, ecdâdına hürmetinin nişânesi olarak büyük itina ile bir heyet gönderip büyük ninesi Hayme Ana’nın kabrini buldurmuş ve üzerine bir türbe yaptırmış.</div></div>\n<div class="sentencePair"><div class="ptSentence">Mandou cobrir suas janelas com cortinas de seda atlas e revestiu o chão com um magnífico tapete tecido em Hereke.</div><div class="trSentence"><b>Türkçe anlamı:</b> Pencerelerini, atlas perdelerle kaplattırıp, zeminini de Hereke dokuması muhteşem bir halı ile döşetmiştir.</div></div>',
    storyTr:'<p><span class="term tap c1" data-key="Hayme Ana TR">Hayme Ana</span>, Oğuzların Bozok kolunun (Gün Han oğullarından) Kayı Boyu’na mensup bir Türkmen (Yörük) hanımı olup asıl ismi Fâtıma’dır. Ertuğrul Gazi’nin annesi, Osmanlı Devleti’nin kurucusu Osman Gazi’nin ninesidir.</p>\n<p>Ona, “Çadır anası, çadır büyüğü” manasına gelen “Hayme Ana” derlermiş. İç Anadolu’daki Haymana yöresinin ismi buradan gelmektedir. Doğum yeri ve tarihi tam olarak bilinmeyen Hayme Ana’ya “Devlet Ana” da derlermiş. Hayme Ana, Domaniç’in Çarşamba köyünde otururmuş. O zamandan beri de Demirli, Erikli, Toraman ve Fındıcak Köyleri yörükleri için Hayme Ana’nın çadır kurduğu yer, yayla için merkez kabul edilmiş.</p>\n<p>Şöyle anlatılır: Ertuğrul Gazi’nin babası Süleyman Şah, seferdeyken atından düşüp şehit olmuştur. Refîkası Hayme Ana’ya, muhafaza etmesi için emanetler bırakmıştır. Kur’ân‑ı Kerîm, sancak ve oğlu Ertuğrul Gazi Hazretlerini emanet olarak bırakmıştır. Süleyman Şah ona, “Bunları muhafaza edecek ve bu sefere, bu mücadeleye devam edeceksin.” demiştir. Anadolu’ya, Söğüt’e, Domaniç’e yerleşmek husûsunda bu sancağı devam ettirmiştir. Bu evlatları yetiştirmiş, Kur’ân‑ı Kerîm’e hizmet edecek olan nesillere karşı, bu manevî vazifeyi yerine getirmiştir. Emanetleri muhafaza etmek ve sahip çıkmak… Bir hanımın, Hayme Ana’nın bu gayreti ve onları muhafaza etmesiyle Cenâb‑ı Hak, nasıl büyük bir nimet nasip ediyor, onun nesline!</p>\n<p>Yine bir yayla mevsiminde Hayme Ana, Cenâb‑ı Hakk’ın rahmetine ermiş, tepenin üstüne defnedilmiştir.</p>\n<p>Hicrî 1302 (M. 1886)’de Sultan İkinci Abdülhamîd Han, ecdâdına hürmetinin nişânesi olarak büyük itina ile bir heyet gönderip büyük ninesi Hayme Ana’nın kabrini buldurmuş ve üzerine bir türbe yaptırmış. Pencerelerini, atlas perdelerle kaplattırıp, zeminini de Hereke dokuması muhteşem bir halı ile döşetmiştir.</p>'
  },

    ],
    hadithArabic:'قَالَ النَّبِيُّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: لَا تَجْلِسُوا عِنْدَ كُلِّ عَالِمٍ إِلَّا عَالِمًا يَدْعُوكُمْ مِنَ الْخَمْسِ إِلَى الْخَمْسِ: مِنَ الشَّكِّ إِلَى الْيَقِينِ وَمِنَ الْكِبْرِ إِلَى التَّوَاضُعِ وَمِنَ الْعَدَاوَةِ إِلَى النَّصِيحَةِ وَمِنَ الرِّيَاءِ إِلَى الْإِخْلَاصِ وَمِنَ الرَّغْبَةِ إِلَى الزُّهْدِ. (كر)',
    hadithPt:'<div class="sentencePair"><div class="ptSentence">O <span class="term tap c1" data-key="Profeta">Profeta</span> (s.a.v.) disse: “Não se sentem na companhia de todo <span class="term tap c2" data-key="sábio">sábio</span>, mas somente daquele que vos convida de cinco coisas para cinco: da <span class="term tap c3" data-key="dúvida">dúvida</span> para a <span class="term tap c1" data-key="certeza">certeza</span>, da <span class="term tap c2" data-key="arrogância">arrogância</span> para a <span class="term tap c3" data-key="humildade">humildade</span>, da inimizade para o <span class="term tap c1" data-key="conselho sincero">conselho sincero</span>, da ostentação para a <span class="term tap c2" data-key="sinceridade">sinceridade</span> e do desejo pelo mundo para o <span class="term tap c3" data-key="desprendimento">desprendimento</span>.”</div><div class="trSentence"><b>Türkçe anlamı:</b> Peygamber Efendimiz (s.a.v.) buyurdular: “Her âlimin sohbetinde bulunmayınız. Ancak sizi beş şeyden beş şeye davet eden âlimlerin sohbetinde bulununuz: şekten yakîne, kibirden tevâzuya, düşmanlıktan dostluğa, riyâdan ihlâsa ve dünyaya rağbetten zühde.”</div></div>',
    hadithTr:'<span class="term tap c1" data-key="Peygamber Efendimiz">Peygamber Efendimiz</span> (s.a.v.) buyurdular: “Her <span class="term tap c2" data-key="âlim">âlimin</span> sohbetinde bulunmayınız. Ancak sizi beş şeyden beş şeye davet eden âlimlerin sohbetinde bulununuz; <span class="term tap c3" data-key="şek">şekten</span> <span class="term tap c1" data-key="yakîn">yakîne</span> (tereddütten, görür gibi inanmaya), <span class="term tap c2" data-key="kibir">kibirden</span> <span class="term tap c3" data-key="tevazu">tevâzuya</span>, düşmanlıktan dostluğa, riyâdan ihlâsa, (dünyaya) rağbetten zühde (dünya sevgisini kalbe koymamaya).”',
    source:'(Târîh-i Dımaşk)',
    storyTitle:'PALAVRAS SÁBIAS',
    storyPt:'<div class="sentencePair"><div class="ptSentence">As pessoas mais valiosas são aquelas que servem de meio para <span class="term tap c1" data-key="elevar">elevar</span> e renovar o Islã.</div><div class="trSentence"><b>Türkçe anlamı:</b> İnsanların en kıymetlileri, İslâm’ın yüceltilmesine ve yenilenmesine vesile olan kimselerdir.</div></div><div class="sentencePair"><div class="ptSentence">Allah, o Altíssimo, faz com que a nossa religião seja promovida por meio do nosso Profeta (s.a.v.), dos amigos de Allah e dos renovadores.</div><div class="trSentence"><b>Türkçe anlamı:</b> Cenâb-ı Hak dinimizi Peygamberimiz (s.a.v.), evliyâullah ve müceddidler vasıtasıyla yüceltmektedir.</div></div><div class="sentencePair"><div class="ptSentence">Por isso, promover os conhecimentos religiosos é uma das maiores virtudes.</div><div class="trSentence"><b>Türkçe anlamı:</b> Bu sebeple dinî ilimlerin yayılması ve yüceltilmesi en büyük kıymetlerden biridir.</div></div><div class="sentencePair"><div class="ptSentence">Ser motivo para a promoção e a revitalização de uma única regra da Sharî‘a já é uma grande virtude.</div><div class="trSentence"><b>Türkçe anlamı:</b> Sadece bir şer‘î hükmün yayılmasına ve ihyasına vesile olmak bile büyük bir kıymettir.</div></div><div class="sentencePair"><div class="ptSentence">Por isso, é necessário ter plena fidelidade e seguir de perto os mujtahids e os profetas.</div><div class="trSentence"><b>Türkçe anlamı:</b> Bunun için müctehidlere ve peygamberlere tam bağlı olmak ve onları örnek almak gerekir.</div></div><div class="sentencePair"><div class="ptSentence">Há uma diferença entre o <span class="term tap c2" data-key="sábio">sábio</span> e o <span class="term tap c3" data-key="devoto">devoto</span>.</div><div class="trSentence"><b>Türkçe anlamı:</b> Âlim ile âbid arasında fark vardır.</div></div><div class="sentencePair"><div class="ptSentence">O sábio que também é devoto e pratica aquilo que sabe é uma pessoa de grande valor.</div><div class="trSentence"><b>Türkçe anlamı:</b> Âlim ve aynı zamanda âbid olan, ilmiyle amel eden insanlar çok kıymetlidir.</div></div><div class="sentencePair"><div class="ptSentence">A diferença entre o sábio e o devoto é tão grande quanto a diferença entre a lua e as estrelas.</div><div class="trSentence"><b>Türkçe anlamı:</b> Âlim ile âbid arasındaki fark, ay ile yıldızlar arasındaki fark kadar büyüktür.</div></div><div class="sentencePair"><div class="ptSentence">A missão profética existe para a continuidade e transmissão do conhecimento.</div><div class="trSentence"><b>Türkçe anlamı:</b> Peygamberlik vazifesi ilmin devamı ve aktarılması içindir.</div></div><div class="sentencePair"><div class="ptSentence">Que Allah, o Altíssimo, nos conceda aprender e ensinar o verdadeiro conhecimento.</div><div class="trSentence"><b>Türkçe anlamı:</b> Cenâb-ı Hak bizlere hakikî ilmi öğrenip öğretmeyi nasip eylesin.</div></div><div class="sentencePair"><div class="ptSentence">Em <em>İhyâü Ulûmi’d-dîn</em> afirma-se: “O conhecimento é a adoração do coração.”</div><div class="trSentence"><b>Türkçe anlamı:</b> İhyâü Ulûmi’d-dîn’de “İlim, kalbin ibadetidir.” denilmektedir.</div></div><div class="sentencePair"><div class="ptSentence">Assim como há purificação e limpeza antes da oração, o coração também precisa ser purificado.</div><div class="trSentence"><b>Türkçe anlamı:</b> Namazdan önce temizlik gerektiği gibi kalbin de temizlenmesi gerekir.</div></div><div class="sentencePair"><div class="ptSentence">A alma que ordena o mal deve ser libertada dos maus hábitos e da má moral, para que seja possível beneficiar-se do conhecimento.</div><div class="trSentence"><b>Türkçe anlamı:</b> Nefs-i emmârenin kötü alışkanlık ve ahlâklardan kurtulması gerekir ki ilimden istifade edilebilsin.</div></div><div class="sentencePair"><div class="ptSentence">A construção e o florescimento do coração acontecem por meio do <span class="term tap c1" data-key="conhecimento">conhecimento</span> espiritual.</div><div class="trSentence"><b>Türkçe anlamı:</b> Kalbin imarı ve güzelleşmesi mânevî ilim ile olur.</div></div><div class="sentencePair"><div class="ptSentence">Primeiro o coração será lavado com ele e, depois, será adornado.</div><div class="trSentence"><b>Türkçe anlamı:</b> Kalp önce onunla temizlenecek, sonra süslenecektir.</div></div><div class="sentencePair"><div class="ptSentence">Uma pessoa sem <span class="term tap c2" data-key="espiritualidade">espiritualidade</span> é como uma ave congelada.</div><div class="trSentence"><b>Türkçe anlamı:</b> Mâneviyatsız bir kişi dondurulmuş bir kuş gibidir.</div></div><div class="sentencePair"><div class="ptSentence">Quando se olha para essa ave, não há nenhuma diferença entre ela e as outras aves, mas dentro dela não há espírito.</div><div class="trSentence"><b>Türkçe anlamı:</b> O kuşa bakıldığında diğer kuşlardan farkı yoktur, fakat içinde ruh yoktur.</div></div><div class="sentencePair"><div class="ptSentence">Assim como essa ave não pode beneficiar a si mesma nem aos outros, uma pessoa sem espiritualidade também não pode beneficiar a si mesma nem aos outros.</div><div class="trSentence"><b>Türkçe anlamı:</b> Bu kuşun kendisine ve başkasına faydası olmadığı gibi, mâneviyatsız insanın da kendisine ve başkasına faydası yoktur.</div></div>',
    storyTr:'<p>• İnsanların en kıymetlisi, en değerlisi, İslâm’ın tervîcine (yüceltilmesine) ve onun tecdîdine (ihyâsına) vesile olan insanlardır. Cenâb‑ı Hak, Peygamberimiz (s.a.v.) ile, evliyâullah ile, müceddid ile dinimizi tervîc ediyor. Onun için dînî ilimlerin tervîci, en büyük kıymettir. Sadece bir şer’î hükmün tervîcine, ihyasına sebep olmak bile, en büyük kıymettir. Onun için bu müctehidlere, peygamberlere tam bağlılık, tam benzemek lâzımdır.</p><p>• <span class="term tap c2" data-key="Âlim">Âlimle</span> <span class="term tap c3" data-key="âbid">âbid</span> arasında fark var. Âlim ve aynı zamanda âbid olan, ilmiyle âmil olan insanlar çok kıymetlidir. İşte ilmiyle âbid olan insanın kıymetini anlatabilmek için âbidle kıyas edilmiş. Âlim ile âbid arasındaki fark, ay ile yıldızlar arasındaki fark kadar büyük veyahut Resûlullah Efendimiz (s.a.v.) kendisini misal buyurarak “Sizin ednânızdan birisi üzerine fazlım gibi” buyurmuşlar. Peygamberlik vazifesi zaten ilmin devamı içindir. O hakiki ilmi öğrenip öğretebilmeyi Cenâb‑ı Hak nasip eylesin. Âlimin kaleminin mürekkebi ile şehidin kanı tartılmış, âlimin ilminin mürekkebi daha kıymetli gelmiştir.</p><p>• İhyâü Ulûmi’d-dîn’de; ilim, kalbin ibadetidir, deniliyor. Nasıl ki namazdan önce yapılacak taharet ve temizlik varsa, nasıl ki namaz, âzâlarla yapılan ibadetse; ama namazın aslı manevî bir ibadetse ve de âzâlar vasıtasıyla yapıldığı için âzâların temizliği önemliyse, âzâların temizliği olmadan, abdest, tahâret olmadan namaz sahih olmuyorsa, ilim ve ibadet de böyledir. Önce âzâların ve cevârihin temizlenmesi lâzım. Bunun gibi, kalbin de kötü vasıflardan temizlenmesi lâzım, nefs‑i emmârenin kötü vasıflardan, kötü ahlâklardan kurtulması lâzım ki ilimden istifade edilebilsin.</p><p>• Kalbin imarı, imareti, <span class="term tap c1" data-key="ilim">ilim</span> ile olur; ama hangi ilimle olur? Manevî ilimle olur. Kalp önce onunla yıkanacak, ondan sonra tezyînât olacak.</p><p>• Mâneviyatsız bir kişi, dondurulmuş kuşa benzer. O kuşa gidersiniz, bakarsınız, diğer kuşlardan hiçbir farkı yoktur. Ama içinde ruh yoktur. Bu kuşun, kendisine faydası olmadığı gibi başkasına da faydası yoktur. İşte maneviyatsız kişi, bu kuşa benzer.</p>'

    storyTr:'<p>Her mümin, insanlar arasında buğz ve düşmanlığa sebep olan fikirlerden ve sözlerden uzak durmalı, din kardeşleri arasında birliği dağıtacak hareketlerden sakınmalıdır. İnsanların arasını bozmaya çalışanların sözlerine de itibar etmemelidir.</p><p>Huzeyfe bin Yemân radıyallâhü anh Hazretlerine, çok nemîme yapan (laf taşıyan) birisinden bahsedildiğinde şöyle buyurdular: Resûlullâh Efendimiz sallallâhü aleyhi ve sellem’in şöyle buyurduklarını işittim: “Nemîme yapan, Cennet’e giremez.”</p><p>Dâvûd aleyhisselâm, oğlu Süleymân aleyhisselâm’a şöyle buyurmuştur: “Oğlum, nemîmeden (insanlar arasında laf taşımaktan) son derece sakın! Zira nemîme, insana, kılıçtan daha fazla zarar verir.”</p><p>Tabiîn’den Amr bin Meymûn (rah.) şöyle anlattı: Mûsâ aleyhisselâm, Allâhü Teâlâ’ya münâcât için Tûr Dağı’na gittiği bir vakitte, Arş-ı A’lâ’nın altında bir kimse gördü. Onun yüce makamına gıpta etti. Rabb’inden, onun kim olduğunu suâl etti, Hak Teâlâ, “Onun amellerinden üç hasleti sana bildireyim: O, Allâh’ın ihsân ettiği nimetlerinden dolayı hiçbir kimseye haset etmezdi. Ana babasına âsî gelmezdi ve insanlar arasında aslâ laf taşımazdı.” buyurdu.</p><p>Naklolunduğuna göre, laf taşıyan birisi, Basra valisine gelerek “Abdullah bin Hemmâm (rah.), senin aleyhinde konuşuyor” dedi. Vali, Abdullâh’ı getirtti. O, laf taşıyanı da onu duyacağı başka bir odaya gizledi. Abdullah’a, “Sen, beni hicvediyor, aleyhimde kötü konuşuyormuşsun!” dedi, o ise “Aslâ! Allâh iyiliğinizi versin! Siz, hakkında böyle şeyler konuşulacak bir kimse değilsiniz.” dedi. Gizlediği adamı oraya getirtip “Bu adam, senin böyle yaptığını söylüyor” dedi, Abdullah ise şu cevabı verdi: “Bu adamın hâli, şu iki şeyden birisidir: Ya bilmediği bir şeyi konuştuğundan yalan söylemiş olur; yahut insanların arasını bozmak için nemîme yapmış olur. Artık bu iki vasfa sahip bir kimsenin sözüne ne kadar itibar olunur!”</p><p>Vali, bu sözü çok beğendi ve daha sonra o nemîmeci adamı azarlayarak yanından kovdu. (Devamı var)</p>'

    storyTr:'<p>Aklı ve imanı kâmil olan kimse, laf taşıyan kimsenin kelâmına itibar etmemelidir. Karar verme husûsunda acele ile değil, aklı ile hareket etmeli, kalbine ve diline sahip olmalıdır. Bilmelidir ki sana laf taşıyan, senden de başkasına söz taşıyacaktır.</p><p>Tâbiîn’den Yahyâ bin Ebû Kesîr (rah.) demiştir ki: Nemîme yapanın bir saatte yaptığı işi, sihirbaz bir ayda yapamaz.</p><p>Bir kadın, oğluna şöyle nasihat ediyordu: “Oğlum, sırları iyi sakla. Aslâ laf taşıma! Zira nemîme, her türlü dostluğu bitirir, her türlü iyiliği de kıymetsiz hâle getirir.”</p><p>Yine Tâbiîn’den Hammâd bin Seleme (rah.) şöyle anlatmıştır: Bir kimse bir köle satın almak istedi, satan kimse, “Bu, nemîme yapar, insanları birbirine düşürür, ona dikkat et” dedi, buna rağmen adam, köleyi satın aldı. Bir gün, bu köle, sahibinin hanımına giderek, “Kocan seni sevmiyor, seni boşayıp başkasıyla evlenecek. Dilersen sana, onun muhabbetini kendine bağlayacağın bir yol göstereyim” dedi. Kadın, “Tamam” deyince, köle “Kocanın sakalının alt tarafından biraz tıraş ediver, seni sevecektir” dedi.</p><p>Sonra efendisine giderek, “Karın sana hıyanet ediyor, seni öldürmek istiyor. Bu sözümün hakikat olduğunu anlamak istersen gece uyuyormuş gibi yap, görürsün.” dedi. Gece, karısı, kölenin dediği gibi sakalından biraz tıraş etmek için elinde usturayla yaklaşınca, kocası, onu tutup öldürdü. Kadının akrabaları da o adamı öldürdüler.</p><p>İşte bu ve benzeri hâller, nemîmenin kötü eseridir. Nemîme ile mahrem hâller ortaya dökülür, sırlar ifşâ olur, maddeten ve mânen sıkıntılar yüz gösterir, dostluk ve muhabbet silinir, düşmanlık alevlenir. Cemiyetlerde birlik ve beraberlik duyguları kaybolarak tefrikaya sebep olur. Bu sebeple bir kimseden, kendisine bir söz ulaşan kişi, insafı elden bırakmamalı, kardeşini güzelce ikaz etmeli; özür dilerse özrünü kabul etmelidir.</p>'

    storyTr:'<p>Resûlullah Efendimiz (s.a.v.), Hazret-i Ebûbekir (r.a.) ile hicret için Mekke-i Mükerreme’den yola çıktıklarında müşrikler de arkalarından onları aramaya çıkmışlardı. İz sürmede mâhir olan Sürâka bin Mâlik de onları bulmuş ve yollarını kesmişti. Hz. Ebûbekir radıyallâhü anh, Resûlullah sallallâhü aleyhi ve sellem’e bir zarar gelir diye, son derece korku içindeydi. Sürâka’yı görünce ağladı ve “Yâ Resûlallâh! Kâfirler geldi, bizi yakaladılar!” buyurdu. Resûlullah (s.a.v.), “Yâ Ebâ Bekir! Üzülme. Muhakkak Allah, bizimle beraberdir. Kâfirler, bize bir zarar veremez!” buyurarak dua etti.</p><p>Sürâka, atının üzerindeydi ve iyice yaklaşmıştı ki, Sürâka’nın atının ayakları, kuma batıp tutulup kaldı. Bu hâli müşâhede eden Sürâka, “Anladım, benim aleyhimde dua ettiniz. Ama lütuf ve kerem edip bana emân verin, dua edip atımı kurtarın. Vallahi benden zarar görmezsiniz. Diğer kâfirleri de sizden uzaklaştırırım.” dedi.</p><p>Resûlullah (s.a.v.) Efendimizin duasıyla atı kumdan kurtulan Sürâka, kâfirlerin maksatlarının ne olduğunu haber verdi. Oradan döndüğünde de kafirleri başka tarafa sevk edip sözünü tuttu.</p><p>Kısa bir müddet sonra Sürâka, iman ederek Müslüman oldu. Resûlullah (s.a.v.), Sürâka radıyallâhü anh’e İran’ın fethedileceğini, onun da Kisrâ’nın tacını giyeceğini müjdeleyerek “Ey Sürâka, Kisrâ’nın ziynetlerini taktığın zaman, kim bilir nasıl keyiflenirsin?” buyurmuşlardı.</p><p>Hazret-i Ömer’in (r.a.) hilafeti devrinde, İran fethedilip Kisrâ’nın bilezikleri, mücevherleri ve tacı Medine’ye getirildi. Hz. Ömer (r.a.), Sürâka radıyallâhü anh’i çağırtıp bunları ona giydirdi ve ellerini kaldırıp “Allâhü Teâlâ’ya hamdolsun ki Kisrâ bin Hürmüz’den bu ziynetleri aldı da bedevî bir Arap olan Sürâka’ya nasip etti.” buyurdu.</p><p>Sürâka (r.a.), Hicret’in 24. senesinde Hazret-i Osman radıyallâhü anh’in hilâfeti devrinde vefat etmiştir.</p>'

function prayerHTML(d){return d.prayers.map(p=>`<div class="prayer"><div class="pname">${p[0]}</div><div class="ptime">${p[1]}</div></div>`).join('')}
function dayPageHTML(d,i){return `<div class="dayPage" data-day="${i}"><div class="header"><div class="date"><div class="day">${d.date}</div><div><div class="month">${d.month}</div><div class="week">${d.week}</div></div></div><div class="hijri">${d.hijri}<br>Calendário Fazilet</div><button class="menuBtn" onclick="openMenu()" aria-label="Menu"><span>☰</span></button></div><div class="ornament"><button class="todayBackBtn" id="todayBack${i}" onclick="goToday()" aria-label="Voltar para hoje"><span>‹</span></button></div><div class="prayers">${prayerHTML(d)}</div></div>`}
function hadithHTML(d,i){return `<section class="section"><div class="accordion hadithAccordion" id="hadithAccordion${i}"><button class="shareBtn" onclick="shareSection(event,this)" aria-label="Compartilhar esta seção" title="Compartilhar">${shareIcon()}</button><button class="hadithArabicHeader" onclick="toggleAccordion('hadithAccordion${i}')" aria-label="Abrir ou fechar o hadith"><span class="accArrow" aria-hidden="true"></span><div class="arabic hadithArabicPreview">${d.hadithArabic}</div></button><div class="accordionContent"><div class="hadithCard">${d.hadithPt?`<div class="lang"><div class="langTitle">Português</div><div class="studyLegend"><span class="l1">Dinî ifade</span><span class="l2">Önemli kelime</span><span class="l3">Yeni kelime</span></div><p>${d.hadithPt}</p></div>`:`<div class="lang"><div class="langTitle">Türkçe</div><p>${d.hadithTr}</p></div>`}<div class="inlineWord" id="wordPanel${i}"><span class="wordPopupArrow" aria-hidden="true"></span><div class="wordLabel">Palavra selecionada</div><div class="wordMeaning" id="wordMeaning${i}"></div><div class="pronunciationBox" id="pronunciationBox${i}"></div><div class="exampleBox" id="exampleBox${i}"></div><div class="bubbles"><button class="bubble s" onclick="speakCurrent()"><i>🔊</i>Pronúncia</button><button class="bubble e" onclick="showExample()"><i>✓</i>Exemplo</button><button class="bubble k" onclick="saveCurrent()"><i>🔖</i>Salvar</button></div></div><div class="source">${d.source}</div></div></div></div></section>`}
function storyHTML(d,i){return `<section class="section"><div class="story" id="story${i}"><button class="shareBtn" onclick="shareSection(event,this)" aria-label="Compartilhar esta seção" title="Compartilhar">${shareIcon()}</button><div class="storyHeader"><span class="storyTitle">${d.storyTitle}</span></div><div class="storyContent">${d.storyPt?`<div class="lang"><div class="langTitle">Português</div>${d.storyPt.startsWith('<p>')?d.storyPt:`<p>${d.storyPt}</p>`}</div>`:`<div class="lang"><div class="langTitle">Türkçe</div>${d.storyTr.startsWith('<p>')?d.storyTr:`<p>${d.storyTr}</p>`}</div>`}<div class="inlineWord storyWordPanel"><span class="wordPopupArrow" aria-hidden="true"></span><div class="wordLabel">Palavra selecionada</div><div class="wordMeaning"></div><div class="pronunciationBox"></div><div class="exampleBox"></div><div class="bubbles"><button class="bubble s" onclick="speakCurrent()"><i>🔊</i>Pronúncia</button><button class="bubble e" onclick="showExample()"><i>✓</i>Exemplo</button><button class="bubble k" onclick="saveCurrent()"><i>🔖</i>Salvar</button></div></div></div></div></section>`}
function renderCalendar(){
 const track=document.getElementById('dayTrack');
 track.innerHTML=calendarData.map(dayPageHTML).join('');
 track.style.width=(calendarData.length*100)+'%';

function escapeHTML(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function positionWordPanel(el,panel,root){
 const parent=panel.offsetParent || root;
 const er=el.getBoundingClientRect(), pr=parent.getBoundingClientRect();
 const pw=panel.offsetWidth, ph=panel.offsetHeight;
 let left=er.left-pr.left+parent.scrollLeft+er.width/2-pw/2;
 let top=er.top-pr.top+parent.scrollTop-ph-12;
 if(top<8) top=er.bottom-pr.top+parent.scrollTop+12;
 const maxLeft=Math.max(8,parent.clientWidth-pw-8);
 left=Math.max(8,Math.min(left,maxLeft));
 panel.style.left=left+'px';panel.style.top=top+'px';
 const arrow=panel.querySelector('.wordPopupArrow');
 if(arrow){
   const above=top < er.top-pr.top+parent.scrollTop;
   arrow.style.left=Math.max(14,Math.min(pw-24,er.left-pr.left+er.width/2-left-6))+'px';
   arrow.style.top=above?'-7px':'auto'; arrow.style.bottom=above?'auto':'-7px'; arrow.style.transform=above?'rotate(45deg)':'rotate(225deg)';
 }
}
function getWordData(key){

const translationCache=JSON.parse(localStorage.getItem('fazilet-translations')||'{}');
async function translatePTtoTR(word){
 const clean=String(word).trim(); if(!clean) return '';
 const cacheKey=clean.toLowerCase();
 if(translationCache[cacheKey]) return translationCache[cacheKey];
 try{
   const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(clean)+'&langpair=pt|tr';
   const res=await fetch(url,{headers:{'Accept':'application/json'}});
   const data=await res.json();
   const tr=data?.responseData?.translatedText?.trim();
   if(tr){translationCache[cacheKey]=tr;localStorage.setItem('fazilet-translations',JSON.stringify(translationCache));return tr;}
 }catch(e){}
 return 'Türkçe anlam bulunamadı';
}
function makeEveryPortugueseWordClickable(){
 const containers=document.querySelectorAll('.lang:not(.tr) .ptSentence, .lang:not(.tr) > p');
 containers.forEach(container=>{
   const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT);
   const nodes=[];let n;
   while(n=walker.nextNode()){
     if(n.parentElement?.closest('.term,.studyLegend,.inlineWord')) continue;
     if(/[A-Za-zÀ-ÖØ-öø-ÿ]/.test(n.nodeValue)) nodes.push(n);
   }
   nodes.forEach(node=>{
     const frag=document.createDocumentFragment();
     const parts=node.nodeValue.split(/([A-Za-zÀ-ÖØ-öø-ÿ]+(?:[-’'][A-Za-zÀ-ÖØ-öø-ÿ]+)*)/g);
     parts.forEach(part=>{
       if(/^[A-Za-zÀ-ÖØ-öø-ÿ]+(?:[-’'][A-Za-zÀ-ÖØ-öø-ÿ]+)*$/.test(part)){
         const span=document.createElement('span');span.className='term autoWord';span.dataset.key=part;span.textContent=part;
         span.addEventListener('click',e=>{e.stopPropagation();selectWord(span)});frag.appendChild(span);
       }else frag.appendChild(document.createTextNode(part));
     });
     node.parentNode.replaceChild(frag,node);
   });
 });
}

function getBestPortugueseVoice(){
 if(!('speechSynthesis' in window)) return null;
 const voices=speechSynthesis.getVoices(); if(!voices.length) return null;
 const pt=voices.filter(v=>/^pt(?:-BR)?(?:$|-)/i.test(v.lang)||/^pt_/i.test(v.lang)); if(!pt.length) return null;
 const score=v=>{const n=(v.name||'').toLowerCase(),lang=(v.lang||'').toLowerCase();let s=0;
   if(lang==='pt-br')s+=50;else if(lang.startsWith('pt-br'))s+=35;
   if(/fernanda|francisca|helena|bruna|camila|joana/i.test(n))s+=45;
   if(/enhanced|premium|natural|neural|high quality|qualidade/i.test(n))s+=30;
   if(v.localService===false)s+=8; return s;};
 return [...pt].sort((a,b)=>score(b)-score(a))[0]||pt[0];
}

function setupPrayerTracker(){
 const pages=[...document.querySelectorAll('.dayPage')];
 let lastCenteredIndex=-1;
 function toMinutes(v){const m=(v||'').match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):9999}
 function formatCountdown(ms){let s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
 function update(){
   const now=new Date(), total=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
   pages.forEach((page)=>{
     const cards=[...page.querySelectorAll('.prayer')]; if(!cards.length)return;
     const valid=cards.map((c,i)=>({c,i,name:c.querySelector('.pname')?.textContent.trim()||'',mins:toMinutes(c.querySelector('.ptime')?.textContent)}))
       .filter(x=>x.name!=='Hora da Qibla' && x.mins<9999);
     if(!valid.length)return;
     const next=valid.find(x=>total < x.mins);
     const nextItem=next||valid[0];
     const diffMs=next ? (next.mins-total)*60000 : ((24*60-total)+nextItem.mins)*60000;
     const dayIndex=Number(page.dataset.day);
     cards.forEach((c,i)=>c.classList.toggle('active',i===nextItem.i));
     const box=document.getElementById('nextPrayer'+dayIndex);
     if(box && dayIndex===todayIndex){box.innerHTML='Próxima oração: <b>'+escapeHTML(nextItem.name)+'</b> • '+formatCountdown(diffMs);}
     if(dayIndex===todayIndex && nextItem.i!==lastCenteredIndex){nextItem.c.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});lastCenteredIndex=nextItem.i;}
   });
 }
 update(); setInterval(update,1000);
}

 return `${y}-${m}-${day}`;

 currentDay=next;
 const track=document.getElementById('dayTrack');
 track.style.transition=animate?'transform .32s ease':'none';
 track.style.transform=`translateX(-${currentDay*(100/calendarData.length)}%)`;
 document.querySelectorAll('.dayContentPage').forEach(p=>p.style.display=(Number(p.dataset.contentDay)===currentDay?'block':'none'));
 document.querySelectorAll('.inlineWord.show').forEach(p=>p.classList.remove('show'));
 document.querySelectorAll('.term.selected').forEach(x=>x.classList.remove('selected'));
 updateTodayBack();
 if(changed && animate) window.scrollTo({top:0,behavior:'smooth'});
}
function goToday(){
 todayIndex=findTodayIndex();
 setDay(todayIndex,true);
 window.scrollTo({top:0,behavior:'smooth'});
}
(function setupDaySwipe(){
 const app=document.querySelector('.app');let sx=0,sy=0;
 app.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});
 app.addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)){
   if(e.target.closest('.prayers,.drawer,.inlineWord,button,a,input,textarea,select')) return;
   // Sağa doğru değil, ekranda sağdan sola kaydırma (swipe left) bir sonraki güne götürür.
   if(dx<0)setDay(currentDay+1);else setDay(currentDay-1);
  }
 },{passive:true});
})();
(function setupMidnightAutoAdvance(){
 todayIndex=findTodayIndex();
 setDay(todayIndex,false);
 let lastISO=localISO();
 setInterval(()=>{
   const iso=localISO();
   if(iso!==lastISO){
     lastISO=iso;
     const idx=calendarData.findIndex(d=>d.iso===iso);
     if(idx>=0){ todayIndex=idx; setDay(idx,true); }
     else { todayIndex=findTodayIndex(); updateTodayBack(); }
   }
 },1000);
})();
setupPrayerTracker(); updateFavCount();

function shareSection(event,btn){
 event.preventDefault(); event.stopPropagation();
 const root=btn.closest('.accordion,.story');
 if(!root) return;
 const title=root.querySelector('.storyTitle')?.textContent?.trim() || 'Hadith';
 const text=root.innerText.replace(/\s+/g,' ').trim();
 const data={title:'Fazilet Takvimi • '+title,text:text,url:location.href};
 if(navigator.share){ navigator.share(data).catch(()=>{}); }
 else if(navigator.clipboard){ navigator.clipboard.writeText(text+'\n'+location.href).then(()=>{btn.setAttribute('aria-label','Copiado');setTimeout(()=>btn.setAttribute('aria-label','Compartilhar esta seção'),1200)}).catch(()=>{}); }
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
